}
document.getElementById('fileInput').addEventListener('change', function(){
  const file = this.files && this.files[0];
  const target = importTarget;
  if(!file || !target) return;
  const isCSV = /\.csv$/i.test(file.name) || file.type === 'text/csv';
  const fr = new FileReader();
  fr.onload = async e => {
    try{
      let rows;
      if(isCSV){
        rows = parseCSV(new TextDecoder('utf-8').decode(new Uint8Array(e.target.result)));
      } else {
        const ok = await loadXLSX();
        if(!ok){ toast('Excel 解析组件加载失败（需要联网），请把文件另存为 CSV 后导入', 'err'); return; }
        const wb = XLSX.read(new Uint8Array(e.target.result), { type:'array', cellDates:true });
        const sh = wb.Sheets[wb.SheetNames[0]];
        if(!sh){ toast('未找到可读取的工作表', 'err'); return; }
        rows = XLSX.utils.sheet_to_json(sh, { defval:'' });
      }
      if(!rows || !rows.length){ toast('未解析到数据行，请检查表头与内容', 'err'); return; }
      snapshot('before-import', true); // 导入前留一份可恢复快照
      const res = handleImport(target, rows);
      saveDB(); render();
      showImportResult(target, res);
    }catch(err){ console.error('[import]', err); toast('导入失败：' + (err && err.message ? err.message : '未知错误'), 'err'); }
  };
  fr.onerror = () => toast('文件读取失败，请重试', 'err');
  fr.readAsArrayBuffer(file);
});
function hasCell(rw, names){ return names.some(n => rw[n] !== undefined && rw[n] !== null && String(rw[n]).trim() !== ''); }
function handleImport(page, rows){
  const items = [];
  let added = 0, updated = 0, skipped = 0, failed = 0;
  const push = (rw, status, note) => {
    const base = page === 'inventory'
      ? { 货号: pick(rw,['货号']), 颜色: pick(rw,['颜色']), 店铺: pick(rw,['店铺']) }
      : page === 'shipments'
      ? { 'FBA货件ID': pick(rw,['FBA货件ID','货件ID']), 'FBA仓': pick(rw,['FBA仓','仓库']), 'FBA货件名': pick(rw,['FBA货件名','货件名']), 货号: pick(rw,['货号']), 店铺: pick(rw,['店铺']) }
      : { '子ASIN': pick(rw,['子ASIN']), MSKU: pick(rw,['MSKU']), 货号: pick(rw,['货号']), 店铺: pick(rw,['店铺']) };
    items.push(Object.assign(base, { 状态: status, 说明: note }));
    if(status === '失败') failed++;
  };
  if(page === 'inventory'){
    rows.forEach(rw => {
      try{
        const sku = pick(rw, ['货号']); const color = pick(rw, ['颜色']);
        if(!sku || !color){ push(rw, '失败', !sku && !color ? '缺少货号与颜色' : (!sku ? '缺少货号' : '缺少颜色')); return; }
        const ex = (DB.inventory || []).find(x => x.sku === sku && x.color === color);
        const data = {
          sku, color,
          parent: pick(rw,['父ASIN','父体']) || (ex ? ex.parent : ''),
          shop: pick(rw,['店铺']) || (ex ? ex.shop : ''),
          // 空单元格不覆盖原值，避免一次不完整的导入把库存清零
          fbaTotal: hasCell(rw,['FBA库存总数','FBA总数','实时FBA库存总数']) ? num(pick(rw,['FBA库存总数','FBA总数','实时FBA库存总数'])) : (ex ? ex.fbaTotal : 0),
          fbaSellable: hasCell(rw,['FBA在售','在售库存']) ? num(pick(rw,['FBA在售','在售库存'])) : (ex ? ex.fbaSellable : 0),
          transit: hasCell(rw,['在途库存','在途']) ? num(pick(rw,['在途库存','在途'])) : (ex ? ex.transit : 0),
          updatedAt: pick(rw,['时间','数据时间','更新时间']) || today()
        };
        if(ex){
          if(String(data.updatedAt) >= String(ex.updatedAt || '')){ Object.assign(ex, data); updated++; push(rw, '成功', '按最新时间覆盖更新'); }
          else { skipped++; push(rw, '跳过', '数据时间早于现有记录，未覆盖'); }
        } else { DB.inventory.unshift(Object.assign(newRecord(), data, { id: uid('iv') })); added++; push(rw, '成功', '新增库存记录'); }
      }catch(e){ push(rw, '失败', '解析异常：' + e.message); }
    });
  } else if(page === 'shipments'){
    /* 严格规则：FBA货件ID 与 FBA仓 必须同时匹配同一条已有记录方可导入成功 */
    rows.forEach(rw => {
      try{
        const sid = pick(rw, ['FBA货件ID','货件ID']); const wh = pick(rw, ['FBA仓','仓库']);
        if(!sid || !wh){ push(rw, '失败', !sid && !wh ? '缺少FBA货件ID与FBA仓' : (!sid ? '缺少FBA货件ID' : '缺少FBA仓')); return; }
        const ex = (DB.shipments || []).find(x => x.shipmentId === sid && x.warehouse === wh);
        if(!ex){ push(rw, '失败', '未找到FBA货件ID与FBA仓同时匹配的记录'); return; }
        const g = (names, cur) => pick(rw, names) || cur || '';
        Object.assign(ex, {
          shop: g(['店铺'], ex.shop),
          createdAt: g(['创建时间'], ex.createdAt).replace(' ', 'T'),
          sku: g(['货号'], ex.sku), parent: g(['父ASIN'], ex.parent),
          name: g(['FBA货件名','货件名'], ex.name),
          method: g(['货代方式','物流方式'], ex.method),
          depart: g(['离港时间','离港'], ex.depart).slice(0, 10),
          arrive: g(['到港时间','到港'], ex.arrive).slice(0, 10),
          winStart: g(['预计送达时段开始','送达时段开始','时段开始'], ex.winStart).slice(0, 10),
          winEnd: g(['预计送达时段结束','送达时段结束','时段结束'], ex.winEnd).slice(0, 10),
          delivered: g(['送达时间','送达'], ex.delivered).slice(0, 10) // 表格没填送达时间时保留原值，不会被改成未送达
        });
        updated++; push(rw, '成功', 'FBA货件ID与FBA仓同时匹配，已覆盖更新');
      }catch(e){ push(rw, '失败', '解析异常：' + e.message); }
    });
  } else if(page === 'skus'){
    /* 严格规则：子ASIN 与 MSKU 必须同时匹配同一条已有记录方可导入成功 */
    rows.forEach(rw => {
      try{
        const ca = pick(rw, ['子ASIN']); const msku = pick(rw, ['MSKU']);
        if(!ca || !msku){ push(rw, '失败', !ca && !msku ? '缺少子ASIN与MSKU' : (!ca ? '缺少子ASIN' : '缺少MSKU')); return; }
        const ex = (DB.skus || []).find(x => x.childAsin === ca && x.msku === msku);
        if(!ex){ push(rw, '失败', '未找到子ASIN与MSKU同时匹配的记录'); return; }
        Object.assign(ex, {
          shop: pick(rw,['店铺']) || ex.shop, parent: pick(rw,['父ASIN','父体']) || ex.parent,
          color: pick(rw,['颜色']) || ex.color || '',        // 空值不覆盖已有颜色/图片
          img: pick(rw,['产品图片','图片']) || ex.img || '',
          fbaQty: hasCell(rw,['FBA库存数量','FBA库存']) ? num(pick(rw,['FBA库存数量','FBA库存'])) : (ex.fbaQty || 0),
          sku: pick(rw,['货号']) || ex.sku, type: pick(rw,['产品类型']) || ex.type
        });
        updated++; push(rw, '成功', '子ASIN与MSKU同时匹配，已覆盖更新');
      }catch(e){ push(rw, '失败', '解析异常：' + e.message); }
    });
  }
  return { added, updated, skipped, failed, items };
}

      </div>

    </div></div>`;
}
/* 下载导入结果表格（.xls 格式，Excel/WPS 可直接打开，失败行保留红色标记） */

      }).join('')
    + '</tbody></table></body></html>';
  const a = document.createElement('a');

let prefillUser = '';      // 重置成功后回填登录用户名
function validEmail(e){ return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(String(e || '').trim()); }
function findUserByEmail(email){
  const em = String(email || '').trim().toLowerCase();
  if(!em) return null;
  const users = getUsers();
  return Object.keys(users).find(n => String(users[n].email || '').toLowerCase() === em) || null;
}
function setPassword(name, pw){

}

function setLoginMode(m){ loginMode = m; if(m !== 'reset') resetUser = null; drawLogin(); }
function lgErr(msg){ const el = document.getElementById('lgErr'); if(el) el.textContent = msg || ''; }
function loginSubmit(ev){
  if(ev && ev.preventDefault) ev.preventDefault();
  const name = (document.getElementById('lgUser').value || '').trim();
  const pw = document.getElementById('lgPass').value || '';
  lgErr('');
  if(!name){ lgErr('请输入用户名'); return; }
  if(/\s/.test(name)){ lgErr('用户名不能包含空格'); return; }
  if(!pw){ lgErr('请输入密码'); return; }
  if(loginMode === 'register'){
    if(pw.length < 4){ lgErr('密码至少 4 位'); return; }
    const pw2 = document.getElementById('lgPass2').value || '';
    if(pw !== pw2){ lgErr('两次输入的密码不一致'); return; }
    const email = (document.getElementById('lgEmail').value || '').trim().toLowerCase();
    if(!email){ lgErr('请填写绑定邮箱（用于忘记密码时重置）'); return; }
    if(!validEmail(email)){ lgErr('邮箱格式不正确，请检查'); return; }
    const users = getUsers();
    if(users[name]){ lgErr('该用户名已被注册，请更换或改为登录'); return; }
    const owner = findUserByEmail(email);
    if(owner){ lgErr('该邮箱已被账号「' + owner + '」绑定，请更换'); return; }
    const salt = uid('s');
    users[name] = { salt, hash: hashPwd(pw, salt), email, createdAt: nowDT() };
    saveUsers(users);
    prefillUser = '';
    migrateLegacyData(name); // 首位注册用户继承旧版数据
    enterUser(name, { silent: true });
    const h = location.hash.slice(1);
    if(NAV.some(n => n.key === h)) S.page = h;
    render();
    toast('注册成功，欢迎 ' + name, 'ok');
  } else {
    const u = getUsers()[name];
    if(!u || hashPwd(pw, u.salt) !== u.hash){ lgErr('用户名或密码错误，忘记密码可用绑定邮箱重置'); return; }
    prefillUser = '';
    enterUser(name);
  }
}
/* 忘记密码：邮箱验证 → 设置新密码（无需原密码） */
function resetSubmit(ev){
  if(ev && ev.preventDefault) ev.preventDefault();
  lgErr('');
  if(!resetUser){
    const em = (document.getElementById('lgEmail').value || '').trim();
    if(!em){ lgErr('请输入绑定邮箱'); return; }
    if(!validEmail(em)){ lgErr('邮箱格式不正确，请检查'); return; }
    const owner = findUserByEmail(em);
    if(!owner){ lgErr('该邮箱未绑定任何账号，请检查邮箱或登录后在「账户设置」中绑定'); return; }
    resetUser = owner;
    drawLogin();
    toast('邮箱验证通过', 'ok');
    return;
  }
  const pw = document.getElementById('lgPass').value || '';
  const pw2 = document.getElementById('lgPass2').value || '';
  if(!pw){ lgErr('请输入新密码'); return; }
  if(pw.length < 4){ lgErr('密码至少 4 位'); return; }
  if(pw !== pw2){ lgErr('两次输入的密码不一致'); return; }
  const who = resetUser;
  setPassword(who, pw);
  resetUser = null; loginMode = 'login'; prefillUser = who;
  drawLogin();
  toast('密码已重置，请用新密码登录', 'ok');
}

  S.user = null; DB = null; S.page = 'home'; S.q = {}; S.remCol = {}; S.sort = {}; S.cols = {}; S.remOrder = null;
  try { document.getElementById('modalRoot').innerHTML = ''; } catch(e){}
  closeDrawer();
  prefillUser = '';
  showLogin();
}

        <div class="acc-sec">修改密码<span class="acc-hint">修改后请使用新密码登录</span></div>

        <div class="login-field"><label>新密码</label><input id="accNew" type="password" maxlength="32" placeholder="至少 4 位"></div>

        <div class="acc-bar ${pct >= 90 ? 'danger' : pct >= 70 ? 'warn' : ''}"><span style="width:${pct}%"></span></div>

        <div class="acc-sub">回收站：${(DB.trash || []).length} 条记录（删除后保留 ${TRASH_DAYS} 天，期间可恢复，到期自动彻底删除）</div>
        <div class="acc-acts">
          <button class="btn ghost sm" onclick="exportBackup()">⬇ 导出全部数据</button>
          <button class="btn ghost sm" onclick="importBackupPick()">⬆ 导入备份</button>
          <button class="btn ghost sm" onclick="restoreSnapshot()">↺ 恢复自动快照</button>
          <button class="btn ghost sm" onclick="closeModal();go('trash')">🗑 打开回收站</button>
        </div>
        <div class="acc-err" id="accDataMsg"></div>

        <div class="acc-sec">长期使用维护<span class="acc-hint">数据积累较多时，归档已完成的历史记录可释放本地空间</span></div>
        <div class="acc-sub">记录数：产品 ${st.products} · 货件 ${st.shipments} · 库存 ${st.inventory} · 促销 ${st.promotions} · 工厂单 ${st.factoryOrders} · 打样 ${st.sampling} · SKU ${st.skus}<br>本地图片占用约 ${st.imgKB}K（建议单账号控制在 1200K 以内，超出请改用图片链接）</div>

/* ================= 长期维护：容量统计 / 归档清理 / 自检 ================= */
function imgUsageChars(){
  let n = 0;
  const add = v => { if(typeof v === 'string' && v.slice(0, 11) === 'data:image/') n += v.length; };
  (DB.products || []).forEach(p => (p.colors || []).forEach(c => add(c.img)));
  (DB.skus || []).forEach(s => add(s.img));
  return n;
}
function dataStats(){
  const c = k => (DB[k] || []).length;
  return { products:c('products'), promotions:c('promotions'), shipments:c('shipments'), inventory:c('inventory'),
    factoryOrders:c('factoryOrders'), sampling:c('sampling'), skus:c('skus'), creators:c('creators'), ads:c('ads'),
    imgKB: Math.round(imgUsageChars() / 1024) };
}
function archiveCutoff(days){ const d = new Date(); d.setDate(d.getDate() - days); return iso(d); }
function archiveCount(days){
  const cut = archiveCutoff(days || 180);
  return {
    shipments: (DB.shipments || []).filter(s => s.delivered && String(s.delivered).slice(0,10) < cut).length,
    promotions: (DB.promotions || []).filter(p => p.end && String(p.end).slice(0,10) < cut).length,
    factoryOrders: (DB.factoryOrders || []).filter(o => o.shippedAt && String(o.shippedAt).slice(0,10) < cut).length,
    sampling: (DB.sampling || []).filter(s => s.doneAt && String(s.doneAt).slice(0,10) < cut).length
  };
}
function archiveOldData(days){
  days = days || 180;
  const c = archiveCount(days);
  const total = c.shipments + c.promotions + c.factoryOrders + c.sampling;
  if(!total){ toast('没有超过 ' + days + ' 天且已完成的历史记录，暂不需要清理', 'ok'); return; }
  confirmModal('将清理 ' + days + ' 天前已完成的记录：已送达货件 ' + c.shipments + ' 票、已结束促销 ' + c.promotions +
    ' 条、已出货工厂单 ' + c.factoryOrders + ' 条、已完成打样 ' + c.sampling + ' 条，共 ' + total +
    ' 条。清理前会自动导出完整备份文件，可随时从该文件恢复。确定继续吗？', () => {
    try{
      exportBackup(); // 先留一份完整备份
      const cut = archiveCutoff(days);
      DB.shipments = DB.shipments.filter(s => !(s.delivered && String(s.delivered).slice(0,10) < cut));
      DB.promotions = DB.promotions.filter(p => !(p.end && String(p.end).slice(0,10) < cut));
      DB.factoryOrders = DB.factoryOrders.filter(o => !(o.shippedAt && String(o.shippedAt).slice(0,10) < cut));
      DB.sampling = DB.sampling.filter(s => !(s.doneAt && String(s.doneAt).slice(0,10) < cut));
      saveDB(true); render(); openAccountPanel();
      toast('已归档清理 ' + total + ' 条历史记录，备份文件已下载', 'ok');
    }catch(e){ console.error(e); toast('清理失败：' + e.message, 'err'); }
  }, '确认清理');
}
/* 一键自检：把最容易出问题的几项做成可读结论，便于定期确认数据健康度 */
function selfCheck(){
  const issues = [], notes = [];
  const pct = storagePct();
  notes.push('存储占用 ' + pct + '%（' + Math.round(usageChars()/1024) + 'K / 约 4500K）');
  if(pct >= 90) issues.push('存储空间即将耗尽：请导出备份并归档旧数据，或把本地图片改为链接');
  else if(pct >= 70) notes.push('存储偏满，建议归档 180 天前的历史记录');

  const imgK = Math.round(imgUsageChars()/1024);
  notes.push('本地图片占用 ' + imgK + 'K');
  if(imgK > 1200) issues.push('本地图片超过 1200K：本地存储约 5M 上限，图片过多会挤压业务数据空间');

  const st = dataStats();
  notes.push('记录数：产品 ' + st.products + ' · 货件 ' + st.shipments + ' · 库存 ' + st.inventory + ' · 促销 ' + st.promotions +
    ' · 工厂单 ' + st.factoryOrders + ' · 打样 ' + st.sampling + ' · SKU ' + st.skus);

  // 结构完整性
  const bad = COLLS.filter(k => !Array.isArray(DB[k]));
  if(bad.length) issues.push('数据结构异常：' + bad.join('、') + ' 不是数组');
  // 重复 id（同一集合内重复会导致编辑删错行）
  let dup = 0;
  COLLS.forEach(k => {
    const seen = new Set();
    (DB[k] || []).forEach(r => { if(!r || !r.id) return; if(seen.has(r.id)) dup++; else seen.add(r.id); });
  });
  if(dup) issues.push('发现 ' + dup + ' 个重复 id 的记录（建议导出备份后检查）');
  // 关键字段缺失
  const noSku = (DB.products || []).filter(p => !p.sku).length;
  if(noSku) issues.push(noSku + ' 个产品缺少货号');
  const noShipId = (DB.shipments || []).filter(s => !s.shipmentId).length;
  if(noShipId) notes.push(noShipId + ' 票货件未填 FBA 货件ID（不影响提醒，仅导入匹配需要）');

  const bak = readSnapshot();
  notes.push(bak ? '最近快照：' + new Date(bak.at).toLocaleString('zh-CN', { hour12: false }) : '暂无自动快照（数据变动后会自动生成）');

  const msg = (issues.length ? '⚠ 发现 ' + issues.length + ' 项需要处理：\n· ' + issues.join('\n· ') + '\n\n' : '✅ 自检通过，未发现影响稳定运行的问题。\n\n') + notes.join('\n');
  const el = document.getElementById('selfCheckMsg');
  if(el){
    el.style.whiteSpace = 'pre-wrap';
    el.style.color = issues.length ? '' : 'var(--acc)'; // 通过用主题色，问题用告警色
    el.textContent = msg;
  }
  toast(issues.length ? '自检发现 ' + issues.length + ' 项待处理问题' : '自检通过：数据状态正常', issues.length ? 'err' : 'ok');
  return { issues, notes, pct, imgK };
}

/* ================= 数据备份 / 恢复 ================= */
function exportBackup(){
  try{
    if(!DB){ toast('尚未登录', 'err'); return; }
    snapshot('export', true);
    const payload = {
      app: 'amz-workbench', ver: DB_VERSION, user: S.user, exportedAt: nowDT(),
      db: DB,
      settings: {
        remCol: S.remCol, sort: S.sort, cols: S.cols, remOrder: S.remOrder,
        theme: document.documentElement.getAttribute('data-theme') || 'forest'
      },
      account: { name: S.user, email: (getUsers()[S.user] || {}).email || '' }
    };
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(payload)], { type: 'application/json' }));
    const d = new Date(), p2 = n => String(n).padStart(2, '0');
    a.download = `亚马逊工作台备份_${S.user}_${d.getFullYear()}${p2(d.getMonth()+1)}${p2(d.getDate())}_${p2(d.getHours())}${p2(d.getMinutes())}.json`;
    a.click();
    setTimeout(() => { try { URL.revokeObjectURL(a.href); } catch(e){} }, 5000);
    toast('备份已导出（含全部业务数据与个人设置）', 'ok');
  }catch(e){ console.error(e); toast('导出失败：' + e.message, 'err'); }
}
function importBackupPick(){
  const inp = document.getElementById('bakFileInput');
  if(!inp) return;
  inp.value = ''; inp.click();
}
function onBackupFile(input){
  const f = input.files && input.files[0]; if(!f) return;
  const fr = new FileReader();
  fr.onload = () => {
    let obj = null;
    try { obj = JSON.parse(String(fr.result || '')); } catch(e){ toast('文件不是有效的 JSON 备份', 'err'); return; }
    if(!obj || !obj.db || !Array.isArray(obj.db.products)){ toast('备份文件格式不正确（缺少业务数据）', 'err'); return; }
    confirmModal('导入将覆盖当前账号的全部业务数据（当前数据会先自动存一份快照）。确定继续吗？', () => {
      try{
        snapshot('before-import', true);
        DB = normalizeDB(obj.db);
        saveDB();
        if(obj.settings){
          S.remCol = obj.settings.remCol || {}; S.sort = obj.settings.sort || {};
          S.cols = obj.settings.cols || {}; S.remOrder = obj.settings.remOrder || null;
          saveRemCol(); saveSort(); saveCols(); saveRemOrder();
          if(obj.settings.theme) applyThemeQuiet(obj.settings.theme);
        }
        render();
        toast('备份已导入：' + DB.products.length + ' 个产品 / ' + (DB.shipments || []).length + ' 票货件', 'ok');
      }catch(e){ console.error(e); toast('导入失败：' + e.message, 'err'); }
    });
  };
  fr.onerror = () => toast('文件读取失败，请重试', 'err');
  fr.readAsText(f);
}
function restoreSnapshot(){
  const bak = readSnapshot();
  if(!bak){ toast('暂无可用自动快照（数据变动后会自动生成）', 'err'); return; }
  const t = new Date(bak.at || 0), p2 = n => String(n).padStart(2, '0');
  const when = t.getFullYear() + '-' + p2(t.getMonth()+1) + '-' + p2(t.getDate()) + ' ' + p2(t.getHours()) + ':' + p2(t.getMinutes());
  confirmModal('将恢复到 ' + when + ' 的自动快照，当前数据会被覆盖（覆盖前会再存一份快照）。确定继续吗？', () => {
    try{
      const parsed = JSON.parse(bak.json);
      snapshot('before-restore', true);
      DB = normalizeDB(parsed);
      saveDB(); render();
      toast('已恢复到 ' + when + ' 的数据', 'ok');
    }catch(e){ console.error(e); toast('快照恢复失败：' + e.message, 'err'); }
  });
}
function accErr(id, msg){ const el = document.getElementById(id); if(el) el.textContent = msg || ''; }
function saveEmail(){
  accErr('accErr', '');
  const em = (document.getElementById('accEmail').value || '').trim().toLowerCase();
  if(!em){ accErr('accErr', '请输入邮箱地址'); return; }
  if(!validEmail(em)){ accErr('accErr', '邮箱格式不正确，请检查'); return; }
  const owner = findUserByEmail(em);
  if(owner && owner !== S.user){ accErr('accErr', '该邮箱已被账号「' + owner + '」绑定，请更换'); return; }
  const users = getUsers();
  if(!users[S.user]) return;
  users[S.user].email = em; saveUsers(users);
  toast('邮箱已绑定：' + em, 'ok');
  openAccountPanel();
}
function savePassword(){
  accErr('accPwErr', '');
  const oldPw = document.getElementById('accOld').value || '';
  const nw = document.getElementById('accNew').value || '';
  const nw2 = document.getElementById('accNew2').value || '';
  const u = getUsers()[S.user];
  if(!u){ toast('账号状态异常，请重新登录', 'err'); return; }
  if(!oldPw){ accErr('accPwErr', '请输入当前密码'); return; }
  if(hashPwd(oldPw, u.salt) !== u.hash){ accErr('accPwErr', '当前密码不正确'); return; }
  if(!nw){ accErr('accPwErr', '请输入新密码'); return; }
  if(nw.length < 4){ accErr('accPwErr', '密码至少 4 位'); return; }
  if(nw !== nw2){ accErr('accPwErr', '两次输入的新密码不一致'); return; }
  if(nw === oldPw){ accErr('accPwErr', '新密码不能与当前密码相同'); return; }
  setPassword(S.user, nw);
  toast('密码已修改，下次登录请使用新密码', 'ok');
  openAccountPanel();
}

/* ================= 启动 ================= */
(function boot(){
  try{
    const sess = safeGet(SESSION_KEY);
    if(sess && getUsers()[sess]) enterUser(sess, { silent: true });
    else { showLogin(); return; }
    const _h = location.hash.slice(1);
    if(NAV.some(n => n.key === _h)) S.page = _h;
    render();
  }catch(e){
    console.error('[boot]', e);
    try { showLogin(); } catch(_){}
    setTimeout(() => { try { toast('初始化异常：' + e.message + '，请导出备份后反馈', 'err'); } catch(_){} }, 300);
  }
})();
window.addEventListener('hashchange', () => { if(!S.user) return; const h = location.hash.slice(1); if(NAV.some(n => n.key === h) && h !== S.page){ S.page = h; closeDrawer(); render(); } });
/* 回收站到期巡检：应用长时间开着也能按期彻底删除（每 30 分钟一次） */
setInterval(() => {
  if(!DB) return;
  try {
    if(purgeTrash(true)){ saveDB(); if(S.page === 'trash') render(); }
  } catch(e){ console.error('[trash]', e); }
}, 30 * 60 * 1000);
/* Esc 关闭弹窗（桌面端习惯操作） */
document.addEventListener('keydown', e => {
  if(e.key === 'Escape'){
    const root = document.getElementById('modalRoot');
    if(root && root.innerHTML) closeModal();
  }
});
/* 跨天自动刷新提醒：网页长期挂着也能看到当天提醒，不打断正在填写的内容 */
let lastDaySeen = today();
setInterval(() => {
  try{
    if(!S.user || !DB) return;
    const d = today();
    if(d === lastDaySeen) return;
    lastDaySeen = d;
    const ae = document.activeElement;
    const typing = ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName || '');
    if(document.querySelector('#modalRoot .overlay') || typing) return; // 正在编辑时不打断
    render();
    toast('已跨天，提醒已按 ' + d + ' 重新计算', 'ok');
  }catch(e){ console.error('[dayRollover]', e); }
}, 60000);
/* 多标签页同步：其他标签页保存后自动同步，避免互相覆盖 */
window.addEventListener('storage', ev => {
  try{
    if(!S.user || !ev.key) return;
    if(ev.key !== ukey('workbench')) return;
    if(document.querySelector('#modalRoot .overlay')){
      toast('其他标签页已更新数据，请先关闭弹窗并刷新本页，避免覆盖', 'err');
      return;
    }
    loadDB({ persist: false }); // 只读同步，不回写，避免两个标签页互相触发写入
    render();
    toast('已同步其他标签页的数据更新', 'ok');
  }catch(e){ console.error('[storage]', e); }
});
/* 保存失败时离开页面给出提示，避免静默丢数据 */
window.addEventListener('beforeunload', e => {
  if(!saveFailed) return;
  e.preventDefault();
  e.returnValue = '数据尚未成功保存到本地，确定离开吗？';
  return e.returnValue;
});
/* 未捕获异常集中记录，便于排查；不打断用户操作 */
let _errShownAt = 0;
window.addEventListener('error', ev => {
  console.error('[global]', ev.error || ev.message);
  const now = Date.now();
  if(now - _errShownAt < 5000) return;
  _errShownAt = now;
  try { toast('操作出现异常，已记录。若界面异常请导出备份后刷新', 'err'); } catch(e){}
});
window.addEventListener('unhandledrejection', ev => { console.error('[promise]', ev.reason); });
/* 跨断点（桌面 ↔ 手机）时重绘一次：手机卡片布局的字段标签只在窄屏注入 */
let _wasMobile = window.innerWidth <= 900;
window.addEventListener('resize', () => {
  if(window.innerWidth > 900) closeDrawer();
  const m = window.innerWidth <= 900;
  if(m !== _wasMobile){ _wasMobile = m; try { if(S.user && DB) render(); } catch(e){ console.error('[resize]', e); } }
});
</script>

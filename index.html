*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"PingFang SC","Microsoft YaHei",-apple-system,sans-serif;background:var(--bg);color:var(--txt);font-size:14px}
button{font-family:inherit;cursor:pointer;border:none;border-radius:9px;font-size:13px;white-space:nowrap}
input,select,textarea{font-family:inherit;font-size:13px;color:var(--txt);border:1px solid var(--line);border-radius:9px;padding:7px 10px;background:var(--card);outline:none;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-ring)}
label{font-size:12px;color:var(--sub);display:block;margin-bottom:5px}
.nav::-webkit-scrollbar,.content::-webkit-scrollbar,.modal-body::-webkit-scrollbar{width:8px}
.nav::-webkit-scrollbar-thumb,.content::-webkit-scrollbar-thumb,.modal-body::-webkit-scrollbar-thumb{background:var(--scroll);border-radius:99px}

/* ===== 布局 ===== */
.app{display:flex;height:100vh;overflow:hidden}
@supports (height:100dvh){.app{height:100dvh}} /* 安卓/HarmonyOS 浏览器地址栏动态视口，防底部被裁 */
.sidebar{width:232px;background:linear-gradient(180deg,var(--side1) 0%,var(--side2) 55%,var(--side3) 100%);border-right:1px solid var(--line);display:flex;flex-direction:column;flex-shrink:0;transition:width .2s}
.sidebar.collapsed{width:64px}
.sidebar.collapsed .nav-txt,.sidebar.collapsed .brand-txt,.sidebar.collapsed .collapse-label,.sidebar.collapsed .nav-grp,.sidebar.collapsed .sf-txt{display:none}
.brand{display:flex;align-items:center;gap:11px;padding:20px 16px 14px}
.brand-icon{width:38px;height:38px;border-radius:12px;background:var(--acc);color:var(--acc-txt);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;flex-shrink:0;box-shadow:0 4px 10px var(--acc-glow)}
.brand-txt b{display:block;font-size:14.5px;letter-spacing:.3px}
.brand-txt span{display:block;font-size:11px;color:var(--sub);margin-top:2px}
.nav{flex:1;overflow-y:auto;padding:2px 12px 10px}
.nav-grp{font-size:11px;color:var(--nav-grp);padding:16px 6px 6px;letter-spacing:1px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;color:var(--nav-txt);cursor:pointer;margin-bottom:2px;transition:all .15s;white-space:nowrap;font-size:13.5px}
.nav-item:hover{background:var(--acc-soft);color:var(--txt)}
.nav-item.active{background:var(--acc);color:var(--acc-txt);font-weight:600;box-shadow:0 4px 12px var(--acc-glow)}
.nav-item .nav-ico{width:20px;display:flex;justify-content:center;flex-shrink:0}
.nav-item .nav-ico svg{width:17px;height:17px}
.side-foot{display:flex;align-items:center;gap:9px;padding:14px 18px;border-top:1px solid var(--line)}
/* 侧栏快捷区（仅手机端显示：主题切换 / 提醒入口） */
.sb-quick{display:none}
.sbq-btn{position:relative;width:46px;min-height:46px;display:flex;align-items:center;justify-content:center;background:none;color:var(--nav-txt);border-radius:11px;cursor:pointer;border:none;padding:0}
.sbq-btn svg{width:20px;height:20px}
.sbq-btn:active{background:var(--acc-soft)}
.side-foot .sf-ico{width:26px;height:26px;border-radius:8px;background:var(--acc-bg);color:var(--acc);display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.side-foot .sf-txt b{display:block;font-size:12.5px}
.side-foot .sf-txt span{display:block;font-size:11px;color:var(--sub);margin-top:1px}
.collapse-btn{margin:0 14px 14px;padding:8px;border-radius:8px;background:transparent;color:var(--sub);font-size:12px}
.collapse-btn:hover{color:var(--acc);background:var(--acc-soft)}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{height:60px;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:20px;padding:0 24px;flex-shrink:0}
.crumb{color:var(--sub);font-size:13px;white-space:nowrap}
.crumb b{color:var(--txt);font-weight:600}
.top-right{margin-left:auto;display:flex;align-items:center;gap:12px}
.top-ico{background:none;color:var(--sub);position:relative;padding:7px;border-radius:9px;display:flex}
.top-ico svg{width:18px;height:18px}
.top-ico:hover{background:var(--pill);color:var(--txt)}
.bell-dot{position:absolute;top:5px;right:5px;width:8px;height:8px;background:var(--err);border-radius:50%;border:2px solid var(--card)}
.avatar{display:flex;align-items:center;gap:9px}
.avatar-circle{width:36px;height:36px;border-radius:50%;background:var(--acc);color:var(--acc-txt);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600}
.avatar-meta b{display:block;font-size:13px}
.avatar-meta span{font-size:11px;color:var(--sub)}
.content{flex:1;overflow-y:auto;padding:26px 30px}
.page-head{margin-bottom:20px}
.page-head h1{font-size:24px;font-weight:700;letter-spacing:.3px}
.page-head p{color:var(--sub);font-size:13px;margin-top:5px}

/* ===== 通用组件 ===== */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:18px}
.card-head{padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.card-head h2{font-size:15px;font-weight:600;display:flex;align-items:center;gap:9px}
.h2-ico{display:inline-flex;color:var(--acc)}
.h2-ico svg{width:16px;height:16px}
.count-badge{background:var(--acc);color:var(--acc-txt);font-size:11px;border-radius:999px;padding:1px 9px;min-width:20px;text-align:center;font-weight:500}
.count-badge.zero{background:var(--zero)}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.head-left{display:flex;align-items:center;gap:14px;flex-wrap:wrap;min-width:0}
.head-left .search-wrap{flex:0 1 330px;min-width:220px}
.color-cell.clickable{cursor:pointer}
.color-cell.clickable:hover .thumb{outline:2px solid var(--acc);outline-offset:1px}
.det-img{width:100%;max-width:280px;height:200px;border-radius:12px;background-size:cover;background-position:center;background-color:var(--img-bg);margin:0 auto 4px}
.det-img.noimg{display:flex;align-items:center;justify-content:center;color:var(--empty);font-size:13px}
.det-grid{display:grid;grid-template-columns:70px 1fr;gap:9px 14px;font-size:13.5px;margin-top:12px}
.det-grid .k{color:var(--sub)}
.det-grid .v{font-weight:500}
.search-wrap{display:flex;gap:8px;align-items:center;flex:1;min-width:260px;max-width:430px}
.search-wrap input{min-width:0;border-radius:999px;padding:8px 15px;background:var(--panel);border-color:transparent}
.search-wrap input:focus{background:var(--card);border-color:var(--acc)}
.btn{background:var(--acc);color:var(--acc-txt);padding:8px 14px;font-weight:500}
.btn:hover{background:var(--acc-deep)}
.btn.ghost{background:var(--card);color:var(--txt);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--acc);color:var(--acc);background:var(--acc-bg)}
.btn.danger{background:var(--err)}
.btn.warn{background:var(--warn)}
.btn.sm{padding:4px 10px;font-size:12px;border-radius:7px}
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:12px;color:var(--sub);font-weight:600;text-align:left;padding:11px 16px;background:var(--th-bg);border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:12px 16px;border-bottom:1px solid var(--td-line);vertical-align:middle}
.tbl tbody tr:hover{background:var(--hover)}
.tbl tbody tr:last-child td{border-bottom:none}
.thumb{width:44px;height:44px;border-radius:10px;background-size:cover;background-position:center;background-color:var(--img-bg);flex-shrink:0}
.thumb-empty{display:flex;align-items:center;justify-content:center;color:var(--empty);font-size:11px;background:var(--img-bg)}
.tag{display:inline-flex;align-items:center;font-size:11px;border-radius:999px;padding:3px 10px;white-space:nowrap;font-weight:500}
.tag.ok{background:var(--ok-bg);color:var(--ok)}
.tag.warn{background:var(--warn-bg);color:var(--warn)}
.tag.err{background:var(--err-bg);color:var(--err)}
.tag.info{background:var(--info-bg);color:var(--info)}
.tag.gray{background:var(--tag-gray);color:var(--sub)}
.empty{padding:36px;text-align:center;color:var(--empty)}
.link-btn{color:var(--acc);background:none;padding:2px 4px;font-size:13px}
.link-btn:hover{text-decoration:underline}
.mini-btn{background:var(--card);border:1px solid var(--line);color:var(--sub);padding:2px 7px;font-size:12px;border-radius:7px}
.mini-btn:hover{color:var(--acc);border-color:var(--acc)}
.chip{display:inline-flex;align-items:center;gap:4px;background:#f1efe7;border-radius:999px;padding:2px 9px;font-size:12px;margin:2px 3px 2px 0;color:var(--sub);background:var(--chip-bg)}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.err{background:var(--err-bg);color:var(--err)}
.color-cells{display:flex;gap:6px;flex-wrap:wrap}
.color-cell{text-align:center}
.color-cell .thumb{width:36px;height:36px}
.color-cell span{display:block;font-size:10px;color:var(--sub);margin-top:2px}

/* 统计卡片 */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;margin-bottom:18px}
.stat-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;display:flex;align-items:center;gap:14px}
.stat-ico{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.stat-ico svg{width:20px;height:20px}
.s-green{background:var(--acc-bg);color:var(--acc)}
.s-blue{background:var(--info-bg);color:var(--info)}
.s-orange{background:var(--warn-bg);color:var(--warn)}
.s-red{background:var(--err-bg);color:var(--err)}
.stat-label{font-size:12px;color:var(--sub)}
.stat-num{font-size:22px;font-weight:700;margin-top:3px}
.stat-num span{font-size:12px;color:var(--sub);font-weight:400;margin-left:6px}
.stat-card.clickable{cursor:pointer;transition:transform .15s,box-shadow .15s}
.stat-card.clickable:hover{transform:translateY(-2px);box-shadow:var(--shadow),0 6px 16px rgba(0,0,0,.10)}
.stat-card.clickable:active{transform:translateY(0)}

/* 表格表头点击排序 */
.tbl thead th.sortable{cursor:pointer;user-select:none}
.tbl thead th.sortable:hover{color:var(--acc)}
.sort-ar{color:var(--acc);font-size:10px;margin-left:2px}
.tbl thead th[draggable="true"]{cursor:grab}
.tbl thead th.drop-before{box-shadow:inset 3px 0 0 var(--acc)}
.tbl thead th.drop-after{box-shadow:inset -3px 0 0 var(--acc)}

/* 提醒卡片拖拽手柄 */
.drag-handle{cursor:grab;color:var(--sub);font-size:15px;line-height:1;padding:5px 4px;border-radius:6px;user-select:none;touch-action:none;flex:0 0 auto}
.drag-handle:hover{color:var(--acc);background:var(--hover)}
.drag-handle:active{cursor:grabbing}

/* 提醒中心 */
.remind-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px}
.remind-item{display:flex;align-items:flex-start;gap:10px;padding:11px 14px;border-radius:12px;background:var(--panel);margin-bottom:8px}
.remind-item:hover{background:var(--hover)}
.remind-item .r-txt{flex:1;min-width:0}
.remind-item .r-title{font-weight:500;margin-bottom:2px}
.remind-item .r-sub{color:var(--sub);font-size:12px}

/* 提醒卡片展开/折叠 */
.rem-body{padding:14px 16px}
.rem-body.hidden{padding:10px 16px}
.rem-body.hidden .empty{padding:8px}
.head-acts{display:flex;align-items:center;gap:8px}
.rem-toggle{min-width:76px;justify-content:center}
.rem-toggle:hover{border-color:var(--acc)}

/* Excel 导入结果回传 */
.imp-sum{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.imp-sum .tag{font-size:12.5px;padding:5px 13px}
.imp-wrap{max-height:320px;overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.imp-tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.imp-tbl th{position:sticky;top:0;background:var(--th-bg);color:var(--sub);font-weight:600;padding:7px 10px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--line)}
.imp-tbl td{padding:7px 10px;border-bottom:1px solid var(--td-line);color:var(--txt);word-break:break-all;white-space:normal}
.imp-tbl tr:last-child td{border-bottom:none}
.imp-tbl tr.imp-fail td{background:var(--err-bg);color:var(--err);font-weight:600}
.imp-tbl tr.imp-skip td{color:var(--sub)}
.imp-note{font-size:12px;color:var(--sub);margin-top:10px}
.imp-note b{color:var(--err)}
/* 模态框 */
.overlay{position:fixed;inset:0;background:var(--overlay);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal{background:var(--card);border-radius:16px;width:640px;max-width:96vw;max-height:88vh;display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(0,0,0,.2)}
.modal.wide{width:860px}
.modal.xl{width:980px}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal-head h3{font-size:15px;font-weight:600}
.modal-close{background:none;font-size:20px;color:var(--sub);line-height:1;padding:2px 6px}
.modal-close:hover{color:var(--err)}
.modal-body{padding:18px 20px;overflow-y:auto}
.modal-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.form-grid .full{grid-column:1/-1}

/* 主题选择面板 */
.theme-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.theme-card{border:2px solid var(--line);border-radius:14px;padding:9px;cursor:pointer;background:var(--card);transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease}
.theme-card:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--acc)}
.theme-card.active{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-ring)}
.theme-prev{position:relative;height:86px;border-radius:9px;overflow:hidden;display:flex}
.tp-side{width:26%;display:flex;flex-direction:column;align-items:center;padding-top:9px;gap:5px}
.tp-brand{width:18px;height:18px;border-radius:6px}
.tp-dot{width:14px;height:6px;border-radius:99px;opacity:.85}
.tp-main{flex:1;padding:9px 9px}
.tp-bar{height:16px;border-radius:6px;display:flex;align-items:center;gap:4px;padding:0 6px}
.tp-bar span{width:16px;height:5px;border-radius:99px;display:block}
.tp-pills{display:flex;gap:5px;margin-top:8px}
.tp-pills span{width:22px;height:10px;border-radius:99px;display:block}
.tp-check{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;background:var(--acc);color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.theme-meta{padding:9px 4px 2px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.theme-meta b{font-size:13.5px}
.theme-desc{display:block;width:100%;font-size:12px;color:var(--sub);margin-top:2px}
.pe-sec{margin-bottom:18px}
.pe-sec>h4{font-size:13px;color:var(--acc);margin-bottom:9px;padding-bottom:6px;border-bottom:1px dashed var(--line)}
.pe-row{display:grid;grid-template-columns:44px 1fr 1.8fr 1.8fr 34px;gap:8px;margin-bottom:8px;align-items:center}
.pe-row.adj{grid-template-columns:150px 1fr 34px}
.row-del{background:none;color:var(--row-del);font-size:16px;padding:4px}
.row-del:hover{color:var(--err)}
/* 产品编辑器颜色行内的图片组（链接 + 本地上传） */
.pe-img{display:flex;align-items:center;gap:6px;min-width:0}
.pe-cur{flex:1;min-width:0;padding:7px 9px;font-size:12.5px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--txt);outline:none}
.pe-cur:focus{border-color:var(--acc)}
.pe-up{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--acc);font-size:11.5px;padding:6px 8px;border-radius:8px;cursor:pointer;white-space:nowrap}
.pe-up:hover{border-color:var(--acc);background:var(--pill)}
.pe-tag{flex:0 0 auto;font-size:11px;color:var(--sub);padding:3px 7px;border-radius:20px;background:var(--pill);cursor:pointer;white-space:nowrap}
.pe-tag:hover{color:var(--acc)}
/* 通用图片字段（链接 / 本地上传 双模式） */
.imgf{grid-column:1/-1;display:flex;gap:11px;align-items:flex-start;padding:11px;border:1px solid var(--line);border-radius:11px;background:var(--panel)}
.imgf-prev{width:66px;height:66px;flex:0 0 auto;border-radius:10px;border:1px solid var(--line);background:var(--img-bg) center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-size:19px;color:var(--empty)}
.imgf-main{flex:1;min-width:0}
.imgf-label{font-size:12px;color:var(--sub);margin-bottom:6px}
.imgf-tabs{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:2px;margin-bottom:7px}
.itab{border:0;background:transparent;color:var(--sub);font-size:12px;padding:4px 10px;border-radius:6px;cursor:pointer;transition:.15s}
.itab.on{background:var(--acc);color:var(--acc-txt)}
.imgf-url{width:100%;box-sizing:border-box;padding:8px 10px;font-size:13px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--txt);outline:none;transition:.15s}
.imgf-url:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(46,125,91,.12)}
.imgf-local{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.imgf-file{font-size:11px;color:var(--sub);word-break:break-all}
.term-list .term{display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:8px;margin-bottom:4px;background:var(--panel)}
.term .t-txt{flex:1;font-size:12.5px}
.term-add{display:flex;gap:6px;margin-top:6px}
.act-mini{background:var(--panel);border:1px solid var(--panel-line);border-radius:10px;padding:6px 9px;margin-bottom:6px;font-size:12px}
.act-mini .am-meta{color:var(--sub);font-size:11px;margin-top:3px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
/* 父ASIN 分组标题行 */
.grp-row td{padding:9px 16px;background:var(--th-bg);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.grp-in{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.grp-p{font-weight:700;font-size:13px;letter-spacing:.3px}
.fold-btn{border:1px solid var(--line);background:var(--card);color:var(--txt);width:24px;height:24px;border-radius:6px;cursor:pointer;font-size:12px;line-height:1;flex:none}
.fold-btn:hover{background:var(--th-bg)}
.grp-chips{display:inline-flex;gap:4px;flex-wrap:wrap}
.cm{font-style:normal;font-size:10px;font-weight:700;border-radius:4px;padding:0 3px;line-height:15px}
.cm.ok{background:rgba(46,125,91,.15);color:#256b4c}
.cm.err{background:rgba(200,80,80,.15);color:#b04a4a}
.hint-line{padding:8px 16px;margin:0;color:var(--sub);font-size:12px;border-top:1px dashed var(--line)}
.sku-node td{padding:5px 16px 5px 38px;background:var(--pill);border-bottom:1px solid var(--line)}
.sku-node-in{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sku-node-label{font-weight:700;font-size:12px;color:var(--acc)}
.grp-sub{font-size:12px;color:var(--sub)}
.grp-acts{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.mini-date{border:1px solid var(--line);background:var(--card);color:var(--txt);border-radius:6px;padding:2px 5px;font-size:11px;font-family:inherit;max-width:9.4em}
.mini-date:focus{outline:none;border-color:var(--acc)}
/* 批量添加活动：父ASIN 多选 */
.pm-box{border:1px solid var(--line);border-radius:10px;padding:6px;max-height:196px;overflow:auto;background:var(--panel)}
.pm-chk{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:8px;font-size:13px;cursor:pointer}
.pm-chk:hover{background:var(--hover)}
.pm-chk input{accent-color:var(--acc);width:16px;height:16px;flex:0 0 auto}
.pm-tools{display:flex;gap:10px;align-items:center;margin:8px 0 6px;font-size:12px;color:var(--sub);flex-wrap:wrap}
.pm-empty{padding:12px;color:var(--sub);font-size:12px}
.copy-note{background:var(--panel);border:1px solid var(--panel-line);border-radius:10px;padding:10px 12px;font-size:12.5px;color:var(--sub);line-height:1.8;margin-bottom:12px}
.desc-list{width:100%}
.desc-list td,.desc-list th{padding:6px 8px;font-size:12.5px}

/* Toast */
#toastRoot{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:var(--toast);color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.25);animation:fadein .2s}
.toast.ok{background:var(--acc)}
.toast.err{background:var(--err)}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
/* ==================================================================
   布局优化 v2 · 桌面 / 通用视觉层
   放在响应式规则之前：后续手机 / Mate / 横屏 media 仍保持原有优先级，
   本段只调整外观与信息层次，不改动任何 DOM、ID、事件与业务逻辑。
   ================================================================== */
/* --- 全局按钮与文字细节 --- */
.btn{transition:background .16s,transform .16s,box-shadow .16s}
.btn:active{transform:translateY(1px)}
.tag{font-weight:600}
.empty{font-size:13px}

/* --- 侧栏：分组带分隔线，图标独立成块，层级更清楚 --- */
.sidebar{width:246px}
.brand{padding:22px 18px 18px;gap:12px;border-bottom:1px solid var(--line)}
.brand-icon{width:40px;height:40px;border-radius:13px;font-size:19px}
.brand-txt b{font-size:15px;letter-spacing:.4px}
.brand-txt span{font-size:11px;letter-spacing:.3px}
.nav{padding:2px 12px 14px}
.nav-grp{display:flex;align-items:center;gap:9px;padding:18px 8px 8px;font-size:10.5px;font-weight:700;letter-spacing:1.3px}
.nav-grp::after{content:'';flex:1;height:1px;background:var(--line)}
.nav-item{gap:11px;padding:9px 11px;border-radius:11px;margin-bottom:3px}
.nav-item .nav-ico{width:28px;height:28px;border-radius:9px;background:var(--card);box-shadow:0 1px 2px rgba(60,70,55,.06);align-items:center}
.nav-item .nav-ico svg{width:16px;height:16px}
.nav-item.active{box-shadow:0 6px 15px var(--acc-glow)}
.nav-item.active .nav-ico{background:rgba(255,255,255,.18);box-shadow:none;color:var(--acc-txt)}
.side-foot{margin:0 12px 10px;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.side-foot .sf-ico{width:28px;height:28px;border-radius:9px}
.collapse-btn{margin:0 12px 16px;border:1px solid var(--line);background:var(--card)}

/* --- 顶栏：面包屑胶囊化、图标按钮方形浅底、头像成卡片 --- */
.topbar{height:66px;padding:0 28px;gap:16px;background:var(--card)}
.crumb{display:flex;align-items:center;gap:9px;font-size:12.5px}
.crumb::before{content:'';width:7px;height:7px;border-radius:3px;background:var(--acc);opacity:.75;flex:0 0 auto}
.crumb b{font-size:12.5px;background:var(--acc-bg);color:var(--acc);padding:4px 11px;border-radius:8px}
.top-right{gap:8px}
.top-ico{width:36px;height:36px;border-radius:10px;background:var(--panel);align-items:center;justify-content:center;padding:0}
.top-ico:hover{background:var(--acc-bg);color:var(--acc)}
.avatar{gap:9px;padding:4px 12px 4px 4px;border-radius:12px;background:var(--panel);border:1px solid var(--line);margin-left:4px}
.avatar-circle{width:34px;height:34px;font-size:13px}
.avatar-meta b{font-size:12.5px}
.avatar-meta span{font-size:10.5px}

/* --- 内容区：超宽屏限宽居中；标题与说明各自成板块 --- */
.content{padding:28px 32px 44px}
.content>.page-head,.content>#pageBody{max-width:1480px;margin-left:auto;margin-right:auto}
.page-head{display:flex;align-items:flex-start;flex-wrap:wrap;gap:10px 20px;margin-bottom:22px;padding-bottom:18px;border-bottom:1px solid var(--line)}
.page-head h1{position:relative;flex:0 0 auto;font-size:25px;padding-left:14px;line-height:1.35}
.page-head h1::before{content:'';position:absolute;left:0;top:5px;bottom:5px;width:4px;border-radius:4px;background:linear-gradient(180deg,var(--acc),var(--acc-deep))}
.page-head p{flex:1 1 420px;min-width:0;max-width:820px;margin-top:0;padding:9px 13px;border-radius:11px;background:var(--panel);border:1px solid var(--panel-line);font-size:12.5px;line-height:1.75}
.page-head p::before{content:'说明 · ';color:var(--acc);font-weight:700}

/* --- 卡片：工具栏区与数据区层次分明，圆角统一 --- */
.card{border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);margin-bottom:20px;transition:box-shadow .18s}
.card-head{padding:14px 20px;background:linear-gradient(180deg,var(--card) 0%,var(--panel) 100%);border-bottom:1px solid var(--line);border-radius:16px 16px 0 0;gap:14px}
.card-head h2{font-size:15.5px}
.count-badge{font-size:11px;padding:2px 10px}
.search-wrap input{border-radius:11px;background:var(--card);border-color:var(--line)}
.search-wrap input:focus{background:var(--card)}
.tbl th{font-size:11.5px;letter-spacing:.3px;padding:12px 16px}
.tbl td{padding:13px 16px}
.tbl tbody tr:hover{background:var(--hover)}
.hint-line{background:var(--panel);font-size:12px}

/* --- 统计卡：板块标题 + 顶部色条 + 更大的图标与数字 --- */
.stat-grid{gap:16px;margin-bottom:22px}
.stat-grid::before{content:'▍ 数据概览';grid-column:1/-1;display:block;font-size:12px;font-weight:700;letter-spacing:1.2px;color:var(--sub);margin-bottom:-4px}
.stat-card{position:relative;border:1px solid var(--line);border-radius:16px;padding:18px 17px 16px;overflow:hidden;transition:transform .18s,box-shadow .18s}
.stat-card::before{content:'';position:absolute;left:0;right:0;top:0;height:3px;background:var(--acc)}
.stat-card:nth-of-type(2)::before{background:var(--info)}
.stat-card:nth-of-type(3)::before{background:var(--warn)}
.stat-card:nth-of-type(4)::before{background:var(--err)}
.stat-ico{width:46px;height:46px;border-radius:14px}
.stat-ico svg{width:21px;height:21px}
.stat-label{font-size:12px}
.stat-num{font-size:24px;letter-spacing:.3px}
.stat-card.clickable:hover{transform:translateY(-3px)}

/* --- 首页提醒：按业务板块归类（纯 CSS 徽章，不改动卡片顺序与拖拽换序） --- */
.remind-grid{gap:16px}
.remind-grid::before{content:'▍ 待办提醒 · 按业务板块归类';grid-column:1/-1;display:block;font-size:12px;font-weight:700;letter-spacing:1.2px;color:var(--sub);margin-bottom:-4px}
.rem-card .card-head h2{gap:8px}
.rem-card .card-head h2::before{font-size:10.5px;font-weight:700;letter-spacing:.3px;padding:3px 8px;border-radius:7px;background:var(--pill);color:var(--sub);flex:0 0 auto}
.rem-card[data-remkey="promotions"] .card-head h2::before,.rem-card[data-remkey="creators"] .card-head h2::before{content:'营销运营';background:var(--acc-bg);color:var(--acc)}
.rem-card[data-remkey="products"] .card-head h2::before,.rem-card[data-remkey="sampling"] .card-head h2::before{content:'产品资料';background:var(--info-bg);color:var(--info)}
.rem-card[data-remkey="shipments"] .card-head h2::before,.rem-card[data-remkey="clock"] .card-head h2::before,.rem-card[data-remkey="calwin"] .card-head h2::before{content:'物流交付';background:var(--warn-bg);color:var(--warn)}
.rem-card[data-remkey="factory"] .card-head h2::before{content:'工厂协同';background:var(--err-bg);color:var(--err)}
.rem-card[data-remkey="promotions"],.rem-card[data-remkey="creators"]{border-left:3px solid var(--acc)}
.rem-card[data-remkey="products"],.rem-card[data-remkey="sampling"]{border-left:3px solid var(--info)}
.rem-card[data-remkey="shipments"],.rem-card[data-remkey="clock"],.rem-card[data-remkey="calwin"]{border-left:3px solid var(--warn)}
.rem-card[data-remkey="factory"]{border-left:3px solid var(--err)}

/* --- 大屏：统计四列 / 提醒两列 / 表头吸顶，长表更好用 --- */
@media (min-width:1200px){
  .stat-grid{grid-template-columns:repeat(4,minmax(0,1fr))}
  .remind-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (min-width:901px) and (max-width:1199px){
  .stat-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (min-width:1201px){
  .tbl-wrap{overflow:visible}
  .tbl thead th{position:sticky;top:0;z-index:3;box-shadow:0 1px 0 var(--line)}
}
@media (hover:hover){
  .card:hover{box-shadow:0 2px 4px rgba(85,85,60,.05),0 10px 28px rgba(85,85,60,.09)}
  .btn:hover{box-shadow:0 4px 12px var(--acc-glow)}
}
/* --- 弹窗：遮罩虚化 + 轻微入场动画 --- */
.overlay{backdrop-filter:blur(3px)}
.modal{box-shadow:0 24px 60px rgba(20,35,25,.22);animation:modalIn .2s ease-out}
@keyframes modalIn{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}

/* ===== 响应式布局（电脑 / 手机双状态） ===== */
html,body{overflow-x:hidden;-webkit-text-size-adjust:100%}
img{max-width:100%}
.hamburger{display:none;background:none;color:var(--txt);padding:7px;border-radius:9px;flex-shrink:0}
.hamburger svg{width:22px;height:22px}
.hamburger:active{background:var(--pill)}
.drawer-backdrop{display:none}
/* 触屏设备：所有按钮保证清晰点击区域（≥44px），输入16px防iOS缩放 */
@media (hover:none) and (pointer:coarse){
  button,.nav-item{touch-action:manipulation}
  .btn,.link-btn,.row-del,.modal-close,.top-ico,.hamburger{min-height:44px;min-width:44px;display:inline-flex;align-items:center;justify-content:center}
  .mini-btn{min-height:38px;min-width:38px;display:inline-flex;align-items:center;justify-content:center}
  .btn.sm{min-height:40px;min-width:40px}
  .nav-item{min-height:46px}
  .collapse-btn{min-height:44px}
  /* 类选择器优先级高于元素选择器，逐一点名才能覆盖后面定义的 13/14px 输入框，彻底防 iOS 聚焦缩放 */
  input,select,textarea,.login-field input,.acc-inline input,.imgf-url,.pe-cur,.mini-date,.form-grid input,.form-grid select,.form-grid textarea{font-size:16px}
}
/* ===== 手机端专用组件（桌面端一律隐藏） ===== */
.m-bar,.m-tabs,.m-drawer-close,.sbq-txt{display:none}
.m-bar{position:fixed;top:0;left:0;right:0;z-index:90;align-items:center;gap:2px;padding:0 8px;background:var(--card);border-bottom:1px solid var(--line)}
.m-menu,.m-ico{position:relative;width:44px;min-width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:none;color:var(--txt);border-radius:10px;padding:0}
.m-menu:active,.m-ico:active{background:var(--pill)}
.m-menu svg,.m-ico svg{width:21px;height:21px}
.m-title{flex:1;min-width:0;text-align:center;font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-tabs{position:fixed;left:0;right:0;bottom:0;z-index:90;background:var(--card);border-top:1px solid var(--line);box-shadow:0 -2px 14px rgba(60,60,50,.06)}
.m-tab{position:relative;flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:none;color:var(--sub);font-size:10.5px;font-weight:500;border-radius:0;padding:0}
.m-tab svg{width:21px;height:21px}
.m-tab.active{color:var(--acc);font-weight:700}
.m-tab.active::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:28px;height:3px;border-radius:0 0 3px 3px;background:var(--acc)}
.m-drawer-close{margin-left:auto;width:38px;height:38px;align-items:center;justify-content:center;background:var(--pill);color:var(--sub);font-size:18px;border-radius:10px}
/* 手机布局状态（≤900px）：顶部标题栏 + 底部标签栏 + 抽屉 + 双列紧凑卡片 */
@media (max-width:900px), (max-height:560px) and (hover:none) and (pointer:coarse){
  :root{--m-top:calc(52px + env(safe-area-inset-top,0px));--m-bot:calc(58px + env(safe-area-inset-bottom,0px))}

  /* --- 顶部标题栏 / 底部标签栏：常驻、带文字、拇指可及 --- */
  .m-bar{display:flex;height:var(--m-top);padding-top:env(safe-area-inset-top,0px)}
  .m-tabs{display:flex;height:var(--m-bot);padding-bottom:env(safe-area-inset-bottom,0px)}
  .m-tab{height:calc(var(--m-bot) - env(safe-area-inset-bottom,0px))}
  .topbar{display:none !important}
  .crumb,.avatar-meta,.help-ico,.collapse-btn{display:none}

  /* --- 左侧栏改为可滑出抽屉：11 个模块全部带文字，桌面功能一个不少 --- */
  .sidebar{
    position:fixed;top:0;left:0;bottom:0;z-index:120;
    width:min(84vw,320px);padding-top:env(safe-area-inset-top,0px);
    transform:translateX(-102%);transition:transform .22s ease;
    box-shadow:6px 0 30px rgba(0,0,0,.18);border-right:1px solid var(--line);
  }
  .sidebar.open{transform:translateX(0)}
  /* 桌面端曾点过「收起侧边栏」再切到手机时，清掉折叠态，保证抽屉始终带文字 */
  .sidebar.collapsed{width:min(84vw,320px)}
  .sidebar.collapsed .nav-txt,.sidebar.collapsed .brand-txt,.sidebar.collapsed .nav-grp,.sidebar.collapsed .sf-txt{display:block}
  .drawer-backdrop{display:block;position:fixed;inset:0;z-index:110;background:var(--overlay);opacity:0;pointer-events:none;transition:opacity .22s}
  .drawer-backdrop.show{opacity:1;pointer-events:auto}
  .m-drawer-close{display:flex}
  .brand{justify-content:flex-start;gap:10px;padding:14px 12px 12px}
  .brand-icon{width:36px;height:36px;font-size:16px}
  .brand-txt{display:block;min-width:0}
  .brand-txt b{font-size:14px}
  .brand-txt span{font-size:11px}
  .nav{padding:2px 10px 10px}
  .nav-grp{display:block;padding:14px 10px 6px;font-size:11px}
  .nav-item{justify-content:flex-start;gap:12px;padding:10px 12px;margin:0 0 3px;min-height:46px;font-size:14px;border-radius:10px}
  .nav-item .nav-ico{width:22px}
  .nav-item .nav-ico svg{width:19px;height:19px}
  .nav-txt{display:block}
  .sb-quick{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:0;padding:10px;border-top:1px solid var(--line)}
  .sbq-btn{width:auto;min-height:44px;justify-content:flex-start;gap:8px;padding:0 10px;background:var(--pill);color:var(--txt);font-size:12.5px}
  .sbq-btn svg{width:18px;height:18px}
  .sbq-txt{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sbq-btn .bell-dot{top:9px;right:auto;left:26px}
  #sbLogout{grid-column:1/-1}
  .side-foot{justify-content:flex-start;gap:9px;padding:10px 14px;border-top:1px solid var(--line)}
  .sf-txt{display:block}

  /* --- 内容区占满整宽，上下让出固定栏 --- */
  .content{padding:calc(var(--m-top) + 12px) 12px calc(var(--m-bot) + 18px)}
  .page-head{margin-bottom:12px}
  .page-head h1{font-size:20px}
  .page-head p{font-size:12px;line-height:1.55;margin-top:4px;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
  .card{border-radius:12px;margin-bottom:14px}
  .card-head{flex-direction:column;align-items:stretch;gap:9px;padding:12px 13px}
  .card-head h2{font-size:14.5px}
  .head-left{width:100%;flex-direction:column;align-items:stretch;gap:9px}
  .head-left .search-wrap,.search-wrap{flex:1 1 100%;width:100%;max-width:none;min-width:0}
  .search-wrap input{min-width:0;padding:9px 13px}
  .search-wrap .btn{flex:0 0 auto;padding:0 12px;font-size:12px;min-height:42px}
  .toolbar{width:100%;gap:7px}
  .toolbar .btn{flex:1 1 calc(50% - 4px);justify-content:center;min-height:44px;padding:9px 8px;font-size:12.5px}
  .toolbar .btn:not(.ghost){flex:1 1 100%}

  /* --- 统计卡：两列且数字与单位不再被挤断行 --- */
  .stat-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:14px}
  .stat-card{padding:12px 11px;gap:9px;border-radius:12px}
  .stat-ico{width:36px;height:36px;border-radius:10px}
  .stat-ico svg{width:18px;height:18px}
  .stat-label{font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .stat-num{font-size:19px;white-space:nowrap;margin-top:2px}
  .stat-num span{font-size:11px;margin-left:4px}

  /* --- 首页提醒卡 --- */
  .remind-grid{grid-template-columns:1fr;gap:12px}
  .remind-grid .card{margin-bottom:0}
  .rem-card .card-head,.remind-grid .card-head{flex-direction:row;align-items:center;flex-wrap:wrap;gap:8px}
  .rem-card .card-head h2{font-size:14px;flex:1 1 auto;min-width:0}
  .remind-grid .head-acts{margin-left:auto;gap:6px}
  .remind-grid .head-acts .btn{flex:0 0 auto;min-height:40px}
  .rem-body{padding:10px 11px}
  .remind-item{padding:10px 11px;gap:8px}
  .remind-item .r-title{font-size:13.5px;line-height:1.5}
  .remind-item .r-sub{font-size:11.5px;line-height:1.6}

  /* --- 表格 → 双列紧凑卡片：一条记录不再占十几行 --- */
  .tbl-wrap{overflow-x:visible}
  table.tbl{display:block}
  table.tbl thead{display:none}
  table.tbl tbody{display:block}
  table.tbl tbody tr{
    display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
    border:1px solid var(--line);border-radius:12px;margin-bottom:10px;
    background:var(--card);box-shadow:0 1px 6px rgba(85,85,60,.06);overflow:hidden;
  }
  table.tbl tbody tr:hover{background:var(--card)}
  table.tbl tbody td{
    display:block;min-width:0;padding:7px 10px 8px;border-bottom:1px dashed var(--dash);
    white-space:normal;word-break:break-word;overflow-wrap:anywhere;font-size:13px;line-height:1.5;
  }
  table.tbl td::before{
    content:attr(data-label);display:block;color:var(--sub);
    font-size:11px;font-weight:600;line-height:1.4;margin-bottom:3px;letter-spacing:.2px;
  }
  /* 业务主键字段升格为卡片标题并自动置顶（由 enhanceTables 按模块标注 m-card-title） */
  table.tbl tbody td.m-card-title{
    order:-1;grid-column:1/-1;background:var(--th-bg);font-size:15px;font-weight:650;
    text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);
  }
  table.tbl tbody td.m-card-title::before{font-size:10.5px;margin-bottom:2px;text-align:left}
  /* 长文本 / 图片组 / 操作按钮 / 空态 / 折叠提示行：占满整行 */
  table.tbl tbody td.m-wide,table.tbl tbody td.m-ops,table.tbl tbody td[colspan],table.tbl tbody tr.more-row td{grid-column:1/-1}
  table.tbl tbody td[colspan]{display:block;border-bottom:none;padding:18px 14px;text-align:center}
  table.tbl tbody td[colspan]::before,table.tbl tbody tr.more-row td::before{content:''}
  table.tbl tbody tr.more-row td{border-bottom:none;text-align:center}
  table.tbl tbody td.m-ops{
    display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--panel);
    padding:8px 10px;border-bottom:none;border-top:1px dashed var(--dash);
  }
  table.tbl tbody td.m-ops::before{flex:0 0 100%;margin-bottom:0}
  table.tbl tbody td.m-ops > button{flex:1 1 calc(50% - 3px);min-height:40px}
  table.tbl td .act-mini{flex:1 1 100%}
  table.tbl td .thumb{width:40px;height:40px}
  .color-cells{gap:8px}
  /* 父ASIN 分组行 / SKU 小节点保留层级 */
  table.tbl tbody tr.grp-row{border-left:3px solid var(--acc)}
  table.tbl tbody tr.sku-node{border-left:3px solid var(--zero)}
  table.tbl tbody tr.grp-row td,table.tbl tbody tr.sku-node td{grid-column:1/-1;display:block;border:none;padding:10px 12px;text-align:left}
  table.tbl tbody tr.grp-row td{background:var(--th-bg)}
  table.tbl tbody tr.sku-node td{background:var(--pill)}
  .grp-acts{margin-left:0;width:100%;gap:6px}
  .grp-acts .mini-btn{flex:1 1 auto}
  .hint-line{padding:9px 12px;font-size:11.5px;line-height:1.6}
  .empty{padding:18px}

  /* --- 弹窗：底部弹层、大按钮、手势区安全 --- */
  .overlay{padding:0;align-items:flex-end;z-index:150}
  .modal,.modal.wide,.modal.xl{
    width:100%!important;max-width:100%;
    max-height:calc(100% - var(--m-top) - 6px);
    max-height:calc(100dvh - var(--m-top) - 6px);
    border-radius:18px 18px 0 0;padding-bottom:env(safe-area-inset-bottom,0px);
  }
  .modal-head{position:relative;padding:12px 14px}
  .modal-head::before{content:'';position:absolute;top:5px;left:50%;transform:translateX(-50%);width:36px;height:4px;border-radius:99px;background:var(--line)}
  .modal-head h3{font-size:15px}
  .modal-close{min-width:44px;min-height:44px;font-size:20px}
  .modal-body{padding:12px 14px}
  .modal-foot{padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));gap:8px}
  .modal-foot .btn{flex:1;min-height:46px}
  .form-grid{grid-template-columns:1fr;gap:10px}
  .form-grid .field label{font-size:12px}
  .theme-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .theme-prev{height:70px}
  .acc-inline{flex-wrap:wrap}
  .acc-inline input{flex:1 1 100%}
  .acc-acts .btn{flex:1 1 calc(50% - 5px)}

  /* --- 产品编辑器颜色行 / 图片字段 --- */
  .pe-row{grid-template-columns:44px 1fr 34px;grid-template-areas:"t n d" "t i i" "f f f"}
  .pe-row>.thumb{grid-area:t}
  .pe-row .pe-cn{grid-area:n}
  .pe-row .pe-img{grid-area:i}
  .pe-row .pe-cf{grid-area:f}
  .pe-row .row-del{grid-area:d}
  .pe-row.adj{display:flex;flex-direction:column;align-items:stretch;gap:6px}
  .pe-row.adj .row-del{align-self:flex-end}
  .desc-list td,.desc-list th{white-space:normal;word-break:break-word}
  .imgf{flex-direction:column}
  .imgf-prev{width:60px;height:60px}

  /* --- Toast 置于底部标签栏上方：不遮标题、不挡卡片头，且不拦截点击 --- */
  #toastRoot{top:auto;bottom:calc(var(--m-bot) + 10px);left:12px;right:12px;transform:none;z-index:200;pointer-events:none}
  .toast{max-width:100%;text-align:center;font-size:12.5px;padding:9px 14px;pointer-events:none}

  /* --- 登录页 --- */
  .login-screen{padding:16px}
  .login-card{padding:24px 20px 20px;border-radius:16px}
  .login-brand .brand-icon{width:46px;height:46px;font-size:22px}
  .login-brand h1{font-size:18px}
}
/* ==================================================================
   布局优化 v2 · 手机端专项
   位置在原手机 media 之后、Mate 80 Pro / 横屏专项之前：
   Mate 80 Pro 的安全区、挖孔避让、高分屏字号、三列字段等原有规则
   仍排在后面并保持优先，本段只做视觉与板块化增强。
   ================================================================== */
@media (max-width:900px), (max-height:560px) and (hover:none) and (pointer:coarse){
  /* 顶部栏 / 底部标签栏：毛玻璃、轻投影、当前项图标胶囊 */
  .m-bar{backdrop-filter:blur(12px);box-shadow:0 2px 12px rgba(50,60,50,.06)}
  .m-title{letter-spacing:.3px}
  .m-tabs{box-shadow:0 -4px 20px rgba(50,60,50,.09)}
  .m-tab{gap:3px;letter-spacing:.2px}
  .m-tab.active::before{display:none}
  .m-tab.active svg{background:var(--acc-bg);border-radius:10px;padding:3px;box-sizing:border-box;stroke-width:2.1}
  .m-tab.active span{font-weight:700}

  /* 抽屉：恢复为分组长列表（图标 + 文字，垂直排布），与桌面一致，便于逐项查找 */
  .sidebar{border-radius:0 20px 20px 0;box-shadow:8px 0 34px rgba(0,0,0,.2)}
  .brand{padding:16px 14px 14px;gap:11px;border-bottom:1px solid var(--line)}
  .brand-icon{width:40px;height:40px;border-radius:13px}
  .brand-txt b{font-size:15px}
  .nav{display:block;padding:8px 12px 10px}
  .nav-grp{display:flex;align-items:center;gap:8px;padding:14px 2px 5px;margin:0;font-size:10.5px;font-weight:700;letter-spacing:1.2px}
  .nav-grp::after{content:'';flex:1;height:1px;background:var(--line)}
  .nav-item{flex-direction:row;justify-content:flex-start;align-items:center;gap:11px;min-height:48px;margin:0 0 4px;padding:9px 11px;text-align:left;white-space:nowrap;line-height:1.3;border:1px solid transparent;border-radius:12px;background:transparent;font-size:13px}
  .nav-item .nav-ico{width:28px;height:28px;border-radius:9px;background:var(--card);color:var(--nav-txt);box-shadow:0 1px 2px rgba(60,70,55,.06);align-items:center}
  .nav-item .nav-ico svg{width:16px;height:16px}
  .nav-item.active{background:var(--acc);color:var(--acc-txt);border-color:transparent;box-shadow:0 5px 14px var(--acc-glow)}
  .nav-item.active .nav-ico{background:rgba(255,255,255,.2);color:var(--acc-txt);box-shadow:none}
  .nav-txt{font-size:13px}
  .sb-quick{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;padding:8px 12px;border-top:1px solid var(--line);margin:0}
  .sbq-btn{justify-content:center;background:var(--card);border:1px solid var(--line);border-radius:12px;font-size:12.5px;min-height:44px;gap:6px}
  .sbq-btn .bell-dot{left:auto;right:8px;top:8px}
  .side-foot{margin:0 12px 6px;padding:8px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card)}

  /* 页面标题 / 说明：各自成块，说明变轻量提示条 */
  .page-head{display:block;margin-bottom:14px;padding-bottom:12px;border-bottom:1px dashed var(--line)}
  .page-head h1{font-size:20px;padding-left:12px;line-height:1.35}
  .page-head h1::before{top:4px;bottom:4px}
  .page-head p{display:block;margin-top:9px;padding:8px 11px;font-size:12px;line-height:1.65;background:var(--panel);border:1px solid var(--panel-line);border-radius:10px}
  .page-head p::before{content:'说明 · ';font-weight:700;color:var(--acc)}

  /* 板块标题 + 卡片层次 */
  .stat-grid{gap:10px}
  .stat-grid::before,.remind-grid::before{content:'▍ 数据概览';font-size:11.5px;letter-spacing:.8px;margin-bottom:-4px}
  .remind-grid::before{content:'▍ 待办提醒 · 按业务板块归类'}
  .stat-card{border-radius:14px;padding:13px 12px}
  .stat-ico{border-radius:12px}
  .card{border-radius:14px;margin-bottom:14px}
  .card-head{border-radius:14px 14px 0 0;padding:12px 13px;gap:9px}
  .toolbar .btn{border-radius:10px}
  .search-wrap input{border-radius:11px}

  /* 提醒卡：分组徽章与色条保留，条目改为独立小卡 */
  .rem-card .card-head h2{flex-wrap:wrap;gap:7px}
  .rem-card .card-head h2::before{font-size:10px;padding:2px 7px;border-radius:6px}
  .remind-item{border:1px solid var(--panel-line);border-radius:11px;background:var(--card);margin-bottom:8px}
  .remind-item:last-child{margin-bottom:0}

  /* 表格卡片：标题色条、字段标签更轻、操作区独立 */
  table.tbl tbody tr{border-radius:14px;box-shadow:0 2px 10px rgba(85,85,60,.07);margin-bottom:11px}
  table.tbl tbody td.m-card-title{border-left:3px solid var(--acc);padding:10px 12px}
  table.tbl td::before{font-size:10.5px;letter-spacing:.3px;opacity:.9}
  table.tbl tbody td.m-ops{background:var(--th-bg)}
  .hint-line{font-size:11.5px}

  /* 弹窗 / Toast */
  .overlay{backdrop-filter:blur(4px)}
  .modal{box-shadow:0 -12px 40px rgba(0,0,0,.2);animation:modalUp .22s ease-out}
  .toast{border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.22)}
}
@keyframes modalUp{from{opacity:.6;transform:translateY(24px)}to{opacity:1;transform:none}}
/* 华为 Mate 80 Pro（约 428×944 @3x）：宫格更大更好点；挖孔避让、安全区、
   高分屏字号、三列短字段等适配仍沿用下方的原专项规则，优先级更高 */
@media (min-width:410px) and (max-width:480px) and (min-resolution:2dppx) and (hover:none) and (pointer:coarse){
  .brand{padding:10px 14px}
  .nav{padding:6px 14px 8px}
  .nav-grp{padding:8px 2px 4px}
  .nav-item{min-height:50px;font-size:13.5px;border-radius:12px}
  .nav-item .nav-ico{width:30px;height:30px}
  .nav-item .nav-ico svg{width:17px;height:17px}
  .nav-txt{font-size:13.5px}
  .sb-quick{padding:8px 14px;gap:6px}
  .sbq-btn{font-size:13px}
  .side-foot{margin:0 14px 4px;padding:6px 12px}
  .stat-grid::before,.remind-grid::before{font-size:12px}
  .rem-card .card-head h2::before{font-size:10.5px}
  .page-head p{font-size:12.5px}
}
/* 手机横屏：宫格改三列，压缩纵向占用 */
@media (max-height:560px) and (min-width:561px) and (hover:none) and (pointer:coarse){
  .nav{padding:6px 10px}
  .nav-grp{padding:6px 2px 4px}
  .nav-item{min-height:42px;padding:7px 10px}
  .sb-quick{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding:6px 10px}
  .sbq-btn{font-size:11.5px;min-height:40px;gap:4px}
  #sbLogout{grid-column:span 1}
  .side-foot{margin:0 10px 4px;padding:6px 10px}
  .stat-grid::before,.remind-grid::before{display:none}
  .page-head{display:flex;align-items:baseline;gap:10px;padding-bottom:6px}
  .page-head p{background:none;border:none;padding:0}
  .page-head p::before{content:''}
}
@media (max-width:420px){
  .brand-txt b{font-size:13px}
  .page-head h1{font-size:19px}
  .m-tab{font-size:10px}
  .stat-card{padding:11px 9px;gap:7px}
  .stat-ico{width:32px;height:32px}
  .stat-num{font-size:17px}
}

/* ===== 华为 Mate 80 Pro / 中置挖孔全面屏专项适配 =====
   6.75" 2832×1280 @460ppi，DPR≈3 → CSS 视口约 428×944；19.5:9 中置药丸挖孔、圆角直面屏、
   HarmonyOS 6 手势/三键导航、1-120Hz LTPO。要点：状态栏与挖孔避让、460ppi 下放大字号、
   428px 宽屏三列提升信息密度、944px 高屏限制底部弹层高度、圆角屏左右安全区。*/
@media (min-width:410px) and (max-width:480px) and (min-resolution:2dppx) and (hover:none) and (pointer:coarse){
  /* 基础值：即使浏览器不支持 max() 也保证变量可用 */
  :root{--m-top:calc(52px + env(safe-area-inset-top,0px));--m-bot:calc(56px + env(safe-area-inset-bottom,0px))}
  .content{padding-left:14px;padding-right:14px}
  @supports (padding-top:max(0px, env(safe-area-inset-top,0px))){
    /* 沉浸式/全屏下部分华为浏览器把 inset 报成 0，为状态栏与中置挖孔留最小避让 */
    :root{
      --m-top:calc(52px + max(env(safe-area-inset-top,0px), 30px));
      --m-bot:calc(56px + max(env(safe-area-inset-bottom,0px), 12px));
    }
    .m-bar{padding-top:max(env(safe-area-inset-top,0px), 30px);
      padding-left:max(10px, env(safe-area-inset-left,0px));
      padding-right:max(10px, env(safe-area-inset-right,0px))}
    .m-tabs{padding-bottom:max(env(safe-area-inset-bottom,0px), 12px);

/* ===== 手机横屏（Mate 80 Pro 926×428 等）：仍用手机三段式导航，压缩纵向占用 ===== */

<script data-page-node-id="eSTSu4MZIF9EIBIX97m0un" data-pnid-children="fdo4CqvemYU5pC7qFemEg2">
/* ================= 工具函数 ================= */
/* 移动布局判定：与 CSS 断点严格一致。除窄屏外，还覆盖 Mate 80 Pro 等「宽而矮」的触屏横屏
   （926×428 若按 900px 判为桌面会切回 232px 侧栏），保证字段标签/卡片化与样式同步。 */
const MOBILE_LAYOUT_Q = '(max-width:900px), (max-height:560px) and (hover:none) and (pointer:coarse)';
function isMobileLayout(){
  return window.matchMedia ? window.matchMedia(MOBILE_LAYOUT_Q).matches
    : (window.innerWidth <= 900 || (window.innerHeight <= 560 && ('ontouchstart' in window)));
}
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = p => p + '_' + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3);
const iso = d => { const x = new Date(d); return x.getFullYear() + '-' + String(x.getMonth()+1).padStart(2,'0') + '-' + String(x.getDate()).padStart(2,'0'); };
const today = () => iso(new Date());
const _usFmt = new Intl.DateTimeFormat('en-CA', { timeZone:'America/Los_Angeles', year:'numeric', month:'2-digit', day:'2-digit' });
let _usKey = '', _usVal = '';
function usToday(){ // 促销活动时间以美国太平洋时间为准；按小时缓存，避免每条记录都构造 Intl 对象（数据多时极慢）
  const d = new Date();
  const k = d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate() + '-' + d.getHours();
  if(k !== _usKey){ _usKey = k; _usVal = _usFmt.format(d); }
  return _usVal;
}
const nowDT = () => iso(new Date()); // 所有时间字段只精确到年月日
const fmtDT = s => String(s || '').slice(0, 10); // 所有时间字段只显示年月日
const dayDiff = (a, b) => Math.round((new Date(a) - new Date(b)) / 86400000);
const num = v => { const n = parseFloat(String(v == null ? '' : v).replace(/[,\s¥$%]/g, '')); return isNaN(n) ? 0 : n; };
function toast(msg, type){ const t = document.createElement('div'); t.className = 'toast ' + (type || ''); t.textContent = msg; document.getElementById('toastRoot').appendChild(t); setTimeout(() => t.remove(), 2600); }
const jsq = s => String(s == null ? '' : s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'&quot;'); // onclick 内联参数安全转义
function copyText(btn){
  const txt = btn.dataset.t || '';
  const done = () => toast('已复制到剪贴板', 'ok');
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done).catch(() => fallbackCopy(txt, done));
  } else fallbackCopy(txt, done);
}
function fallbackCopy(txt, done){
  const ta = document.createElement('textarea');
  ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); done(); }catch(e){ toast('复制失败，请手动复制', 'err'); }
  ta.remove();
}
function weekKey(d){ const date = new Date(d); const day = (date.getDay()+6)%7; const th = new Date(date); th.setDate(date.getDate()-day+3); const y = th.getFullYear(); const w = Math.ceil(((th - new Date(y,0,1))/86400000 + 1) / 7); return y + '-W' + w; }
function weekRange(d){ const date = new Date(d); const day = (date.getDay()+6)%7; const ws = new Date(date); ws.setDate(date.getDate()-day); const we = new Date(ws); we.setDate(ws.getDate()+6); return [iso(ws), iso(we)]; }
/* 周日 ~ 周六 的送达时段工具（预计送达时段以周日至下周六为一时段） */
function sunWeek(d){ const date = new Date(d); const day = date.getDay(); const ws = new Date(date); ws.setDate(date.getDate()-day); const we = new Date(ws); we.setDate(ws.getDate()+6); return [iso(ws), iso(we)]; }
function nextSunWeek(){ const t = new Date(); const day = t.getDay(); const off = day === 0 ? 7 : 7 - day; const ws = new Date(t); ws.setDate(t.getDate()+off); const we = new Date(ws); we.setDate(ws.getDate()+6); return [iso(ws), iso(we)]; }
function winFmt(s){
  const f = (str, full) => { if(!str) return ''; const d = new Date(str); if(isNaN(d)) return str;
    const md = (d.getMonth()+1) + '月' + d.getDate() + '日'; return full ? d.getFullYear() + '年' + md : md; };
  if(s.winStart && s.winEnd) return f(s.winStart, false) + ' - ' + f(s.winEnd, true);
  return f(s.winStart || s.winEnd, true);
}
function matchQ(q, ...fields){ if(!q) return true; const qq = q.trim().toLowerCase(); return fields.some(f => String(f || '').toLowerCase().includes(qq)); }

/* ================= 多用户账户 ================= */
const USERS_KEY = 'amz_users_v1';
const SESSION_KEY = 'amz_session_v1';

function hashPwd(pw, salt){ // 盐化迭代散列（本地工具级防护，非加密强度）
  const s = salt + '::' + pw;
  let h1 = 0x811c9dc5, h2 = 0x9e3779b9;
  for(let r = 0; r < 96; r++){
    for(let i = 0; i < s.length; i++){
      h1 = (h1 ^ s.charCodeAt(i)) >>> 0; h1 = (h1 * 16777619) >>> 0;
      h2 = (h2 + h1 + r + i) >>> 0; h2 = (h2 ^ (h2 << 13)) >>> 0; h2 = (h2 ^ (h2 >>> 7)) >>> 0;
    }
  }
  return h1.toString(36) + '-' + h2.toString(36) + '-' + s.length.toString(36);
}

/* ================= 数据层（按用户隔离 + 完整性保护） ================= */
const DB_VERSION = 4;
const COLLS = ['products','promotions','sampling','ads','creators','inventory','shipments','factoryOrders','skus'];
/* ---- 回收站：删除的数据先保留 3 天，可随时恢复；到期自动彻底删除 ---- */
const TRASH_DAYS = 3;
const TRASH_TTL = TRASH_DAYS * 24 * 60 * 60 * 1000;
const TRASH_MAX = 200;          // 最多保留条数（防止长期积累占满本地存储）
const TRASH_BUDGET = 1200000;   // 回收站最多占用的字符数（约 1.2M 字符）
const COLL_LABEL = {
  products:'产品详情', promotions:'促销活动', sampling:'工厂打样情况', ads:'广告数据', creators:'创作者计划',
  inventory:'产品库存情况', shipments:'FBA货件追踪', factoryOrders:'工厂下单', skus:'具体产品情况'
};
const LS_LIMIT = 4500000;           // localStorage 可用字符数保守估算（浏览器上限约 5M）
const BAK_TTL = 2 * 60 * 60 * 1000; // 自动快照最短间隔：2 小时
let DB = null;
let _dataRev = 0; // 数据版本号：派生索引（如工厂未出货）据此失效重建
const S = { page: 'home', q: {}, user: null };
let saveFailed = false;   // 最近一次写入是否失败（用于顶部告警条）
let lastSavedJSON = '';   // 上次成功写入的内容，用于生成可恢复快照
let lastSaveAt = 0;
function ukey(k){ return 'amz_u_' + S.user + '__' + k; }

/* ---- 存储读写：配额不足时不静默失败 ---- */
function safeGet(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
function showStoreWarn(msg){
  saveFailed = true;
  const el = document.getElementById('storeWarn');
  const tx = document.getElementById('storeWarnTxt');
  if(tx) tx.textContent = msg || '数据保存失败：浏览器本地存储空间已满，最新修改可能丢失，请立即导出备份。';
  if(el) el.hidden = false;
}
function hideStoreWarn(){ const el = document.getElementById('storeWarn'); if(el) el.hidden = true; }
function safeSet(k, v){
  try { localStorage.setItem(k, v); saveFailed = false; return true; }
  catch(e){
    try { // 配额不足：先清理自动快照再重试一次
      localStorage.removeItem(ukey('bak'));
      localStorage.removeItem(ukey('bakat'));
      localStorage.setItem(k, v);
      toast('存储空间紧张，已清理自动快照后保存成功', 'ok');
      saveFailed = false; return true;
    } catch(e2){
      showStoreWarn('数据保存失败：本地存储空间已满。请导出备份，并把过大的本地图片改为图片链接。');
      toast('保存失败：本地存储空间已满，请先导出备份', 'err');
      return false;
    }
  }
}
function usageChars(){
  let n = 0;
  try {
    for(let i = 0; i < localStorage.length; i++){
      const k = localStorage.key(i) || '';
      if(k.indexOf('amz_') !== 0) continue;
      n += k.length + String(localStorage.getItem(k) || '').length;
    }
  } catch(e){}
  return n;
}
function storagePct(){ return Math.min(100, Math.round(usageChars() / LS_LIMIT * 100)); }
/* ---- 自动快照（可恢复到最近一次状态） ---- */
function readSnapshot(){
  try { const o = JSON.parse(safeGet(ukey('bak')) || 'null'); return o && o.json ? o : null; } catch(e){ return null; }
}
/* 快照时间戳单独存一个小键：避免每次保存都解析上兆字节的快照 JSON（长期使用后编辑会明显变卡） */
function snapshotAt(){ const v = Number(safeGet(ukey('bakat')) || 0); return isFinite(v) ? v : 0; }
function snapshot(tag, force){
  try {
    if(!DB || !lastSavedJSON) return false;
    if(!force && Date.now() - snapshotAt() < BAK_TTL) return false;
    if(lastSavedJSON.length > 1200000) return false;                    // 快照过大，跳过以免占满配额
    if(usageChars() + lastSavedJSON.length > LS_LIMIT * 0.82) return false;
    const at = Date.now();
    if(!safeSet(ukey('bak'), JSON.stringify({ at, tag: tag || 'auto', json: lastSavedJSON }))) return false;
    try { localStorage.setItem(ukey('bakat'), String(at)); } catch(e){}
    return true;
  } catch(e){ return false; }
}
/* ---- 结构规范化：任何缺失字段都不会导致渲染崩溃 ---- */
function normalizeDB(db){
  if(!db || typeof db !== 'object' || Array.isArray(db)) db = {};
  COLLS.forEach(k => { if(!Array.isArray(db[k])) db[k] = []; });
  const clean = arr => arr.filter(x => x && typeof x === 'object' && !Array.isArray(x));
  db.products = clean(db.products).map(p => {
    p.id = p.id || uid('p');
    p.createdAt = p.createdAt || nowDT();
    p.colors = Array.isArray(p.colors) ? clean(p.colors) : [];
    p.colors.forEach(c => {
      if(c.fabric == null) c.fabric = p.fabric || ''; // 旧数据：产品级面料下沉到颜色
      c.name = c.name || ''; c.img = c.img || '';
      const oldDone = (p.done && typeof p.done === 'object') ? p.done : {};
      // v4 迁移：产品级「主图」状态下沉到每个颜色；颜色级完成状态规范化
      c.done = (c.done && typeof c.done === 'object') ? c.done : {};
      if(c.done.mainImage === undefined && oldDone.mainImage !== undefined) c.done.mainImage = !!oldDone.mainImage;
      c.done.mainImage = !!c.done.mainImage;
      c.done.modelImage = !!c.done.modelImage;
    });
    p.adjustments = Array.isArray(p.adjustments) ? clean(p.adjustments) : [];
    p.spec = (p.spec && typeof p.spec === 'object') ? p.spec : {};
    const oldDone = (p.done && typeof p.done === 'object') ? p.done : {};
    // v4：done 只保留父ASIN级四项（产品视频/网红视频/直评/VINE）
    p.done = {};
    DONE_PARENT.forEach(([k]) => p.done[k] = !!oldDone[k]);
    return p;
  });
  // 同一父ASIN下的父体级完成状态取并集统一（编辑任一货号即同步整个父体）
  const pGroups = {};
  db.products.forEach(p => { const k = p.parent || ''; (pGroups[k] = pGroups[k] || []).push(p); });
  Object.values(pGroups).forEach(ps => {
    if(!ps[0].parent || ps.length < 2) return;
    DONE_PARENT.forEach(([k]) => {
      if(ps.some(x => x.done[k])) ps.forEach(x => x.done[k] = true);
    });
  });
  ['promotions','sampling','ads','creators','inventory','shipments','factoryOrders','skus'].forEach(k => {
    db[k] = clean(db[k]).map(r => {
      r.id = r.id || uid(k.slice(0, 2));
      r.createdAt = r.createdAt || nowDT();
      if(k === 'ads'){
        r.keywords = Array.isArray(r.keywords) ? r.keywords : [];
        r.hots = Array.isArray(r.hots) ? r.hots : [];
      }
      if(k === 'sampling') r.adjustments = Array.isArray(r.adjustments) ? clean(r.adjustments) : [];
      if(k === 'creators') r.weeksDone = (r.weeksDone && typeof r.weeksDone === 'object') ? r.weeksDone : {};
      if(k === 'shipments' && r.winDone && typeof r.winDone !== 'object') r.winDone = {};
      if(k === 'skus'){
        // v4 迁移：旧字段 fbaQty 拆为 FBA在售 + 在途库存（库存总数 = 两者之和，自动计算）
        if(r.fbaQty !== undefined && r.fbaSellable === undefined) r.fbaSellable = num(r.fbaQty);
        delete r.fbaQty;
        r.color = r.color || '';
        r.fbaSellable = num(r.fbaSellable); r.transit = num(r.transit);
      }
      return r;
    });
  });
  // v4 迁移：旧「产品库存情况」独立记录 → 并入「具体产品情况」(skus)，库存页改为按父ASIN+颜色汇总视图
  if(db.__v === undefined || db.__v < 4){
    (db.inventory || []).forEach(iv => {
      if(!iv || typeof iv !== 'object') return;
      const tp = (db.products || []).find(p => p.sku === iv.sku);
      db.skus.push(Object.assign(newRecord(), {
        id: uid('sk'), childAsin: '', msku: '', sku: iv.sku || '', color: iv.color || '',
        parent: iv.parent || '', shop: iv.shop || '',
        fbaSellable: (iv.fbaSellable !== undefined ? num(iv.fbaSellable) : num(iv.fbaTotal)) || 0,
        transit: num(iv.transit) || 0,
        type: (tp && tp.type) || '', img: ''
      }));
    });
    if((db.inventory || []).length) db.inventory = [];
  }
  // 回收站：结构规范化，任何异常条目都不会导致渲染或恢复崩溃
  db.trash = Array.isArray(db.trash) ? db.trash.filter(t => t && typeof t === 'object' && !Array.isArray(t)).map(t => {
    const it = {
      tid: String(t.tid || uid('tr')),
      kind: t.kind === 'term' ? 'term' : 'rec',
      coll: COLL_LABEL[t.coll] ? t.coll : 'products',
      at: Number(t.at) || 0,
      label: String(t.label || ''),
      size: Number(t.size) || 0
    };
    if(it.kind === 'term'){
      it.rid = String(t.rid || '');
      it.field = t.field === 'hots' ? 'hots' : 'keywords';
      it.idx = Math.max(0, Number(t.idx) || 0);
      it.val = String(t.val || '');
    } else {
      it.rec = (t.rec && typeof t.rec === 'object' && !Array.isArray(t.rec)) ? t.rec : null;
    }
    return it;
  }).filter(t => t.kind === 'term' || t.rec) : [];
  db.__v = DB_VERSION;
  return db;
}

function saveDB(force){
  if(!DB) return false;
  _dataRev++;
  let json;
  try { json = JSON.stringify(DB); }
  catch(e){ showStoreWarn('数据序列化失败：' + e.message + '，请立即导出备份'); return false; }
  if(!force && json === lastSavedJSON && !saveFailed) return true; // 内容未变化则不重复写入（避免多标签页互相触发写循环）
  try { snapshot('auto'); } catch(e){}
  const ok = safeSet(ukey('workbench'), json);
  if(ok){ lastSavedJSON = json; lastSaveAt = Date.now(); }
  return ok;
}
function loadDB(opts){
  opts = opts || {};
  const raw = safeGet(ukey('workbench'));
  let parsed = null, corrupt = false;
  if(raw){
    try { parsed = JSON.parse(raw); } catch(e){ corrupt = true; }
    if(!corrupt && (!parsed || typeof parsed !== 'object' || Array.isArray(parsed) || !Array.isArray(parsed.products))) corrupt = true;
  }
  if(corrupt){
    // 原始内容留档（截断保存，避免二次撑爆配额），优先从自动快照恢复
    try { localStorage.setItem(ukey('corrupt'), String(raw).slice(0, 200000)); } catch(e){}
    const bak = readSnapshot();
    if(bak && bak.json){ try { parsed = JSON.parse(bak.json); } catch(e){ parsed = null; } }
    toast(parsed ? '检测到数据异常，已自动从最近快照恢复' : '检测到数据异常，已重置为示例数据（原始内容已留档）', 'err');
  }
  DB = normalizeDB(parsed || seedDB());
  purgeTrash(true); // 打开工作台即清理超过 3 天的回收站记录
  _dataRev++;
  const norm = JSON.stringify(DB);
  const dirty = !parsed || corrupt || norm !== raw;
  lastSavedJSON = norm;
  // 首次写入 / 损坏恢复 / 规范化补齐过字段时持久化；其他标签页触发的同步只读不写，避免互相写回环
  if(dirty && opts.persist !== false) saveDB(true);
}
function newRecord(){ return { createdAt: nowDT() }; }

/* ================= 回收站（删除保留 3 天，到期彻底删除） ================= */
function fmtStamp(ts){
  const d = new Date(Number(ts) || 0);
  if(isNaN(d.getTime()) || !d.getTime()) return '—';
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
/* 剩余可恢复时长文案 */
function trashLeft(at){
  const ms = (Number(at) || 0) + TRASH_TTL - Date.now();
  if(ms <= 0) return '已到期';
  const h = Math.floor(ms / 3600000), d = Math.floor(h / 24);
  if(d >= 1) return d + ' 天 ' + (h % 24) + ' 小时';
  const m = Math.floor((ms % 3600000) / 60000);
  return (h > 0 ? h + ' 小时 ' : '') + m + ' 分钟';
}
/* 一条删除记录的可读摘要（写入时固化，避免后续字段调整导致旧记录显示为空） */
function trashSummary(coll, r){
  r = r || {};
  const j = (arr) => [].concat(arr).filter(Boolean).join(' · ');
  switch(coll){
    case 'products':      return j([r.sku, r.type, r.shop]) || '未命名产品';
    case 'promotions':    return j([r.type, r.parent, r.content]);
    case 'sampling':      return j([r.project || r.sku, r.doneAt ? '已完成打样' : '开发中']);
    case 'ads':           return j([r.sku || r.parent, ((r.keywords||[]).length + ' 个出单词'), ((r.hots||[]).length + ' 个热门词')]);
    case 'creators':      return j([r.title, r.sku || r.parent, r.commission]);
    case 'inventory':     return j([r.sku, r.color, 'FBA ' + num(r.fbaTotal)]);
    case 'shipments':     return j([r.name || r.shipmentId, r.warehouse, r.method]);
    case 'factoryOrders': return j([r.sku, r.color, num(r.qty) + ' 双', r.place]);
    case 'skus':          return j([r.childAsin || r.msku, r.sku, r.shop]);
  }
  return '';
}
/* 到期清理：返回本次彻底删除的条数 */
function purgeTrash(silent){
  if(!DB || !Array.isArray(DB.trash) || !DB.trash.length) return 0;
  const now = Date.now();
  const kept = DB.trash.filter(t => t && (now - (Number(t.at) || 0)) < TRASH_TTL);
  const n = DB.trash.length - kept.length;
  if(n){ DB.trash = kept; if(!silent) toast('已彻底删除 ' + n + ' 条超过 ' + TRASH_DAYS + ' 天的回收站记录', 'ok'); }
  return n;
}
/* 超量时从最旧的开始丢弃，保证回收站不会挤爆本地存储 */
function trimTrash(){
  let total = DB.trash.reduce((s, t) => s + (Number(t.size) || 0), 0);
  while(DB.trash.length > 1 && (total > TRASH_BUDGET || DB.trash.length > TRASH_MAX)){
    const last = DB.trash[DB.trash.length - 1];
    total -= (Number(last.size) || 0);
    DB.trash.pop();
  }
}
function trashPush(item){
  DB.trash = Array.isArray(DB.trash) ? DB.trash : [];
  let size = 0;
  try { const s = JSON.stringify(item.rec || item.val || ''); size = s ? s.length : 1; } catch(e){ size = 0; }
  DB.trash.unshift(Object.assign({ tid: uid('tr'), at: Date.now(), size }, item, { size }));
  purgeTrash(true);
  trimTrash();
}
/* 删除一条业务记录 → 移入回收站（9 个业务模块统一入口） */
function moveToTrash(coll, id){
  const arr = DB && DB[coll];
  if(!Array.isArray(arr)) return false;
  const rec = arr.find(x => x && x.id === id);
  if(!rec) return false;
  let copy;
  try { copy = JSON.parse(JSON.stringify(rec)); } catch(e){ copy = Object.assign({}, rec); }
  DB[coll] = arr.filter(x => x.id !== id);
  let label = '';
  try { label = trashSummary(coll, copy); } catch(e){ label = ''; }
  trashPush({ kind:'rec', coll, label: label || '（无摘要）', rec: copy });
  invalidateIdx();
  return true;
}
/* 广告出单词 / 热门搜索词删除 → 也进回收站（可恢复回原位置） */
function moveTermToTrash(id, key, i){
  const r = (DB.ads || []).find(x => x && x.id === id);
  if(!r || !Array.isArray(r[key]) || i < 0 || i >= r[key].length) return false;
  const val = r[key][i];
  r[key].splice(i, 1);
  trashPush({ kind:'term', coll:'ads', rid:id, field:key, idx:i, val, label:'广告' + (key === 'hots' ? '热门搜索词' : '出单词') + '：' + val });
  return true;
}
function restoreTrash(tid){
  const list = Array.isArray(DB && DB.trash) ? DB.trash : [];
  const t = list.find(x => x && x.tid === tid);
  if(!t) return;
  if(Date.now() - (Number(t.at) || 0) >= TRASH_TTL){
    purgeTrash(true); saveDB(); render();
    toast('该记录已超过 ' + TRASH_DAYS + ' 天保留期，已彻底删除', 'err'); return;
  }
  if(t.kind === 'term'){
    const r = (DB.ads || []).find(x => x && x.id === t.rid);
    if(!r){ toast('原广告数据已被删除，该关键词无法单独恢复', 'err'); return; }
    r[t.field] = Array.isArray(r[t.field]) ? r[t.field] : [];
    r[t.field].splice(Math.min(t.idx, r[t.field].length), 0, t.val);
  } else {
    const arr = DB[t.coll];
    if(!Array.isArray(arr)){ toast('目标模块不存在，无法恢复', 'err'); return; }
    const rec = t.rec;
    if(arr.some(x => x && x.id === rec.id)) rec.id = uid(String(t.coll).slice(0, 2)); // 同 ID 已存在时换新 ID，避免互相覆盖
    arr.unshift(rec);
  }
  DB.trash = list.filter(x => x.tid !== tid);
  invalidateIdx();
  saveDB();
  toast('已恢复到「' + (COLL_LABEL[t.coll] || '原模块') + '」', 'ok');
  render();
}
function trashDel(tid){
  const t = (DB.trash || []).find(x => x.tid === tid); if(!t) return;
  confirmModal('彻底删除后无法恢复，确定立即删除「' + (t.label || '该记录') + '」吗？', () => {
    DB.trash = (DB.trash || []).filter(x => x.tid !== tid);
    saveDB(); toast('已彻底删除', 'ok'); render();
  }, '彻底删除');
}
function trashClear(){
  const n = (DB.trash || []).length;
  if(!n){ toast('回收站已经是空的', 'ok'); return; }
  confirmModal('确定清空回收站？\n共 ' + n + ' 条记录将被立即彻底删除，且无法恢复。', () => {
    DB.trash = []; saveDB(); toast('回收站已清空，' + n + ' 条记录已彻底删除', 'ok'); render();
  }, '清空回收站');
}

function seedDB(){
  const t = new Date();
  const d = n => { const x = new Date(t); x.setDate(x.getDate()+n); return iso(x); };
  const dt = n => d(n);
  const db = {
    products: [

/* 产品查找索引：库存/货件/SKU 页会按货号反复查找产品，线性查找在数据量大时是平方级开销 */
let _idx = null, _idxRev = -1;
function dataIdx(){
  if(_idx && _idxRev === _dataRev) return _idx;
  const bySku = new Map(), byPair = new Map(), byParent = new Map(), parentShops = new Map(), skuList = new Map();
  ((DB && DB.products) || []).forEach(p => {
    if(!p) return;
    if(p.sku){
      if(!bySku.has(p.sku)) bySku.set(p.sku, p);           // 同一货号可属于多个父ASIN，取首个作为类型/图片来源
      if(!skuList.has(p.sku)) skuList.set(p.sku, []);
      skuList.get(p.sku).push(p);
      if(p.parent) byPair.set(p.sku + '|' + p.parent, p);  // 货号 + 父ASIN 唯一
    }
    if(p.parent){
      if(!byParent.has(p.parent)) byParent.set(p.parent, p);
      if(p.shop && !parentShops.has(p.parent)) parentShops.set(p.parent, p.shop); // 父ASIN + 店铺 唯一
    }
  });
  _idx = { bySku, byPair, byParent, parentShops, skuList }; _idxRev = _dataRev;
  return _idx;
}
function invalidateIdx(){ _idx = null; _facIdx = null; }
/* 传父体时优先精确匹配「货号+父ASIN」，未传时退回该货号的首个产品 */
function findProduct(sku, parent){
  const i = dataIdx();
  if(!sku) return null;
  if(parent){ const p = i.byPair.get(sku + '|' + parent); if(p) return p; }
  return i.bySku.get(sku) || null;
}
function productsOfSku(sku){ return dataIdx().skuList.get(sku) || []; }
function productImg(sku, color, parent){
  const p = findProduct(sku, parent); if(!p) return '';
  const cs = p.colors || [];
  let c = color ? cs.find(x => x.name === color) : null;
  c = c || cs[0];
  return c ? (c.img || '') : '';
}
function parentImg(parent, skuHint){
  if(skuHint){ const im = productImg(skuHint, null, parent); if(im) return im; }
  const p = dataIdx().byParent.get(parent);
  const cs = (p && p.colors) || [];
  return cs[0] ? (cs[0].img || '') : '';
}
function typeOfSku(sku){ const p = findProduct(sku); return p ? p.type : ''; }

/* ---- 父ASIN 主体关系：父ASIN ⟷ 店铺 一一对应；货号 ⟷ 产品类型 一一对应；一个货号可对应多个父ASIN ---- */
function parentMeta(parent){
  const ps = ((DB && DB.products) || []).filter(p => p.parent === parent);
  const withShop = ps.find(p => p.shop) || {};
  return { parent, shop: withShop.shop || '', count: ps.length, skus: [...new Set(ps.map(p => p.sku).filter(Boolean))], list: ps };
}
function shopOfParent(parent){ return parent ? (dataIdx().parentShops.get(parent) || '') : ''; }
function parentsOfSku(sku){ return [...new Set(productsOfSku(sku).map(p => p.parent).filter(Boolean))]; }
function typeOfSkuStrict(sku){ const p = productsOfSku(sku).find(x => x.type); return p ? p.type : ''; }
function parentExists(parent){ return !!(parent && dataIdx().byParent.get(parent)); }
/* 父ASIN 变更：以父体为单位，产品表与全部关联业务数据一起迁移（可同时改店铺） */
function renameParentEverywhere(oldParent, newParent, newShop){
  if(!oldParent || !newParent) return 0;
  let n = 0;
  (DB.products || []).forEach(p => {
    if(p.parent === oldParent){ p.parent = newParent; if(newShop) p.shop = newShop; n++; }
  });
  ['promotions','ads','sampling','creators','inventory','shipments','factoryOrders','skus'].forEach(k => {
    (DB[k] || []).forEach(r => {
      if(r.parent === oldParent){ r.parent = newParent; if(newShop) r.shop = newShop; n++; }
    });
  });
  invalidateIdx();
  return n;
}
/* 店铺以父ASIN为准：所有业务记录里的店铺统一回填为所属父体的店铺 */
function syncShopByParent(){
  const shops = dataIdx().parentShops;
  ['promotions','ads','sampling','creators','inventory','shipments','factoryOrders','skus'].forEach(k => {
    (DB[k] || []).forEach(r => { if(r.parent && shops.has(r.parent)) r.shop = shops.get(r.parent); });
  });
}
function propagateProductMeta(p){
  // 货号/店铺/父ASIN 一处修改，全局同步（仅同父体或未填父体的记录，避免串到其他父体）
  ['promotions','ads','sampling','creators','inventory','shipments','factoryOrders','skus'].forEach(k => {
    (DB[k] || []).forEach(r => {
      if(r.sku !== p.sku) return;
      if(r.parent && p.parent && r.parent !== p.parent) return;
      r.shop = p.shop; r.parent = p.parent;
    });
  });
}
function propagateSkuRename(oldSku, newSku, parent){
  ['promotions','ads','sampling','creators','inventory','shipments','factoryOrders','skus'].forEach(k => {
    (DB[k] || []).forEach(r => {
      if(r.sku !== oldSku) return;
      if(parent && r.parent && r.parent !== parent) return; // 只改本父体下的记录，其他父体的同货号不受影响
      r.sku = newSku;
    });
  });
}
function refreshDatalists(){
  const set = (id, arr) => {
    const el = document.getElementById(id); if(!el) return;
    el.innerHTML = [...new Set((arr || []).filter(Boolean))].map(v => `<option value="${esc(v)}">`).join('');

  set('typeList', P.map(p => p.type));

/* 工厂未出货数量：先建索引再查，避免库存页逐行扫描全部工厂订单（数据量增长后是平方级开销） */
let _facIdx = null, _facIdxRev = -1;
function factoryIdx(){
  if(_facIdx && _facIdxRev === _dataRev) return _facIdx;
  const byKey = new Map(), bySku = new Map(), byParent = new Map();
  (DB.factoryOrders || []).forEach(o => {
    if(o.shippedAt) return; // 仅未完成（未出货）订单计入
    const q = num(o.qty), sku = o.sku || '', k = sku + '|' + (o.color || '');
    byKey.set(k, (byKey.get(k) || 0) + q);
    bySku.set(sku, (bySku.get(sku) || 0) + q);
    // 按父ASIN+颜色聚合：未填父ASIN时按货号唯一归属的父体回填
    let parent = o.parent || '';
    if(!parent){ const ps = parentsOfSku(sku); if(ps.length === 1) parent = ps[0]; }
    if(parent){ const pk = parent + '|' + (o.color || ''); byParent.set(pk, (byParent.get(pk) || 0) + q); }
  });
  _facIdx = { byKey, bySku, byParent }; _facIdxRev = _dataRev;
  return _facIdx;
}
/* 父ASIN + 颜色 维度的工厂未出货数量（产品库存情况页展示用） */
function factoryUnshippedByParent(parent, color){
  if(!parent) return 0;
  try {
    const idx = factoryIdx();
    return idx.byParent.get(parent + '|' + (color || '')) || 0;
  }catch(e){
    return (DB.factoryOrders || []).filter(o => {
      if(o.shippedAt || !o.color || o.color !== color) return false;
      let p = o.parent || ''; if(!p){ const ps = parentsOfSku(o.sku); if(ps.length === 1) p = ps[0]; }
      return p === parent;
    }).reduce((s, o) => s + num(o.qty), 0);
  }
}
function factoryUnshipped(sku, color){
  try {
    const idx = factoryIdx();
    return color ? (idx.byKey.get(sku + '|' + color) || 0) : (idx.bySku.get(sku) || 0);
  } catch(e){
    return (DB.factoryOrders || []).filter(o => o.sku === sku && (!color || o.color === color) && !o.shippedAt)
      .reduce((s, o) => s + num(o.qty), 0);
  }
}

/* 库存汇总：具体产品情况(skus) 按父ASIN+颜色聚合 → 产品库存情况页 */
function inventoryAgg(){
  const map = new Map(); // parent -> { parent, shop, type, skus:Set, colors: Map(color -> {sellable, transit}) }
  (DB.skus || []).forEach(r => {
    const key = r.parent || '（未填父ASIN）';
    if(!map.has(key)) map.set(key, { parent: r.parent || '', label: key, shop: r.shop || '', skus: new Set(), colors: new Map() });
    const g = map.get(key);
    if(r.sku) g.skus.add(r.sku);
    if(!g.shop && r.shop) g.shop = r.shop;
    const ck = r.color || '未填颜色';
    if(!g.colors.has(ck)) g.colors.set(ck, { color: r.color || '', sellable: 0, transit: 0, factoryImport: 0 });
    const c = g.colors.get(ck);
    c.sellable += num(r.fbaSellable); c.transit += num(r.transit);
    c.factoryImport += num(r.factoryUnshipped); // 模板「工厂未出货」列导入值
  });
  return map;
}

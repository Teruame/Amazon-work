<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>亚马逊运营工作台</title>
<style>
:root{
  --bg:#f1efe9; --card:#ffffff; --line:#e8e5db; --txt:#333d35; --sub:#8a9188;
  --acc:#2e7d5b; --acc-deep:#256a4c; --acc-bg:#e4f0e8;
  --ok:#2e7d5b; --ok-bg:#e4f0e8;
  --warn:#b7791f; --warn-bg:#faf1df;
  --err:#c05648; --err-bg:#fbeae7;
  --info:#4a7dab; --info-bg:#e8f1f8;
  --panel:#f7f6f1; --panel-line:#eeede5; --th-bg:#faf9f4; --td-line:#f2f1ea; --hover:#eef2e9;
  --pill:#f4f2ec; --tag-gray:#eceae1; --img-bg:#edefe6; --chip-bg:#f1efe7; --zero:#c9cec2; --dash:#f0eee6;
  --side1:#fbfaf6; --side2:#f4f4ec; --side3:#e9efe2; --nav-txt:#6f7a6e; --nav-grp:#a9b0a2;
  --scroll:#d8d5c9; --toast:#37413a; --row-del:#b9bfb1; --empty:#a3a899;
  --acc-soft:rgba(46,125,91,.08); --acc-ring:rgba(46,125,91,.13); --acc-glow:rgba(46,125,91,.3);
  --acc-txt:#ffffff; --overlay:rgba(45,55,45,.45);
  --radius:14px; --shadow:0 1px 2px rgba(85,85,60,.05),0 4px 16px rgba(85,85,60,.07);
}
/* ===== 主题：莫兰迪 · 灰绿 ===== */
[data-theme="sage"]{
  --bg:#ebece6; --card:#f8f9f5; --line:#dcded4; --txt:#3b4038; --sub:#8b9088;
  --acc:#7f927c; --acc-deep:#6d806a; --acc-bg:#e7ece2;
  --ok:#7f927c; --ok-bg:#e7ece2; --warn:#a8845c; --warn-bg:#f3ecdf;
  --err:#a97e78; --err-bg:#f2e6e4; --info:#8497a6; --info-bg:#e9edf0;
  --panel:#f1f2ec; --panel-line:#e3e5dc; --th-bg:#f4f5ef; --td-line:#e8eae1; --hover:#e9ece2;
  --pill:#e8eae2; --tag-gray:#e2e4db; --img-bg:#e4e6dc; --chip-bg:#eff0e9; --zero:#c2c6ba; --dash:#e9eae1;
  --side1:#f9f9f5; --side2:#f0f2ea; --side3:#e3e8de; --nav-txt:#6f776d; --nav-grp:#a5ab9f;
  --scroll:#d4d7cb; --toast:#4a4f47; --row-del:#b7bcb0; --empty:#9aa092;
  --acc-soft:rgba(127,146,124,.10); --acc-ring:rgba(127,146,124,.16); --acc-glow:rgba(127,146,124,.32);
  --acc-txt:#ffffff;
  --overlay:rgba(60,64,56,.45);
  --shadow:0 1px 2px rgba(90,95,80,.06),0 4px 16px rgba(90,95,80,.09);
}
/* ===== 主题：莫兰迪 · 雾霾蓝 ===== */
[data-theme="mist"]{
  --bg:#e8ebef; --card:#f7f9fb; --line:#dbe0e7; --txt:#333a42; --sub:#828b95;
  --acc:#7b8fa5; --acc-deep:#697d92; --acc-bg:#e5ecf2;
  --ok:#7b8fa5; --ok-bg:#e5ecf2; --warn:#a58a5e; --warn-bg:#f2ecdf;
  --err:#a97e78; --err-bg:#f2e6e4; --info:#7b8fa5; --info-bg:#e5ecf2;
  --panel:#eef1f5; --panel-line:#e0e5eb; --th-bg:#f2f4f8; --td-line:#e6eaf0; --hover:#e8edf3;
  --pill:#e6eaf0; --tag-gray:#e0e4ea; --img-bg:#e2e7ed; --chip-bg:#edf0f4; --zero:#bec5ce; --dash:#e7eaef;
  --side1:#f8fafc; --side2:#eef2f6; --side3:#e2e9f0; --nav-txt:#6d7884; --nav-grp:#a3abb5;
  --scroll:#d3d8df; --toast:#414a54; --row-del:#b4bcc6; --empty:#969eaa;
  --acc-soft:rgba(123,143,165,.12); --acc-ring:rgba(123,143,165,.18); --acc-glow:rgba(123,143,165,.32);
  --acc-txt:#ffffff;
  --overlay:rgba(52,58,66,.45);
  --shadow:0 1px 2px rgba(70,80,95,.06),0 4px 16px rgba(70,80,95,.09);
}
/* ===== 主题：莫兰迪 · 豆沙粉 ===== */
[data-theme="rose"]{
  --bg:#efe9e8; --card:#faf7f6; --line:#e2d9d7; --txt:#413a39; --sub:#948b8a;
  --acc:#ab8585; --acc-deep:#96716f; --acc-bg:#f0e4e3;
  --ok:#96a88f; --ok-bg:#e9ece4; --warn:#ab8a62; --warn-bg:#f4ead9;
  --err:#b3706a; --err-bg:#f4e0de; --info:#8a94a8; --info-bg:#e8ecf1;
  --panel:#f4efee; --panel-line:#e7dcd9; --th-bg:#f7f2f1; --td-line:#ece2e0; --hover:#efe3e2;
  --pill:#ece4e3; --tag-gray:#e6dcd9; --img-bg:#e9e0de; --chip-bg:#f1eae9; --zero:#cfc2c0; --dash:#efe7e5;
  --side1:#fbf8f7; --side2:#f4edec; --side3:#ecdfdf; --nav-txt:#847a79; --nav-grp:#b0a5a4;
  --scroll:#dcd2d0; --toast:#504746; --row-del:#c2b6b5; --empty:#a59a99;
  --acc-soft:rgba(171,133,133,.10); --acc-ring:rgba(171,133,133,.16); --acc-glow:rgba(171,133,133,.30);
  --acc-txt:#ffffff;
  --overlay:rgba(66,58,57,.45);
  --shadow:0 1px 2px rgba(100,88,86,.06),0 4px 16px rgba(100,88,86,.09);
}
/* ===== 主题：莫兰迪 · 燕麦 ===== */
[data-theme="oat"]{
  --bg:#eee9e1; --card:#f9f6f1; --line:#e0d9cd; --txt:#403a31; --sub:#8f887b;
  --acc:#a58f6f; --acc-deep:#8f7a5c; --acc-bg:#f0e8dc;
  --ok:#8f9f7a; --ok-bg:#e9ecdf; --warn:#b38b52; --warn-bg:#f4ead8;
  --err:#ad7365; --err-bg:#f3e3de; --info:#87909e; --info-bg:#e9ebef;
  --panel:#f3eee6; --panel-line:#e6ddce; --th-bg:#f6f1e9; --td-line:#ebe4d8; --hover:#eee6da;
  --pill:#eae4d9; --tag-gray:#e5ddd0; --img-bg:#e6dfd2; --chip-bg:#f0eae1; --zero:#cbc2b3; --dash:#ede5d9;
  --side1:#fbf9f4; --side2:#f4efe5; --side3:#eae0cf; --nav-txt:#82796a; --nav-grp:#aca494;
  --scroll:#dbd3c5; --toast:#4d463b; --row-del:#bcb3a3; --empty:#a29a8c;
  --acc-soft:rgba(165,143,111,.10); --acc-ring:rgba(165,143,111,.16); --acc-glow:rgba(165,143,111,.32);
  --acc-txt:#ffffff;
  --overlay:rgba(64,58,49,.45);
  --shadow:0 1px 2px rgba(95,88,73,.06),0 4px 16px rgba(95,88,73,.09);
}
/* ===== 主题：静谧夜（深色） ===== */
[data-theme="night"]{
  --bg:#1c211e; --card:#242a26; --line:#333a34; --txt:#e3e8e3; --sub:#96a097;
  --acc:#7fae94; --acc-deep:#6d9c82; --acc-bg:#2b3a31;
  --ok:#7fae94; --ok-bg:#2b3a31; --warn:#d0a866; --warn-bg:#3a3323;
  --err:#d98a7e; --err-bg:#3d2b28; --info:#89a7c4; --info-bg:#26323c;
  --panel:#2b312c; --panel-line:#39413a; --th-bg:#272d29; --td-line:#313833; --hover:#2f362f;
  --pill:#2a302b; --tag-gray:#39413a; --img-bg:#333a34; --chip-bg:#2b312c; --zero:#4a524b; --dash:#313833;
  --side1:#202622; --side2:#1e241f; --side3:#1a201b; --nav-txt:#a8b3a9; --nav-grp:#6f7a70;
  --scroll:#3d453f; --toast:#4f6d5d; --row-del:#5c665e; --empty:#7d877e;
  --acc-soft:rgba(127,174,148,.16); --acc-ring:rgba(127,174,148,.22); --acc-glow:rgba(127,174,148,.35);
  --acc-txt:#17211b;
  --overlay:rgba(0,0,0,.62);
  --shadow:0 1px 2px rgba(0,0,0,.25),0 6px 18px rgba(0,0,0,.3);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"PingFang SC","Microsoft YaHei",-apple-system,sans-serif;background:var(--bg);color:var(--txt);font-size:14px}
button{font-family:inherit;cursor:pointer;border:none;border-radius:9px;font-size:13px;white-space:nowrap}
input,select,textarea{font-family:inherit;font-size:13px;color:var(--txt);border:1px solid var(--line);border-radius:9px;padding:7px 10px;background:var(--card);outline:none;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-ring)}
label{font-size:12px;color:var(--sub);display:block;margin-bottom:5px}
.nav::-webkit-scrollbar,.content::-webkit-scrollbar,.modal-body::-webkit-scrollbar{width:8px}
.nav::-webkit-scrollbar-thumb,.content::-webkit-scrollbar-thumb,.modal-body::-webkit-scrollbar-thumb{background:var(--scroll);border-radius:99px}

/* ===== 布局 ===== */
.app{display:flex;height:100vh;overflow:hidden}
@supports (height:100dvh){.app{height:100dvh}} /* 安卓/HarmonyOS 浏览器地址栏动态视口，防底部被裁 */
.sidebar{width:232px;background:linear-gradient(180deg,var(--side1) 0%,var(--side2) 55%,var(--side3) 100%);border-right:1px solid var(--line);display:flex;flex-direction:column;flex-shrink:0;transition:width .2s}
.sidebar.collapsed{width:64px}
.sidebar.collapsed .nav-txt,.sidebar.collapsed .brand-txt,.sidebar.collapsed .collapse-label,.sidebar.collapsed .nav-grp,.sidebar.collapsed .sf-txt{display:none}
.brand{display:flex;align-items:center;gap:11px;padding:20px 16px 14px}
.brand-icon{width:38px;height:38px;border-radius:12px;background:var(--acc);color:var(--acc-txt);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;flex-shrink:0;box-shadow:0 4px 10px var(--acc-glow)}
.brand-txt b{display:block;font-size:14.5px;letter-spacing:.3px}
.brand-txt span{display:block;font-size:11px;color:var(--sub);margin-top:2px}
.nav{flex:1;overflow-y:auto;padding:2px 12px 10px}
.nav-grp{font-size:11px;color:var(--nav-grp);padding:16px 6px 6px;letter-spacing:1px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;color:var(--nav-txt);cursor:pointer;margin-bottom:2px;transition:all .15s;white-space:nowrap;font-size:13.5px}
.nav-item:hover{background:var(--acc-soft);color:var(--txt)}
.nav-item.active{background:var(--acc);color:var(--acc-txt);font-weight:600;box-shadow:0 4px 12px var(--acc-glow)}
.nav-item .nav-ico{width:20px;display:flex;justify-content:center;flex-shrink:0}
.nav-item .nav-ico svg{width:17px;height:17px}
.side-foot{display:flex;align-items:center;gap:9px;padding:14px 18px;border-top:1px solid var(--line)}
/* 侧栏快捷区（仅手机端显示：主题切换 / 提醒入口） */
.sb-quick{display:none}
.sbq-btn{position:relative;width:46px;min-height:46px;display:flex;align-items:center;justify-content:center;background:none;color:var(--nav-txt);border-radius:11px;cursor:pointer;border:none;padding:0}
.sbq-btn svg{width:20px;height:20px}
.sbq-btn:active{background:var(--acc-soft)}
.side-foot .sf-ico{width:26px;height:26px;border-radius:8px;background:var(--acc-bg);color:var(--acc);display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.side-foot .sf-txt b{display:block;font-size:12.5px}
.side-foot .sf-txt span{display:block;font-size:11px;color:var(--sub);margin-top:1px}
.collapse-btn{margin:0 14px 14px;padding:8px;border-radius:8px;background:transparent;color:var(--sub);font-size:12px}
.collapse-btn:hover{color:var(--acc);background:var(--acc-soft)}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{height:60px;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:20px;padding:0 24px;flex-shrink:0}
.crumb{color:var(--sub);font-size:13px;white-space:nowrap}
.crumb b{color:var(--txt);font-weight:600}
.top-right{margin-left:auto;display:flex;align-items:center;gap:12px}
.top-ico{background:none;color:var(--sub);position:relative;padding:7px;border-radius:9px;display:flex}
.top-ico svg{width:18px;height:18px}
.top-ico:hover{background:var(--pill);color:var(--txt)}
.bell-dot{position:absolute;top:5px;right:5px;width:8px;height:8px;background:var(--err);border-radius:50%;border:2px solid var(--card)}
.avatar{display:flex;align-items:center;gap:9px}
.avatar-circle{width:36px;height:36px;border-radius:50%;background:var(--acc);color:var(--acc-txt);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600}
.avatar-meta b{display:block;font-size:13px}
.avatar-meta span{font-size:11px;color:var(--sub)}
.content{flex:1;overflow-y:auto;padding:26px 30px}
.page-head{margin-bottom:20px}
.page-head h1{font-size:24px;font-weight:700;letter-spacing:.3px}
.page-head p{color:var(--sub);font-size:13px;margin-top:5px}

/* ===== 通用组件 ===== */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:18px}
.card-head{padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.card-head h2{font-size:15px;font-weight:600;display:flex;align-items:center;gap:9px}
.h2-ico{display:inline-flex;color:var(--acc)}
.h2-ico svg{width:16px;height:16px}
.count-badge{background:var(--acc);color:var(--acc-txt);font-size:11px;border-radius:999px;padding:1px 9px;min-width:20px;text-align:center;font-weight:500}
.count-badge.zero{background:var(--zero)}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.head-left{display:flex;align-items:center;gap:14px;flex-wrap:wrap;min-width:0}
.head-left .search-wrap{flex:0 1 330px;min-width:220px}
.color-cell.clickable{cursor:pointer}
.color-cell.clickable:hover .thumb{outline:2px solid var(--acc);outline-offset:1px}
.det-img{width:100%;max-width:280px;height:200px;border-radius:12px;background-size:cover;background-position:center;background-color:var(--img-bg);margin:0 auto 4px}
.det-img.noimg{display:flex;align-items:center;justify-content:center;color:var(--empty);font-size:13px}
.det-grid{display:grid;grid-template-columns:70px 1fr;gap:9px 14px;font-size:13.5px;margin-top:12px}
.det-grid .k{color:var(--sub)}
.det-grid .v{font-weight:500}
.search-wrap{display:flex;gap:8px;align-items:center;flex:1;min-width:260px;max-width:430px}
.search-wrap input{min-width:0;border-radius:999px;padding:8px 15px;background:var(--panel);border-color:transparent}
.search-wrap input:focus{background:var(--card);border-color:var(--acc)}
.btn{background:var(--acc);color:var(--acc-txt);padding:8px 14px;font-weight:500}
.btn:hover{background:var(--acc-deep)}
.btn.ghost{background:var(--card);color:var(--txt);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--acc);color:var(--acc);background:var(--acc-bg)}
.btn.danger{background:var(--err)}
.btn.warn{background:var(--warn)}
.btn.sm{padding:4px 10px;font-size:12px;border-radius:7px}
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:12px;color:var(--sub);font-weight:600;text-align:left;padding:11px 16px;background:var(--th-bg);border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:12px 16px;border-bottom:1px solid var(--td-line);vertical-align:middle}
.tbl tbody tr:hover{background:var(--hover)}
.tbl tbody tr:last-child td{border-bottom:none}
.thumb{width:44px;height:44px;border-radius:10px;background-size:cover;background-position:center;background-color:var(--img-bg);flex-shrink:0}
.thumb-empty{display:flex;align-items:center;justify-content:center;color:var(--empty);font-size:11px;background:var(--img-bg)}
.tag{display:inline-flex;align-items:center;font-size:11px;border-radius:999px;padding:3px 10px;white-space:nowrap;font-weight:500}
.tag.ok{background:var(--ok-bg);color:var(--ok)}
.tag.warn{background:var(--warn-bg);color:var(--warn)}
.tag.err{background:var(--err-bg);color:var(--err)}
.tag.info{background:var(--info-bg);color:var(--info)}
.tag.gray{background:var(--tag-gray);color:var(--sub)}
.empty{padding:36px;text-align:center;color:var(--empty)}
.link-btn{color:var(--acc);background:none;padding:2px 4px;font-size:13px}
.link-btn:hover{text-decoration:underline}
.mini-btn{background:var(--card);border:1px solid var(--line);color:var(--sub);padding:2px 7px;font-size:12px;border-radius:7px}
.mini-btn:hover{color:var(--acc);border-color:var(--acc)}
.chip{display:inline-flex;align-items:center;gap:4px;background:#f1efe7;border-radius:999px;padding:2px 9px;font-size:12px;margin:2px 3px 2px 0;color:var(--sub);background:var(--chip-bg)}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.err{background:var(--err-bg);color:var(--err)}
.color-cells{display:flex;gap:6px;flex-wrap:wrap}
.color-cell{text-align:center}
.color-cell .thumb{width:36px;height:36px}
.color-cell span{display:block;font-size:10px;color:var(--sub);margin-top:2px}

/* 统计卡片 */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;margin-bottom:18px}
.stat-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;display:flex;align-items:center;gap:14px}
.stat-ico{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.stat-ico svg{width:20px;height:20px}
.s-green{background:var(--acc-bg);color:var(--acc)}
.s-blue{background:var(--info-bg);color:var(--info)}
.s-orange{background:var(--warn-bg);color:var(--warn)}
.s-red{background:var(--err-bg);color:var(--err)}
.stat-label{font-size:12px;color:var(--sub)}
.stat-num{font-size:22px;font-weight:700;margin-top:3px}
.stat-num span{font-size:12px;color:var(--sub);font-weight:400;margin-left:6px}
.stat-card.clickable{cursor:pointer;transition:transform .15s,box-shadow .15s}
.stat-card.clickable:hover{transform:translateY(-2px);box-shadow:var(--shadow),0 6px 16px rgba(0,0,0,.10)}
.stat-card.clickable:active{transform:translateY(0)}

/* 表格表头点击排序 */
.tbl thead th.sortable{cursor:pointer;user-select:none}
.tbl thead th.sortable:hover{color:var(--acc)}
.sort-ar{color:var(--acc);font-size:10px;margin-left:2px}
.tbl thead th[draggable="true"]{cursor:grab}
.tbl thead th.drop-before{box-shadow:inset 3px 0 0 var(--acc)}
.tbl thead th.drop-after{box-shadow:inset -3px 0 0 var(--acc)}

/* 提醒卡片拖拽手柄 */
.drag-handle{cursor:grab;color:var(--sub);font-size:15px;line-height:1;padding:5px 4px;border-radius:6px;user-select:none;touch-action:none;flex:0 0 auto}
.drag-handle:hover{color:var(--acc);background:var(--hover)}
.drag-handle:active{cursor:grabbing}

/* 提醒中心 */
.remind-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px}
.remind-item{display:flex;align-items:flex-start;gap:10px;padding:11px 14px;border-radius:12px;background:var(--panel);margin-bottom:8px}
.remind-item:hover{background:var(--hover)}
.remind-item .r-txt{flex:1;min-width:0}
.remind-item .r-title{font-weight:500;margin-bottom:2px}
.remind-item .r-sub{color:var(--sub);font-size:12px}

/* 提醒卡片展开/折叠 */
.rem-body{padding:14px 16px}
.rem-body.hidden{padding:10px 16px}
.rem-body.hidden .empty{padding:8px}
.head-acts{display:flex;align-items:center;gap:8px}
.rem-toggle{min-width:76px;justify-content:center}
.rem-toggle:hover{border-color:var(--acc)}

/* Excel 导入结果回传 */
.imp-sum{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.imp-sum .tag{font-size:12.5px;padding:5px 13px}
.imp-wrap{max-height:320px;overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.imp-tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.imp-tbl th{position:sticky;top:0;background:var(--th-bg);color:var(--sub);font-weight:600;padding:7px 10px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--line)}
.imp-tbl td{padding:7px 10px;border-bottom:1px solid var(--td-line);color:var(--txt);word-break:break-all;white-space:normal}
.imp-tbl tr:last-child td{border-bottom:none}
.imp-tbl tr.imp-fail td{background:var(--err-bg);color:var(--err);font-weight:600}
.imp-tbl tr.imp-skip td{color:var(--sub)}
.imp-note{font-size:12px;color:var(--sub);margin-top:10px}
.imp-note b{color:var(--err)}
/* 模态框 */
.overlay{position:fixed;inset:0;background:var(--overlay);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal{background:var(--card);border-radius:16px;width:640px;max-width:96vw;max-height:88vh;display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(0,0,0,.2)}
.modal.wide{width:860px}
.modal.xl{width:980px}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal-head h3{font-size:15px;font-weight:600}
.modal-close{background:none;font-size:20px;color:var(--sub);line-height:1;padding:2px 6px}
.modal-close:hover{color:var(--err)}
.modal-body{padding:18px 20px;overflow-y:auto}
.modal-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.form-grid .full{grid-column:1/-1}

/* 主题选择面板 */
.theme-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.theme-card{border:2px solid var(--line);border-radius:14px;padding:9px;cursor:pointer;background:var(--card);transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease}
.theme-card:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--acc)}
.theme-card.active{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-ring)}
.theme-prev{position:relative;height:86px;border-radius:9px;overflow:hidden;display:flex}
.tp-side{width:26%;display:flex;flex-direction:column;align-items:center;padding-top:9px;gap:5px}
.tp-brand{width:18px;height:18px;border-radius:6px}
.tp-dot{width:14px;height:6px;border-radius:99px;opacity:.85}
.tp-main{flex:1;padding:9px 9px}
.tp-bar{height:16px;border-radius:6px;display:flex;align-items:center;gap:4px;padding:0 6px}
.tp-bar span{width:16px;height:5px;border-radius:99px;display:block}
.tp-pills{display:flex;gap:5px;margin-top:8px}
.tp-pills span{width:22px;height:10px;border-radius:99px;display:block}
.tp-check{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;background:var(--acc);color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.theme-meta{padding:9px 4px 2px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.theme-meta b{font-size:13.5px}
.theme-desc{display:block;width:100%;font-size:12px;color:var(--sub);margin-top:2px}
.pe-sec{margin-bottom:18px}
.pe-sec>h4{font-size:13px;color:var(--acc);margin-bottom:9px;padding-bottom:6px;border-bottom:1px dashed var(--line)}
.pe-row{display:grid;grid-template-columns:44px 1fr 1.8fr 1.8fr 34px;gap:8px;margin-bottom:8px;align-items:center}
.pe-row.adj{grid-template-columns:150px 1fr 34px}
.row-del{background:none;color:var(--row-del);font-size:16px;padding:4px}
.row-del:hover{color:var(--err)}
/* 产品编辑器颜色行内的图片组（链接 + 本地上传） */
.pe-img{display:flex;align-items:center;gap:6px;min-width:0}
.pe-cur{flex:1;min-width:0;padding:7px 9px;font-size:12.5px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--txt);outline:none}
.pe-cur:focus{border-color:var(--acc)}
.pe-up{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--acc);font-size:11.5px;padding:6px 8px;border-radius:8px;cursor:pointer;white-space:nowrap}
.pe-up:hover{border-color:var(--acc);background:var(--pill)}
.pe-tag{flex:0 0 auto;font-size:11px;color:var(--sub);padding:3px 7px;border-radius:20px;background:var(--pill);cursor:pointer;white-space:nowrap}
.pe-tag:hover{color:var(--acc)}
/* 通用图片字段（链接 / 本地上传 双模式） */
.imgf{grid-column:1/-1;display:flex;gap:11px;align-items:flex-start;padding:11px;border:1px solid var(--line);border-radius:11px;background:var(--panel)}
.imgf-prev{width:66px;height:66px;flex:0 0 auto;border-radius:10px;border:1px solid var(--line);background:var(--img-bg) center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-size:19px;color:var(--empty)}
.imgf-main{flex:1;min-width:0}
.imgf-label{font-size:12px;color:var(--sub);margin-bottom:6px}
.imgf-tabs{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:2px;margin-bottom:7px}
.itab{border:0;background:transparent;color:var(--sub);font-size:12px;padding:4px 10px;border-radius:6px;cursor:pointer;transition:.15s}
.itab.on{background:var(--acc);color:var(--acc-txt)}
.imgf-url{width:100%;box-sizing:border-box;padding:8px 10px;font-size:13px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--txt);outline:none;transition:.15s}
.imgf-url:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(46,125,91,.12)}
.imgf-local{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.imgf-file{font-size:11px;color:var(--sub);word-break:break-all}
.term-list .term{display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:8px;margin-bottom:4px;background:var(--panel)}
.term .t-txt{flex:1;font-size:12.5px}
.term-add{display:flex;gap:6px;margin-top:6px}
.act-mini{background:var(--panel);border:1px solid var(--panel-line);border-radius:10px;padding:6px 9px;margin-bottom:6px;font-size:12px}
.act-mini .am-meta{color:var(--sub);font-size:11px;margin-top:3px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.desc-list{width:100%}
.desc-list td,.desc-list th{padding:6px 8px;font-size:12.5px}

/* Toast */
#toastRoot{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:var(--toast);color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.25);animation:fadein .2s}
.toast.ok{background:var(--acc)}
.toast.err{background:var(--err)}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
/* ===== 响应式布局（电脑 / 手机双状态） ===== */
html,body{overflow-x:hidden;-webkit-text-size-adjust:100%}
img{max-width:100%}
.hamburger{display:none;background:none;color:var(--txt);padding:7px;border-radius:9px;flex-shrink:0}
.hamburger svg{width:22px;height:22px}
.hamburger:active{background:var(--pill)}
.drawer-backdrop{display:none}
/* 触屏设备：所有按钮保证清晰点击区域（≥44px），输入16px防iOS缩放 */
@media (hover:none) and (pointer:coarse){
  button,.nav-item{touch-action:manipulation}
  .btn,.link-btn,.row-del,.modal-close,.top-ico,.hamburger{min-height:44px;min-width:44px;display:inline-flex;align-items:center;justify-content:center}
  .mini-btn{min-height:38px;min-width:38px;display:inline-flex;align-items:center;justify-content:center}
  .btn.sm{min-height:40px;min-width:40px}
  .nav-item{min-height:46px}
  .collapse-btn{min-height:44px}
  input,select,textarea{font-size:16px}
}
/* 手机布局状态（≤900px）：单列 + 汉堡菜单 */
@media (max-width:900px){
  .hamburger{display:none} /* 恢复固定左侧栏，不再需要抽屉入口 */
  .crumb,.avatar-meta,.help-ico,.collapse-btn{display:none}
  /* 顶栏整体去掉（华为 Mate 80 Pro 等手机端）：功能入口移至侧栏快捷区 */
  .topbar{display:none !important}
  /* 左侧栏：固定显示，仅图标（适中边距），长按/悬停可见完整名称（title 提示） */
  .sidebar{position:static;width:62px;transform:none;box-shadow:none;border-right:1px solid var(--line)}
  .sidebar.open{transform:none}
  /* 品牌区让出状态栏/挖孔摄像头区域 */
  .brand{justify-content:center;padding:calc(14px + env(safe-area-inset-top, 0px)) 8px 10px}
  @supports not (padding:calc(0px + env(safe-area-inset-top, 0px))){
    .brand{padding-top:18px}
  }
  .brand-icon{width:36px;height:36px;font-size:16px}
  .brand-txt,.nav-txt,.nav-grp,.sf-txt,.collapse-btn,.collapse-label{display:none}
  .nav{padding:6px 6px}
  .nav-item{justify-content:center;padding:11px 0;margin:0 0 6px;min-height:46px;border-radius:11px}
  .nav-item .nav-ico svg{width:20px;height:20px}
  /* 侧栏快捷区（顶栏去掉后的主题/提醒入口） */
  .sb-quick{display:flex;flex-direction:column;align-items:center;gap:6px;margin:auto 0 4px;padding:8px 8px 2px;border-top:1px solid var(--line)}
  .sbq-btn{width:46px;min-height:46px}
  .sbq-btn .bell-dot{top:8px;right:8px}
  .side-foot{justify-content:center;padding:10px 0;border-top:none}
  .drawer-backdrop{display:none !important}
  /* 内容区单列：顶部让出状态栏/挖孔区，底部让出手势条 */
  .content{padding:calc(14px + env(safe-area-inset-top, 0px)) 12px calc(24px + env(safe-area-inset-bottom, 0px))}
  @supports not (padding:calc(0px + env(safe-area-inset-top, 0px))){
    .content{padding-top:18px}
  }
  .page-head{margin-bottom:14px}
  .page-head h1{font-size:19px}
  .page-head p{font-size:12px}
  .stat-grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .stat-num{font-size:19px}
  .remind-grid{grid-template-columns:1fr}
  .remind-item{padding:10px 12px}
  .rem-card .card-head,.remind-grid .card-head{flex-direction:row;align-items:center}
  .remind-grid .head-acts{margin-left:auto}
  .remind-grid .head-acts .btn{flex:0 0 auto}
  /* 卡片头纵向堆叠，搜索占满一行 */
  .card-head{flex-direction:column;align-items:stretch;gap:10px;padding:14px}
  .head-left{width:100%}
  .head-left .search-wrap{flex:1 1 100%;max-width:none;min-width:0}
  .toolbar{width:100%}
  .toolbar .btn{flex:1 1 auto;justify-content:center}
  /* 表格 → 卡片式行（正文无横向滚动） */
  .tbl-wrap{overflow-x:visible}
  table.tbl{display:block}
  table.tbl thead{display:none}
  table.tbl tbody{display:block}
  table.tbl tr{display:block;border:1px solid var(--line);border-radius:12px;margin-bottom:12px;padding:4px 0;background:var(--card);box-shadow:0 1px 6px rgba(85,85,60,.06)}
  table.tbl tbody tr:hover{background:var(--card)}
  table.tbl td{display:flex;flex-wrap:wrap;align-items:flex-start;gap:8px 10px;border-bottom:1px dashed var(--dash);padding:9px 13px;white-space:normal;word-break:break-word}
  table.tbl td:last-of-type{border-bottom:none}
  table.tbl td::before{content:attr(data-label);flex:0 0 5.5em;color:var(--sub);font-size:12px;font-weight:600;line-height:1.9}
  table.tbl td[colspan]{display:block;border-bottom:none;padding:20px 14px;text-align:center}
  table.tbl td[colspan]::before{content:''}
  table.tbl td .act-mini{flex:1 1 100%}
  /* 模态框 → 底部弹层（让出底部手势区） */
  .overlay{padding:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom, 0px));align-items:flex-end;z-index:150}
  .modal,.modal.wide,.modal.xl{width:100%;max-width:100%;max-height:calc(100% - 12px);border-radius:18px 18px 12px 12px}
  .modal-foot{padding-bottom:calc(14px + env(safe-area-inset-bottom, 0px))}
  .modal-body{padding:14px}
  .form-grid{grid-template-columns:1fr}
  /* 产品编辑器颜色行 / 样鞋记录行纵向堆叠 */
  .pe-row{grid-template-columns:44px 1fr 34px;grid-template-areas:"t n d" "t i i" "f f f"}
  .pe-row>.thumb{grid-area:t}
  .pe-row .pe-cn{grid-area:n}
  .pe-row .pe-img{grid-area:i}
  .pe-row .pe-cf{grid-area:f}
  .pe-row .row-del{grid-area:d}
  .pe-row.adj{display:flex;flex-direction:column;align-items:stretch;gap:6px}
  .pe-row.adj .row-del{align-self:flex-end}
  .desc-list td,.desc-list th{white-space:normal;word-break:break-word}
  .empty{padding:18px}
  #toastRoot{bottom:calc(18px + env(safe-area-inset-bottom,0px))}
}
@media (max-width:420px){
  .brand-txt b{font-size:13px}
  .page-head h1{font-size:18px}
}

/* ===== 多用户登录页 ===== */
.login-screen{position:fixed;inset:0;z-index:220;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,var(--bg) 0%,var(--pill) 130%);padding:24px;overflow:auto}
.login-screen[hidden]{display:none}
.login-card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:0 24px 60px rgba(20,40,30,.13);padding:36px 32px 26px;width:100%;max-width:400px}
.login-brand{text-align:center;margin-bottom:20px}
.login-brand .brand-icon{width:52px;height:52px;font-size:24px;border-radius:15px;margin:0 auto 12px}
.login-brand h1{font-size:19px;color:var(--txt)}
.login-brand p{font-size:12px;color:var(--sub);margin-top:4px}
.login-tabs{display:flex;gap:6px;background:var(--pill);border-radius:10px;padding:4px;margin-bottom:18px}
.ltab{flex:1;border:0;background:transparent;color:var(--sub);font-size:13px;padding:8px 0;border-radius:8px;cursor:pointer;transition:.15s}
.ltab.on{background:var(--card);color:var(--acc);font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.login-field{margin-bottom:13px}
.login-field label{display:block;font-size:12px;color:var(--sub);margin-bottom:5px}
.login-field input{width:100%;box-sizing:border-box;padding:10px 12px;font-size:14px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--txt);outline:none;transition:.15s}
.login-field input:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(46,125,91,.12)}
.login-err{color:var(--err);font-size:12px;min-height:18px;margin:2px 0 10px}
.login-btn{width:100%;justify-content:center;padding:11px 0;font-size:14px}
.login-tip{font-size:11px;color:var(--sub);text-align:center;margin-top:13px;line-height:1.7}
.login-note{background:var(--pill);border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:12px;color:var(--txt);margin-bottom:13px;line-height:1.6}
.login-links{text-align:center;margin-top:9px;font-size:12px}
.login-links a{color:var(--acc);cursor:pointer;text-decoration:none;font-weight:500}
.login-links a:hover{text-decoration:underline}
.avatar{cursor:pointer}
.avatar:hover .avatar-circle{filter:brightness(1.08)}
.logout-ico:hover{color:var(--err)}
/* 账户设置面板 */
.acc-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:4px 0 12px;border-bottom:1px solid var(--line);margin-bottom:4px}
.acc-lbl{font-size:12px;color:var(--sub)}
.acc-val{display:flex;gap:8px;align-items:center;font-size:14px}
.acc-sec{font-size:13px;font-weight:600;color:var(--txt);margin:16px 0 9px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.acc-hint{font-size:11px;font-weight:400;color:var(--sub)}
.acc-inline{display:flex;gap:8px;align-items:center}
.acc-inline input{flex:1;box-sizing:border-box;padding:9px 11px;font-size:13px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--txt);outline:none;transition:.15s}
.acc-inline input:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(46,125,91,.12)}
.acc-err{color:var(--err);font-size:12px;min-height:16px;margin-top:6px}
.acc-acts{display:flex;gap:10px;margin-top:4px;flex-wrap:wrap}
/* ===== 稳定性相关：存储告警 / 渲染异常 / 存储占用 / 大表折叠 ===== */
.store-warn{position:fixed;left:50%;top:10px;transform:translateX(-50%);z-index:260;display:flex;align-items:center;gap:10px;max-width:min(880px,94vw);background:var(--err);color:#fff;padding:9px 14px;border-radius:12px;font-size:12.5px;box-shadow:0 10px 28px rgba(0,0,0,.28);line-height:1.5}
.store-warn[hidden]{display:none}
.store-warn .sw-ico{font-size:15px;flex:0 0 auto}
.store-warn #storeWarnTxt{flex:1 1 auto;min-width:0}
.store-warn .btn{background:rgba(255,255,255,.94);color:var(--err);border-color:transparent;flex:0 0 auto}
.store-warn .btn.ghost{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.55)}
.err-box{padding:22px 20px;line-height:1.7}
.err-box b{font-size:15px;color:var(--err)}
.err-box p{margin-top:8px;font-size:13px;color:var(--txt);word-break:break-word}
.err-box .err-hint{color:var(--sub);font-size:12px}
.err-acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.acc-bar{height:7px;border-radius:99px;background:var(--pill);overflow:hidden;margin:9px 0 5px}
.acc-bar span{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .3s}
.acc-bar.warn span{background:var(--warn)}
.acc-bar.danger span{background:var(--err)}
.acc-sub{font-size:11px;color:var(--sub);line-height:1.6}
.more-row td{text-align:center;padding:14px 10px!important;border-bottom:none!important}
.more-row td::before{content:''!important}
@media (max-width:900px){
  .store-warn{top:calc(8px + env(safe-area-inset-top,0px));font-size:12px;flex-wrap:wrap;padding:8px 12px}
  .store-warn #storeWarnTxt{flex:1 1 100%}
}

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><div class="brand-icon">A</div><div class="brand-txt"><b>亚马逊运营工作台</b><span>全链路数据一站管理</span></div></div>

/* ================= 工具函数 ================= */
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = p => p + '_' + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3);
const iso = d => { const x = new Date(d); return x.getFullYear() + '-' + String(x.getMonth()+1).padStart(2,'0') + '-' + String(x.getDate()).padStart(2,'0'); };
const today = () => iso(new Date());
const _usFmt = new Intl.DateTimeFormat('en-CA', { timeZone:'America/Los_Angeles', year:'numeric', month:'2-digit', day:'2-digit' });
let _usKey = '', _usVal = '';
function usToday(){ // 促销活动时间以美国太平洋时间为准；按小时缓存，避免每条记录都构造 Intl 对象（数据多时极慢）
  const d = new Date();
  const k = d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate() + '-' + d.getHours();
  if(k !== _usKey){ _usKey = k; _usVal = _usFmt.format(d); }
  return _usVal;
}
const nowDT = () => { const d = new Date(); return iso(d) + 'T' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0'); };
const fmtDT = s => String(s || '').replace('T', ' ');
const dayDiff = (a, b) => Math.round((new Date(a) - new Date(b)) / 86400000);
const num = v => { const n = parseFloat(String(v == null ? '' : v).replace(/[,\s¥$%]/g, '')); return isNaN(n) ? 0 : n; };
function toast(msg, type){ const t = document.createElement('div'); t.className = 'toast ' + (type || ''); t.textContent = msg; document.getElementById('toastRoot').appendChild(t); setTimeout(() => t.remove(), 2600); }
const jsq = s => String(s == null ? '' : s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'&quot;'); // onclick 内联参数安全转义
function copyText(btn){
  const txt = btn.dataset.t || '';
  const done = () => toast('已复制到剪贴板', 'ok');
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done).catch(() => fallbackCopy(txt, done));
  } else fallbackCopy(txt, done);
}
function fallbackCopy(txt, done){
  const ta = document.createElement('textarea');
  ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); done(); }catch(e){ toast('复制失败，请手动复制', 'err'); }
  ta.remove();
}
function weekKey(d){ const date = new Date(d); const day = (date.getDay()+6)%7; const th = new Date(date); th.setDate(date.getDate()-day+3); const y = th.getFullYear(); const w = Math.ceil(((th - new Date(y,0,1))/86400000 + 1) / 7); return y + '-W' + w; }
function weekRange(d){ const date = new Date(d); const day = (date.getDay()+6)%7; const ws = new Date(date); ws.setDate(date.getDate()-day); const we = new Date(ws); we.setDate(ws.getDate()+6); return [iso(ws), iso(we)]; }
/* 周日 ~ 周六 的送达时段工具（预计送达时段以周日至下周六为一时段） */
function sunWeek(d){ const date = new Date(d); const day = date.getDay(); const ws = new Date(date); ws.setDate(date.getDate()-day); const we = new Date(ws); we.setDate(ws.getDate()+6); return [iso(ws), iso(we)]; }
function nextSunWeek(){ const t = new Date(); const day = t.getDay(); const off = day === 0 ? 7 : 7 - day; const ws = new Date(t); ws.setDate(t.getDate()+off); const we = new Date(ws); we.setDate(ws.getDate()+6); return [iso(ws), iso(we)]; }
function winFmt(s){
  const f = (str, full) => { if(!str) return ''; const d = new Date(str); if(isNaN(d)) return str;
    const md = (d.getMonth()+1) + '月' + d.getDate() + '日'; return full ? d.getFullYear() + '年' + md : md; };
  if(s.winStart && s.winEnd) return f(s.winStart, false) + ' - ' + f(s.winEnd, true);
  return f(s.winStart || s.winEnd, true);
}
function matchQ(q, ...fields){ if(!q) return true; const qq = q.trim().toLowerCase(); return fields.some(f => String(f || '').toLowerCase().includes(qq)); }

const USERS_KEY = 'amz_users_v1';

function hashPwd(pw, salt){ // 盐化迭代散列（本地工具级防护，非加密强度）
  const s = salt + '::' + pw;
  let h1 = 0x811c9dc5, h2 = 0x9e3779b9;
  for(let r = 0; r < 96; r++){
    for(let i = 0; i < s.length; i++){
      h1 = (h1 ^ s.charCodeAt(i)) >>> 0; h1 = (h1 * 16777619) >>> 0;
      h2 = (h2 + h1 + r + i) >>> 0; h2 = (h2 ^ (h2 << 13)) >>> 0; h2 = (h2 ^ (h2 >>> 7)) >>> 0;
    }
  }
  return h1.toString(36) + '-' + h2.toString(36) + '-' + s.length.toString(36);
}

/* ================= 数据层（按用户隔离 + 完整性保护） ================= */
const DB_VERSION = 3;
const COLLS = ['products','promotions','sampling','ads','creators','inventory','shipments','factoryOrders','skus'];
/* ---- 回收站：删除的数据先保留 3 天，可随时恢复；到期自动彻底删除 ---- */
const TRASH_DAYS = 3;
const TRASH_TTL = TRASH_DAYS * 24 * 60 * 60 * 1000;
const TRASH_MAX = 200;          // 最多保留条数（防止长期积累占满本地存储）
const TRASH_BUDGET = 1200000;   // 回收站最多占用的字符数（约 1.2M 字符）
const COLL_LABEL = {
  products:'产品详情', promotions:'促销活动', sampling:'工厂打样情况', ads:'广告数据', creators:'创作者计划',
  inventory:'产品库存情况', shipments:'FBA货件追踪', factoryOrders:'工厂下单', skus:'具体产品情况'
};
const LS_LIMIT = 4500000;           // localStorage 可用字符数保守估算（浏览器上限约 5M）
const BAK_TTL = 2 * 60 * 60 * 1000; // 自动快照最短间隔：2 小时
let DB = null;
let _dataRev = 0; // 数据版本号：派生索引（如工厂未出货）据此失效重建
const S = { page: 'home', q: {}, user: null };
let saveFailed = false;   // 最近一次写入是否失败（用于顶部告警条）
let lastSavedJSON = '';   // 上次成功写入的内容，用于生成可恢复快照
let lastSaveAt = 0;
function ukey(k){ return 'amz_u_' + S.user + '__' + k; }
function loadUserSettings(){
  const rd = (k, dv) => { try { const v = JSON.parse(localStorage.getItem(ukey(k))); return v || dv; } catch(e){ return dv; } };
  S.remCol = rd('remcol', {});
  S.sort = rd('sort', {});
  S.cols = rd('cols', {});
  S.remOrder = rd('remorder', null);
}
/* ---- 存储读写：配额不足时不静默失败 ---- */
function safeGet(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
function showStoreWarn(msg){
  saveFailed = true;
  const el = document.getElementById('storeWarn');
  const tx = document.getElementById('storeWarnTxt');
  if(tx) tx.textContent = msg || '数据保存失败：浏览器本地存储空间已满，最新修改可能丢失，请立即导出备份。';
  if(el) el.hidden = false;
}
function hideStoreWarn(){ const el = document.getElementById('storeWarn'); if(el) el.hidden = true; }
function safeSet(k, v){
  try { localStorage.setItem(k, v); saveFailed = false; return true; }
  catch(e){
    try { // 配额不足：先清理自动快照再重试一次
      localStorage.removeItem(ukey('bak'));
      localStorage.removeItem(ukey('bakat'));
      localStorage.setItem(k, v);
      toast('存储空间紧张，已清理自动快照后保存成功', 'ok');
      saveFailed = false; return true;
    } catch(e2){
      showStoreWarn('数据保存失败：本地存储空间已满。请导出备份，并把过大的本地图片改为图片链接。');
      toast('保存失败：本地存储空间已满，请先导出备份', 'err');
      return false;
    }
  }
}
function usageChars(){
  let n = 0;
  try {
    for(let i = 0; i < localStorage.length; i++){
      const k = localStorage.key(i) || '';
      if(k.indexOf('amz_') !== 0) continue;
      n += k.length + String(localStorage.getItem(k) || '').length;
    }
  } catch(e){}
  return n;
}
function storagePct(){ return Math.min(100, Math.round(usageChars() / LS_LIMIT * 100)); }
/* ---- 自动快照（可恢复到最近一次状态） ---- */
function readSnapshot(){
  try { const o = JSON.parse(safeGet(ukey('bak')) || 'null'); return o && o.json ? o : null; } catch(e){ return null; }
}
/* 快照时间戳单独存一个小键：避免每次保存都解析上兆字节的快照 JSON（长期使用后编辑会明显变卡） */
function snapshotAt(){ const v = Number(safeGet(ukey('bakat')) || 0); return isFinite(v) ? v : 0; }
function snapshot(tag, force){
  try {
    if(!DB || !lastSavedJSON) return false;
    if(!force && Date.now() - snapshotAt() < BAK_TTL) return false;
    if(lastSavedJSON.length > 1200000) return false;                    // 快照过大，跳过以免占满配额
    if(usageChars() + lastSavedJSON.length > LS_LIMIT * 0.82) return false;
    const at = Date.now();
    if(!safeSet(ukey('bak'), JSON.stringify({ at, tag: tag || 'auto', json: lastSavedJSON }))) return false;
    try { localStorage.setItem(ukey('bakat'), String(at)); } catch(e){}
    return true;
  } catch(e){ return false; }
}
/* ---- 结构规范化：任何缺失字段都不会导致渲染崩溃 ---- */
function normalizeDB(db){
  if(!db || typeof db !== 'object' || Array.isArray(db)) db = {};
  COLLS.forEach(k => { if(!Array.isArray(db[k])) db[k] = []; });
  const clean = arr => arr.filter(x => x && typeof x === 'object' && !Array.isArray(x));
  db.products = clean(db.products).map(p => {
    p.id = p.id || uid('p');
    p.createdAt = p.createdAt || nowDT();
    p.colors = Array.isArray(p.colors) ? clean(p.colors) : [];
    p.colors.forEach(c => {
      if(c.fabric == null) c.fabric = p.fabric || ''; // 旧数据：产品级面料下沉到颜色
      c.name = c.name || ''; c.img = c.img || '';
    });
    p.adjustments = Array.isArray(p.adjustments) ? clean(p.adjustments) : [];
    p.spec = (p.spec && typeof p.spec === 'object') ? p.spec : {};
    p.done = (p.done && typeof p.done === 'object') ? p.done : {};
    return p;
  });
  ['promotions','sampling','ads','creators','inventory','shipments','factoryOrders','skus'].forEach(k => {
    db[k] = clean(db[k]).map(r => {
      r.id = r.id || uid(k.slice(0, 2));
      r.createdAt = r.createdAt || nowDT();
      if(k === 'ads'){
        r.keywords = Array.isArray(r.keywords) ? r.keywords : [];
        r.hots = Array.isArray(r.hots) ? r.hots : [];
      }
      if(k === 'sampling') r.adjustments = Array.isArray(r.adjustments) ? clean(r.adjustments) : [];
      if(k === 'creators') r.weeksDone = (r.weeksDone && typeof r.weeksDone === 'object') ? r.weeksDone : {};
      if(k === 'shipments' && r.winDone && typeof r.winDone !== 'object') r.winDone = {};
      return r;
    });
  });
  // 回收站：结构规范化，任何异常条目都不会导致渲染或恢复崩溃
  db.trash = Array.isArray(db.trash) ? db.trash.filter(t => t && typeof t === 'object' && !Array.isArray(t)).map(t => {
    const it = {
      tid: String(t.tid || uid('tr')),
      kind: t.kind === 'term' ? 'term' : 'rec',
      coll: COLL_LABEL[t.coll] ? t.coll : 'products',
      at: Number(t.at) || 0,
      label: String(t.label || ''),
      size: Number(t.size) || 0
    };
    if(it.kind === 'term'){
      it.rid = String(t.rid || '');
      it.field = t.field === 'hots' ? 'hots' : 'keywords';
      it.idx = Math.max(0, Number(t.idx) || 0);
      it.val = String(t.val || '');
    } else {
      it.rec = (t.rec && typeof t.rec === 'object' && !Array.isArray(t.rec)) ? t.rec : null;
    }
    return it;
  }).filter(t => t.kind === 'term' || t.rec) : [];
  db.__v = DB_VERSION;
  return db;
}
function saveRemCol(){ safeSet(ukey('remcol'), JSON.stringify(S.remCol)); }
function toggleRemCard(key){ S.remCol[key] = !S.remCol[key]; saveRemCol(); render(); }
function saveSort(){ safeSet(ukey('sort'), JSON.stringify(S.sort)); }

function saveDB(force){
  if(!DB) return false;
  _dataRev++;
  let json;
  try { json = JSON.stringify(DB); }
  catch(e){ showStoreWarn('数据序列化失败：' + e.message + '，请立即导出备份'); return false; }
  if(!force && json === lastSavedJSON && !saveFailed) return true; // 内容未变化则不重复写入（避免多标签页互相触发写循环）
  try { snapshot('auto'); } catch(e){}
  const ok = safeSet(ukey('workbench'), json);
  if(ok){ lastSavedJSON = json; lastSaveAt = Date.now(); }
  return ok;
}
function loadDB(opts){
  opts = opts || {};
  const raw = safeGet(ukey('workbench'));
  let parsed = null, corrupt = false;
  if(raw){
    try { parsed = JSON.parse(raw); } catch(e){ corrupt = true; }
    if(!corrupt && (!parsed || typeof parsed !== 'object' || Array.isArray(parsed) || !Array.isArray(parsed.products))) corrupt = true;
  }
  if(corrupt){
    // 原始内容留档（截断保存，避免二次撑爆配额），优先从自动快照恢复
    try { localStorage.setItem(ukey('corrupt'), String(raw).slice(0, 200000)); } catch(e){}
    const bak = readSnapshot();
    if(bak && bak.json){ try { parsed = JSON.parse(bak.json); } catch(e){ parsed = null; } }
    toast(parsed ? '检测到数据异常，已自动从最近快照恢复' : '检测到数据异常，已重置为示例数据（原始内容已留档）', 'err');
  }
  DB = normalizeDB(parsed || seedDB());
  purgeTrash(true); // 打开工作台即清理超过 3 天的回收站记录
  _dataRev++;
  const norm = JSON.stringify(DB);
  const dirty = !parsed || corrupt || norm !== raw;
  lastSavedJSON = norm;
  // 首次写入 / 损坏恢复 / 规范化补齐过字段时持久化；其他标签页触发的同步只读不写，避免互相写回环
  if(dirty && opts.persist !== false) saveDB(true);
}

/* ================= 回收站（删除保留 3 天，到期彻底删除） ================= */
function fmtStamp(ts){
  const d = new Date(Number(ts) || 0);
  if(isNaN(d.getTime()) || !d.getTime()) return '—';
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
/* 剩余可恢复时长文案 */
function trashLeft(at){
  const ms = (Number(at) || 0) + TRASH_TTL - Date.now();
  if(ms <= 0) return '已到期';
  const h = Math.floor(ms / 3600000), d = Math.floor(h / 24);
  if(d >= 1) return d + ' 天 ' + (h % 24) + ' 小时';
  const m = Math.floor((ms % 3600000) / 60000);
  return (h > 0 ? h + ' 小时 ' : '') + m + ' 分钟';
}
/* 一条删除记录的可读摘要（写入时固化，避免后续字段调整导致旧记录显示为空） */
function trashSummary(coll, r){
  r = r || {};
  const j = (arr) => [].concat(arr).filter(Boolean).join(' · ');
  switch(coll){
    case 'products':      return j([r.sku, r.type, r.shop]) || '未命名产品';
    case 'promotions':    return j([r.type, r.parent, r.content]);
    case 'sampling':      return j([r.sku, r.childAsin || r.msku, r.doneAt ? '已完成打样' : '开发中']);
    case 'ads':           return j([r.sku || r.parent, ((r.keywords||[]).length + ' 个出单词'), ((r.hots||[]).length + ' 个热门词')]);
    case 'creators':      return j([r.title, r.sku || r.parent, r.commission]);
    case 'inventory':     return j([r.sku, r.color, 'FBA ' + num(r.fbaTotal)]);
    case 'shipments':     return j([r.name || r.shipmentId, r.warehouse, r.method]);
    case 'factoryOrders': return j([r.sku, r.color, num(r.qty) + ' 双', r.place]);
    case 'skus':          return j([r.childAsin || r.msku, r.sku, r.shop]);
  }
  return '';
}
/* 到期清理：返回本次彻底删除的条数 */
function purgeTrash(silent){
  if(!DB || !Array.isArray(DB.trash) || !DB.trash.length) return 0;
  const now = Date.now();
  const kept = DB.trash.filter(t => t && (now - (Number(t.at) || 0)) < TRASH_TTL);
  const n = DB.trash.length - kept.length;
  if(n){ DB.trash = kept; if(!silent) toast('已彻底删除 ' + n + ' 条超过 ' + TRASH_DAYS + ' 天的回收站记录', 'ok'); }
  return n;
}
/* 超量时从最旧的开始丢弃，保证回收站不会挤爆本地存储 */
function trimTrash(){
  let total = DB.trash.reduce((s, t) => s + (Number(t.size) || 0), 0);
  while(DB.trash.length > 1 && (total > TRASH_BUDGET || DB.trash.length > TRASH_MAX)){
    const last = DB.trash[DB.trash.length - 1];
    total -= (Number(last.size) || 0);
    DB.trash.pop();
  }
}
function trashPush(item){
  DB.trash = Array.isArray(DB.trash) ? DB.trash : [];
  let size = 0;
  try { const s = JSON.stringify(item.rec || item.val || ''); size = s ? s.length : 1; } catch(e){ size = 0; }
  DB.trash.unshift(Object.assign({ tid: uid('tr'), at: Date.now(), size }, item, { size }));
  purgeTrash(true);
  trimTrash();
}
/* 删除一条业务记录 → 移入回收站（9 个业务模块统一入口） */
function moveToTrash(coll, id){
  const arr = DB && DB[coll];
  if(!Array.isArray(arr)) return false;
  const rec = arr.find(x => x && x.id === id);
  if(!rec) return false;
  let copy;
  try { copy = JSON.parse(JSON.stringify(rec)); } catch(e){ copy = Object.assign({}, rec); }
  DB[coll] = arr.filter(x => x.id !== id);
  let label = '';
  try { label = trashSummary(coll, copy); } catch(e){ label = ''; }
  trashPush({ kind:'rec', coll, label: label || '（无摘要）', rec: copy });
  invalidateIdx();
  return true;
}
/* 广告出单词 / 热门搜索词删除 → 也进回收站（可恢复回原位置） */
function moveTermToTrash(id, key, i){
  const r = (DB.ads || []).find(x => x && x.id === id);
  if(!r || !Array.isArray(r[key]) || i < 0 || i >= r[key].length) return false;
  const val = r[key][i];
  r[key].splice(i, 1);
  trashPush({ kind:'term', coll:'ads', rid:id, field:key, idx:i, val, label:'广告' + (key === 'hots' ? '热门搜索词' : '出单词') + '：' + val });
  return true;
}
function restoreTrash(tid){
  const list = Array.isArray(DB && DB.trash) ? DB.trash : [];
  const t = list.find(x => x && x.tid === tid);
  if(!t) return;
  if(Date.now() - (Number(t.at) || 0) >= TRASH_TTL){
    purgeTrash(true); saveDB(); render();
    toast('该记录已超过 ' + TRASH_DAYS + ' 天保留期，已彻底删除', 'err'); return;
  }
  if(t.kind === 'term'){
    const r = (DB.ads || []).find(x => x && x.id === t.rid);
    if(!r){ toast('原广告数据已被删除，该关键词无法单独恢复', 'err'); return; }
    r[t.field] = Array.isArray(r[t.field]) ? r[t.field] : [];
    r[t.field].splice(Math.min(t.idx, r[t.field].length), 0, t.val);
  } else {
    const arr = DB[t.coll];
    if(!Array.isArray(arr)){ toast('目标模块不存在，无法恢复', 'err'); return; }
    const rec = t.rec;
    if(arr.some(x => x && x.id === rec.id)) rec.id = uid(String(t.coll).slice(0, 2)); // 同 ID 已存在时换新 ID，避免互相覆盖
    arr.unshift(rec);
  }
  DB.trash = list.filter(x => x.tid !== tid);
  invalidateIdx();
  saveDB();
  toast('已恢复到「' + (COLL_LABEL[t.coll] || '原模块') + '」', 'ok');
  render();
}
function trashDel(tid){
  const t = (DB.trash || []).find(x => x.tid === tid); if(!t) return;
  confirmModal('彻底删除后无法恢复，确定立即删除「' + (t.label || '该记录') + '」吗？', () => {
    DB.trash = (DB.trash || []).filter(x => x.tid !== tid);
    saveDB(); toast('已彻底删除', 'ok'); render();

}
function trashClear(){
  const n = (DB.trash || []).length;
  if(!n){ toast('回收站已经是空的', 'ok'); return; }
  confirmModal('确定清空回收站？\n共 ' + n + ' 条记录将被立即彻底删除，且无法恢复。', () => {

}

/* 产品查找索引：库存/货件/SKU 页会按货号反复查找产品，线性查找在数据量大时是平方级开销 */
let _idx = null, _idxRev = -1;
function dataIdx(){
  if(_idx && _idxRev === _dataRev) return _idx;
  const bySku = new Map(), byParent = new Map();
  ((DB && DB.products) || []).forEach(p => {
    if(!p) return;
    if(p.sku) bySku.set(p.sku, p);
    if(p.parent && !byParent.has(p.parent)) byParent.set(p.parent, p);
  });
  _idx = { bySku, byParent }; _idxRev = _dataRev;
  return _idx;
}
function invalidateIdx(){ _idx = null; _facIdx = null; }
function findProduct(sku){ const i = dataIdx(); return (sku && i.bySku.get(sku)) || null; }
function productImg(sku, color){
  const p = findProduct(sku); if(!p) return '';
  const cs = p.colors || [];
  let c = color ? cs.find(x => x.name === color) : null;
  c = c || cs[0];
  return c ? (c.img || '') : '';
}
function parentImg(parent, skuHint){
  if(skuHint){ const im = productImg(skuHint); if(im) return im; }
  const p = dataIdx().byParent.get(parent);
  const cs = (p && p.colors) || [];
  return cs[0] ? (cs[0].img || '') : '';
}
function typeOfSku(sku){ const p = findProduct(sku); return p ? p.type : ''; }
/* 工厂未出货数量：先建索引再查，避免库存页逐行扫描全部工厂订单（数据量增长后是平方级开销） */
let _facIdx = null, _facIdxRev = -1;
function factoryIdx(){
  if(_facIdx && _facIdxRev === _dataRev) return _facIdx;
  const byKey = new Map(), bySku = new Map();
  (DB.factoryOrders || []).forEach(o => {
    if(o.shippedAt) return;
    const q = num(o.qty), sku = o.sku || '', k = sku + '|' + (o.color || '');
    byKey.set(k, (byKey.get(k) || 0) + q);
    bySku.set(sku, (bySku.get(sku) || 0) + q);
  });
  _facIdx = { byKey, bySku }; _facIdxRev = _dataRev;
  return _facIdx;
}
function factoryUnshipped(sku, color){
  try {
    const idx = factoryIdx();
    return color ? (idx.byKey.get(sku + '|' + color) || 0) : (idx.bySku.get(sku) || 0);
  } catch(e){
    return (DB.factoryOrders || []).filter(o => o.sku === sku && (!color || o.color === color) && !o.shippedAt)
      .reduce((s, o) => s + num(o.qty), 0);
  }
}

  ['promotions','ads','sampling','creators','inventory','shipments','factoryOrders','skus'].forEach(k => {

  });
}
function propagateSkuRename(oldSku, newSku){
  ['promotions','ads','sampling','creators','inventory','shipments','factoryOrders','skus'].forEach(k => {

}

/* 表格增强：应用用户自定义列顺序 + 注入 data-label（手机端卡片字段名）+ 挂载点击排序与列拖拽 */
function enhanceTables(){
  const mobile = window.matchMedia ? window.matchMedia('(max-width: 900px)').matches : window.innerWidth <= 900;
  document.querySelectorAll('table.tbl').forEach(tb => {
    if(tb.closest && tb.closest('.overlay, #modalRoot')) return; // 弹窗内明细表不参与
    const headRow = tb.querySelector('thead tr');
    if(!headRow) return;
    const ths = [...headRow.children].filter(x => x.tagName === 'TH');
    if(!ths.length) return;
    // 原始列名单独记录：排序箭头写在 innerHTML 里，不能反过来污染列标签
    ths.forEach(th => { if(!th.dataset.origLbl) th.dataset.origLbl = th.textContent.trim(); });
    const orig = ths.map(th => th.dataset.origLbl); // 本次渲染的默认列顺序（冻结为基准）
    let labels = orig;
    const order = S.cols[S.page];
    if(order && order.length){
      // 应用用户拖拽的列顺序；新增列自动追加到末尾，已删除列自动忽略
      labels = order.filter(l => orig.includes(l)).concat(orig.filter(l => !order.includes(l)));
      const map = labels.map(l => orig.indexOf(l));
      const hc = [...headRow.children];
      map.forEach(oi => headRow.appendChild(hc[oi])); // 按新顺序重排表头
      const tbody0 = tb.querySelector('tbody');
      if(tbody0){
        for(let i = 0; i < tbody0.rows.length; i++){
          const tr = tbody0.rows[i];
          if(tr.cells.length !== orig.length) continue; // 汇总/空行跳过
          const cs = [...tr.cells];
          map.forEach(oi => tr.appendChild(cs[oi])); // 单元格同步重排
        }
      }
    }
    const thNow = [...headRow.children].filter(x => x.tagName === 'TH');
    thNow.forEach((th, ci) => {
      th.dataset.lbl = labels[ci];
      if(labels[ci] === '操作'){ th.removeAttribute('draggable'); th.onclick = null; return; } // 操作列固定不参与
      th.classList.add('sortable');
      th.title = '点击：按该字段排序（升 → 降 → 取消）；拖动：调整该列前后位置';
      th.setAttribute('draggable', 'true');
      th.onclick = () => { if(colJustDropped){ colJustDropped = false; return; } sortTableClick(S.page, ci); };
      th.ondragstart = e => colDragStart(e, labels[ci]);
      th.ondragover = e => colDragOver(e, th);
      th.ondragleave = () => { th.classList.remove('drop-before', 'drop-after'); };
      th.ondrop = e => colDrop(e, th);
    });
    // 移动端卡片布局才需要字段名标签；桌面端跳过，可省去整表数万次属性写入
    const tbody = tb.querySelector('tbody');
    if(tbody && mobile){
      for(let i = 0; i < tbody.rows.length; i++){
        const tr = tbody.rows[i];
        if(tr.cells.length !== labels.length) continue;
        for(let c = 0; c < tr.cells.length; c++){
          const td = tr.cells[c];
          if(td.tagName === 'TD' && labels[c]) td.dataset.label = labels[c];
        }
      }
    }
    const st = S.sort[S.page];
    if(st && thNow[st.col] && labels[st.col] !== '操作'){ markSortTh(tb, st); applyTableSort(tb, st.col, st.dir); }
  });
}
/* ===== 列拖拽（所有业务模块通用）===== */
let dragColFrom = null, colJustDropped = false;
function colDragStart(e, lbl){
  dragColFrom = lbl;
  e.dataTransfer.effectAllowed = 'move';
  try{ e.dataTransfer.setData('text/plain', lbl); }catch(err){}
}
function colDragOver(e, th){
  if(!dragColFrom || !th || th.dataset.lbl === '操作' || th.dataset.lbl === dragColFrom) return;
  e.preventDefault(); e.dataTransfer.dropEffect = 'move';
  const r = th.getBoundingClientRect();
  th.classList.toggle('drop-before', (e.clientX - r.left) <= r.width / 2);
  th.classList.toggle('drop-after', (e.clientX - r.left) > r.width / 2);
}
function colDrop(e, th){
  e.preventDefault();
  th.classList.remove('drop-before', 'drop-after');
  const from = dragColFrom; dragColFrom = null;
  if(!from || !th || th.dataset.lbl === from || th.dataset.lbl === '操作') return;
  const tb = th.closest('table');
  const labels = [...tb.querySelectorAll('thead th')].map(t => t.dataset.lbl);
  const r = th.getBoundingClientRect();
  const after = (e.clientX - r.left) > r.width / 2; // 落点在目标列左半：插到其前；右半：插到其后
  const next = colReorder(labels, from, th.dataset.lbl, after);
  if(!next) return;
  S.cols[S.page] = next;
  delete S.sort[S.page]; saveSort(); // 列序变化后旧排序索引失效，清除
  saveCols();
  colJustDropped = true; // 防止部分浏览器拖放后再触发一次点击排序
  setTimeout(() => { colJustDropped = false; }, 300);
  render();
}
function colReorder(labels, from, to, after){
  if(from === to) return null;
  const arr = labels.slice();
  const fi = arr.indexOf(from);
  if(fi < 0) return null; // 源不存在（列已删除），不处理
  arr.splice(fi, 1);
  const ti = arr.indexOf(to);
  if(ti < 0) return null;
  arr.splice(after ? ti + 1 : ti, 0, from);
  return arr;
}
/* 排序三态切换：升 → 降 → 取消（取消后恢复模块默认排序） */
function sortTableClick(key, ci){
  const st = S.sort[key];
  if(st && st.col === ci){
    if(st.dir === 1) S.sort[key] = { col: ci, dir: -1 };
    else { delete S.sort[key]; saveSort(); render(); return; }
  } else S.sort[key] = { col: ci, dir: 1 };
  saveSort(); render();
}
function markSortTh(tb, st){
  [...tb.querySelectorAll('thead th')].forEach((th, i) => {
    th.innerHTML = th.dataset.lbl + (i === st.col ? `<span class="sort-ar">${st.dir === 1 ? '↑' : '↓'}</span>` : '');
  });
}
/* 基于单元格文本的数值感知排序，空值恒排最后 */
function applyTableSort(tb, col, dir){
  const tbody = tb.querySelector('tbody'); if(!tbody) return;
  const ths = tb.querySelectorAll('thead th').length;
  const rows = [];
  for(let i = 0; i < tbody.rows.length; i++){
    const tr = tbody.rows[i];
    if(tr.cells.length === ths) rows.push(tr);
  }
  if(rows.length < 2) return;
  const coll = new Intl.Collator('zh', { numeric: true, sensitivity: 'base' });
  const val = tr => { const c = tr.cells[col]; return c ? (c.textContent || '').trim() : ''; };
  rows.sort((a, b) => {
    const va = val(a), vb = val(b);
    if(!va && !vb) return 0;
    if(!va) return 1; if(!vb) return -1;
    return dir * coll.compare(va, vb);
  }).forEach(r => tbody.appendChild(r));
}

/* ================= 图片字段：链接 / 本地文件上传 ================= */
const IMG_STATE = {}; // key -> { mode:'url'|'local', url, data, name, ids }
const isDataImg = v => /^data:image\//i.test(String(v || ''));
function imgReg(key, val, ids){
  IMG_STATE[key] = {
    mode: isDataImg(val) ? 'local' : 'url',
    url: isDataImg(val) ? '' : (val || ''),
    data: isDataImg(val) ? val : '',
    name: isDataImg(val) ? '已上传本地图片' : '',
    ids: ids || {}
  };
  return IMG_STATE[key];
}
function imgVal(key){
  const st = IMG_STATE[key];
  if(!st) return '';
  return st.mode === 'local' ? (st.data || '') : (st.url || '');
}
function syncImg(key){
  const st = IMG_STATE[key]; if(!st) return;
  const v = imgVal(key);
  const $ = id => id ? document.getElementById(id) : null;
  const hid = $(st.ids.val); if(hid) hid.value = v;
  const pv = $(st.ids.prev);
  if(pv){
    if(v){ pv.style.backgroundImage = "url('" + v + "')"; if(pv.classList) pv.classList.remove('empty'); pv.textContent = ''; }
    else { pv.style.backgroundImage = ''; if(pv.classList) pv.classList.add('empty'); pv.textContent = '🖼'; }
  }
  const ui = $(st.ids.url); if(ui) ui.hidden = st.mode !== 'url';
  const lc = $(st.ids.local); if(lc) lc.hidden = st.mode !== 'local';
  const tb = $(st.ids.tabUrl), tl = $(st.ids.tabLocal);
  if(tb && tb.classList) tb.classList.toggle('on', st.mode === 'url');
  if(tl && tl.classList) tl.classList.toggle('on', st.mode === 'local');
  const tg = $(st.ids.tag); if(tg) tg.textContent = st.mode === 'local' ? '本地图片' : (st.url ? '链接图片' : '未设置');
  const fn = $(st.ids.file); if(fn) fn.textContent = st.name || '支持 JPG / PNG / WebP，自动压缩';
  const pk = $(st.ids.pick); if(pk) pk.textContent = st.name ? '重新选择' : '选择本地图片';
}
/* 通用图片字段：图片链接输入 + 本地上传，隐藏域承载最终值 */
function imgf(key, label, val, opts){
  opts = opts || {};
  const st = imgReg(key, val, { prev:'imgfPrev_'+key, val:'imgfVal_'+key, url:'imgfUrl_'+key,
    local:'imgfLocal_'+key, tabUrl:'imgfTabU_'+key, tabLocal:'imgfTabL_'+key, file:'imgfFile_'+key, pick:'imgfPick_'+key });

    <div class="imgf-prev ${val ? '' : 'empty'}" id="imgfPrev_${key}" ${val ? `style="background-image:url('${esc(val)}')"` : ''}>${val ? '' : '🖼'}</div>
    <div class="imgf-main">

      <div class="imgf-tabs">
        <button type="button" class="itab ${st.mode === 'url' ? 'on' : ''}" id="imgfTabU_${key}" onclick="imgfMode('${key}','url')">图片链接</button>
        <button type="button" class="itab ${st.mode === 'local' ? 'on' : ''}" id="imgfTabL_${key}" onclick="imgfMode('${key}','local')">本地图片</button>
      </div>

      <div class="imgf-local" id="imgfLocal_${key}" ${st.mode === 'local' ? '' : 'hidden'}>
        <button type="button" class="btn ghost sm" id="imgfPick_${key}" onclick="pickImage('${key}')">${st.name ? '重新选择' : '选择本地图片'}</button>
        <span class="imgf-file" id="imgfFile_${key}">${esc(st.name || '支持 JPG / PNG / WebP，自动压缩')}</span>
      </div>
      <input type="hidden" ${opts.name ? `name="${esc(opts.name)}"` : ''} id="imgfVal_${key}" value="${esc(val)}">

function imgfMode(key, mode){
  const st = IMG_STATE[key]; if(!st) return;
  st.mode = mode; syncImg(key);
  if(mode === 'url'){ const i = document.getElementById('imgfUrl_' + key); if(i && i.focus) i.focus(); }
}
function imgfUrlInput(key, el){

function peImgUrl(i, el){

/* 文件选择与压缩 */
let imgPickKey = null;
function pickImage(key){
  imgPickKey = key;
  const inp = document.getElementById('imgFileInput');
  if(!inp) return;
  try { inp.value = ''; } catch(e){}
  inp.click();

function onImgFilePicked(input){
  const f = input.files && input.files[0];
  const key = imgPickKey;
  if(!f || !key) return;
  if(!/^image\//.test(f.type || '')){ toast('请选择图片文件（JPG / PNG / WebP）', 'err'); return; }
  if(f.size > 15 * 1024 * 1024){ toast('图片超过 15MB，请先压缩后再上传', 'err'); return; }
  const fr = new FileReader();
  fr.onload = () => {
    compressImage(fr.result, 640, 0.82, dataUrl => {
      const st = IMG_STATE[key]; if(!st) return;
      const str = String(dataUrl || '');
      const kb = Math.max(1, Math.round(str.length / 1024));
      // 硬性上限：单图过大既拖慢渲染也会撑爆本地存储
      if(str.length > 500 * 1024){ toast('图片压缩后仍约 ' + kb + 'KB，超过 500KB 上限，请改用图片链接', 'err'); return; }
      // 图片总量预算：本地存储上限约 5M，图片应留出足够空间给业务数据
      if(imgUsageChars() + str.length > 1250000){ toast('本地图片总量已接近上限（约 1200K），请改用图片链接，或在账户设置里归档清理历史数据', 'err'); return; }
      if(usageChars() + str.length > LS_LIMIT * 0.9){ toast('本地存储空间不足，无法保存该图片，请改用图片链接', 'err'); return; }
      st.mode = 'local'; st.data = str; st.name = f.name + '（约 ' + kb + 'KB）';
      syncImg(key);
      toast('图片已上传（约 ' + kb + 'KB），保存后生效', 'ok');
      if(kb > 350) toast('图片偏大，建议改用图片链接以节省本地存储', 'err');
    });
  };
  fr.onerror = () => toast('图片读取失败，请重试', 'err');
  fr.readAsDataURL(f);
}
function compressImage(src, maxSide, quality, cb){
  try {
    const im = new Image();
    im.onload = () => {
      try {
        let w = im.width, h = im.height;
        const sc = Math.min(1, maxSide / Math.max(w, h));
        w = Math.max(1, Math.round(w * sc)); h = Math.max(1, Math.round(h * sc));
        const cv = document.createElement('canvas');
        cv.width = w; cv.height = h;
        cv.getContext('2d').drawImage(im, 0, 0, w, h);
        cb(cv.toDataURL('image/jpeg', quality));
      } catch(e){ cb(src); }
    };
    im.onerror = () => cb(src);
    im.src = src;
  } catch(e){ cb(src); }
}

/* ================= 1. 首页：智能提醒中心 ================= */
const DONE_KEYS = [['mainImage','产品主图'],['ap','产品A+'],['video','产品视频'],['influencer','网红视频'],['review','直评'],['vine','VINE']];
const FLASH_TYPES = ['秒杀','Z划算']; // 开始前2天提醒的活动类型
function promoPhase(p){
  const t = usToday(); // 促销活动时间以美国时间（太平洋时区）为准
  const flash = FLASH_TYPES.includes(p.type);
  if(!p.start || !p.end) return null;
  if(t > p.end) return !flash && dayDiff(t, p.end) <= 1 ? { tag:'err', label:'已结束', remind:true } : null;
  if(t >= p.start){
    if(!flash && dayDiff(p.end, t) <= 2) return { tag:'warn', label:'即将结束', remind:true };
    return { tag:'info', label:'进行中', remind:false };
  }
  if(flash){
    const dd = dayDiff(p.start, t);
    if(dd <= 2) return { tag:'warn', label: dd === 0 ? '今日开始' : '即将开始', remind:true };
  }
  return { tag:'gray', label:'未开始', remind:false };
}
function calcReminders(){
  const t = today();
  const r = { promo:[], incomplete:[], creatorShops:{}, arrive:[], overdue:[], winNext:[], factory:[], sampling:[] };
  (DB.promotions || []).forEach(p => {
    const ph = promoPhase(p);
    if(ph && ph.remind) r.promo.push({ p, ph });
  });
  (DB.products || []).forEach(p => {
    const done = p.done || {};
    const miss = DONE_KEYS.filter(([k]) => !done[k]).map(([,n]) => n);
    if(miss.length) r.incomplete.push({ p, miss });
  });
  const [ws, we] = weekRange(new Date()); const wk = weekKey(new Date());
  (DB.creators || []).forEach(c => {
    if(c.weeksDone && c.weeksDone[wk]) return;
    if(c.start && c.end && c.start <= we && c.end >= ws){
      const key = c.shop || '未填店铺';
      (r.creatorShops[key] = r.creatorShops[key] || []).push(c); // 以店铺为维度汇总
    }
  });
  (DB.shipments || []).forEach(s => {
    if(s.delivered || !s.arrive) return;
    const dd = dayDiff(s.arrive, t);
    if(dd >= 0 && dd <= 3) r.arrive.push({ s, label: dd === 0 ? '今日到港' : dd + '天后到港', cls:'warn' });
    else if(s.arrive < t) r.overdue.push(s); // 到港未送达，独立提醒
  });
  /* 送达时段在下周且未填写送达日期 → 每日提醒（时段以周日至下周六为一周）；
     「标记本周完成」后当周不再提醒（winDone 按周记录，跨周未填写会重新提醒） */
  const [nws, nwe] = nextSunWeek();
  const wkNow = weekKey(new Date());
  DB.shipments = DB.shipments || [];
  DB.shipments.forEach(s => {
    if(s.delivered || !s.winStart) return;
    if(s.winDone && s.winDone[wkNow]) return; // 本周已标记完成，不再提醒
    if(s.winStart >= nws && s.winStart <= nwe) r.winNext.push({ s, winLabel: winFmt(s) });
  });
  (DB.factoryOrders || []).forEach(o => { if(!o.shippedAt) r.factory.push(o); });
  /* 新开发样鞋：未填写完成时间 → 每日提醒，按开发时间正序 */
  r.sampling = (DB.sampling || []).filter(s => !s.doneAt)
    .sort((a, b) => String(a.createdAt || '').localeCompare(String(b.createdAt || '')));
  return r;
}

/* ===== 首页提醒卡片拖拽换序 ===== */
let dragRemFrom = null;
function remDragStart(e, key){
  dragRemFrom = key;
  e.dataTransfer.effectAllowed = 'move';
  try{
    e.dataTransfer.setData('text/plain', key);
    const cardEl = e.target.closest('.rem-card');
    if(cardEl) e.dataTransfer.setDragImage(cardEl, 20, 20); // 拖动整卡影像
  }catch(err){}
}
function remDragOver(e){
  if(!dragRemFrom) return;
  e.preventDefault(); e.dataTransfer.dropEffect = 'move';
}
function remDrop(e){
  e.preventDefault();
  const from = dragRemFrom; dragRemFrom = null;
  const cardEl = e.target.closest('.rem-card');
  if(!from || !cardEl || cardEl.dataset.remkey === from) return;
  const cur = [...document.querySelectorAll('.rem-card')].map(el => el.dataset.remkey);
  const r = cardEl.getBoundingClientRect();
  const after = (e.clientY - r.top) > r.height / 2; // 上半：插其前；下半：插其后
  S.remOrder = remReorder(cur, from, cardEl.dataset.remkey, after);
  saveRemOrder(); render();
}
function remReorder(keys, from, to, after){
  if(from === to) return keys;
  const arr = keys.slice();
  const fi = arr.indexOf(from);
  if(fi < 0) return keys; // 源不存在，兜底不处理
  arr.splice(fi, 1);
  const ti = arr.indexOf(to);
  if(ti < 0) return arr;
  arr.splice(after ? ti + 1 : ti, 0, from);
  return arr;
}
function markShopWeekDone(shop){
  const wk = weekKey(new Date());
  DB.creators.forEach(c => {
    if(c.shop === shop){ c.weeksDone = c.weeksDone || {}; c.weeksDone[wk] = true; }
  });
  saveDB(); toast(shop + ' 本周已全部标记完成', 'ok'); render();
}
function markWinDone(id){
  const s = DB.shipments.find(x => x.id === id);
  if(!s) return;
  s.winDone = s.winDone || {};
  s.winDone[weekKey(new Date())] = true; // 按周记录，仅当周生效
  saveDB(); toast('货件 ' + (s.shipmentId || s.name || '') + ' 本周已标记完成，跨周未填写将重新提醒', 'ok'); render();
}

  }
  openFormModal({ title, wide:true, body: `<div style="max-height:60vh;overflow:auto">${body}</div>`, onSubmit(){ return true; } });

}

  root.querySelectorAll('.pe-cn').forEach(el => PE.p.colors[+el.dataset.i].name = el.value.trim());
  root.querySelectorAll('.pe-ci').forEach(el => PE.p.colors[+el.dataset.i].img = el.value.trim());

function peAddAdj(){ peSyncDom(); PE.p.adjustments.push({ date: today(), content:'' }); drawProductEditor(); }

function peSave(){

  if(!PE.isNew && PE.oldSku !== p.sku){
    if(findProduct(p.sku)){ toast('该货号已存在', 'err'); return false; }
    propagateSkuRename(PE.oldSku, p.sku);
  }
  p.adjustments = p.adjustments.filter(a => a.date || a.content)
    .sort((a,b) => (b.date||'').localeCompare(a.date||'')); // 日期倒序

const PROMO_TYPES = ['优惠券','会员折扣','秒杀','Z划算','促销码折扣'];
function renderPromotions(c){
  const q = S.q.promotions || '';
  const recs = DB.promotions.filter(r => matchQ(q, r.parent, r.sku, r.shop, r.type, typeOfSku(r.sku)))
    .sort((a,b) => (b.createdAt||'').localeCompare(a.createdAt||''));
  const groups = new Map();
  recs.forEach(r => {
    if(!groups.has(r.parent)) groups.set(r.parent, { shop:r.shop, skus:new Set(), list:[] });
    const g = groups.get(r.parent); g.list.push(r); if(r.sku) g.skus.add(r.sku);
  });
  const groupList = listCap([...groups.entries()]); // 按父体聚合后仍可能很多，同样做截断保护
  const cell = (parent, type) => {
    const items = (groups.get(parent) ? groups.get(parent).list : []).filter(r => r.type === type);
    if(!items.length) return '<span class="tag gray">—</span>';
    return items.map(r => {
      const ph = promoPhase(r);
      return `<div class="act-mini">
        <div>${esc(r.content || '（未填内容）')}</div>
        <div class="am-meta"><span>${esc(r.start||'?')} ~ ${esc(r.end||'?')}</span>
          ${ph ? `<span class="tag ${ph.tag}">${ph.label}</span>` : '<span class="tag gray">未到提醒期</span>'}
          <button class="mini-btn" onclick="promoForm('${r.id}')">编辑</button>
          <button class="mini-btn" onclick="delPromo('${r.id}')">删除</button>
        </div></div>`;
    }).join('');
  };
  c.innerHTML = `
  <div class="card">
    <div class="card-head">
      <div class="head-left"><h2><span class="h2-ico">${ICONS.promotions}</span>促销活动 <span class="count-badge ${recs.length?'':'zero'}">${S.__total.promotions || recs.length}</span></h2>
      ${searchBox('promotions','按父ASIN / 货号 / 店铺 / 产品类型搜索')}</div>
      <div class="toolbar"><button class="btn" onclick="promoForm()">＋ 添加活动</button></div>
    </div>
    <div class="tbl-wrap"><table class="tbl">
      <thead><tr><th>店铺</th><th>父ASIN</th><th>产品图片</th><th>优惠券</th><th>会员折扣</th><th>秒杀</th><th>Z划算</th><th>促销码折扣</th><th>汇总时间</th><th>操作</th></tr></thead>
      <tbody>${ groupList.length ? groupList.map(([parent, g]) => {
        const times = g.list.map(r => [r.start, r.end]).flat().filter(Boolean).sort();
        return `<tr>
          <td>${esc(g.shop)}</td>
          <td style="font-weight:600">${esc(parent)}<div style="font-size:11px;color:var(--sub)">货号：${[...g.skus].map(esc).join('、') || '—'}</div></td>
          <td>${imgCell(parentImg(parent, [...g.skus][0]), parent)}</td>
          ${PROMO_TYPES.map(t => `<td>${cell(parent, t)}</td>`).join('')}
          <td style="font-size:12px">${times.length ? esc(times[0]).slice(0,10) + '<br>~ ' + esc(times[times.length-1]).slice(0,10) : '—'}</td>
          <td><button class="btn ghost sm" onclick="promoForm(null,'${esc(parent)}')">＋活动</button></td>
        </tr>`;
      }).join('') : emptyRow(10,'暂无促销活动，点击右上角「添加活动」新增') }</tbody>
    </table></div>
  </div>`;
}
function promoForm(id, presetParent){
  const r = id ? DB.promotions.find(x => x.id === id) : null;
  openFormModal({
    title: r ? '修改促销活动' : '添加促销活动（同一父体可叠加多个不同类型活动）',
    body: `<div class="form-grid">
      ${F.sel('type','活动类型（请先选择）', PROMO_TYPES, r ? r.type : '')}
      ${F.list('parent','父ASIN','parentList', r ? r.parent : (presetParent||''),'参与父体')}
      ${F.list('sku','货号','skuList', r ? r.sku : '','自动带出店铺等')}
      ${F.text('shop','店铺', r ? r.shop : '')}
      ${F.date('start','活动开始时间', r ? r.start : '')}${F.date('end','活动到期时间', r ? r.end : '')}
      <div class="full">${F.ta('content','活动内容', r ? (r.content||'') : '','如 满$40减$8 / 15% off')}</div>
    </div>`,
    onSubmit(d){
      if(!d.parent){ toast('请填写父ASIN', 'err'); return false; }
      if(!d.start || !d.end){ toast('请填写活动开始/到期时间', 'err'); return false; }
      if(d.end < d.start){ toast('到期时间不能早于开始时间', 'err'); return false; }
      if(r){ Object.assign(r, d); } else { DB.promotions.unshift(Object.assign(newRecord(), d, { id: uid('pr') })); }

      saveDB(); toast('已保存', 'ok'); render(); return true;
    }
  });

function shipStatus(s){
  const t = today();
  if(s.delivered) return '<span class="tag ok">已送达</span>';
  if(s.arrive){
    const dd = dayDiff(s.arrive, t);
    if(s.arrive < t) return `<span class="tag err">超${Math.abs(dd)}天未送达</span>`;
    if(dd <= 3) return `<span class="tag warn">${dd === 0 ? '今日到港' : dd + '天后到港'}</span>`;
  }
  return '<span class="tag info">运输中</span>';
}

const TPL = {
  inventory: ['货号','颜色','父ASIN','店铺','FBA库存总数','FBA在售','在途库存','时间'],
  shipments: ['店铺','创建时间','货号','父ASIN','FBA货件名','FBA货件ID','FBA仓','货代方式','离港时间','到港时间','预计送达时段开始','预计送达时段结束','送达时间'],
  skus: ['店铺','父ASIN','子ASIN','MSKU','颜色','产品图片','FBA库存数量','货号','产品类型']
};
function pick(row, names){
  for(const n of names){
    if(!row || row[n] === undefined || row[n] === null) continue;
    const raw = row[n];
    if(typeof raw === 'string' && raw.trim() === '') continue;
    if(raw instanceof Date){
      const d = raw, pad = x => String(x).padStart(2, '0');
      if(isNaN(d.getTime())) continue;
      const day = d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
      return (d.getHours() || d.getMinutes()) ? day + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes()) : day;
    }
    // Excel 日期序列号（单元格未套用日期格式时）
    if(typeof raw === 'number' && /时间|日期/.test(names.join('')) && raw > 20000 && raw < 80000){
      const d = new Date(Math.round((raw - 25569) * 86400000));
      const pad = x => String(x).padStart(2, '0');
      return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate());
    }
    return String(raw).trim();
  }
  return '';
}
function downloadTpl(page){
  const csv = '\ufeff' + TPL[page].join(',') + '\r\n';
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type:'text/csv' }));
  a.download = page + '_导入模板.csv'; a.click();
  toast('模板已下载（CSV格式，Excel可直接编辑）', 'ok');
}
let importTarget = null;
let lastImportResult = null;
/* XLSX 按需加载：不阻塞首屏；离线时 CSV 导入依然可用 */
let xlsxPromise = null;
function loadXLSX(){
  if(typeof XLSX !== 'undefined') return Promise.resolve(true);
  if(xlsxPromise) return xlsxPromise;
  xlsxPromise = new Promise(resolve => {
    let done = false;
    const fin = ok => { if(done) return; done = true; clearTimeout(tm); resolve(ok); };
    const tm = setTimeout(() => fin(typeof XLSX !== 'undefined'), 8000);
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
    s.onload = () => fin(typeof XLSX !== 'undefined');
    s.onerror = () => fin(false);
    document.head.appendChild(s);
  });
  return xlsxPromise;
}
/* 内置 CSV 解析（支持引号、逗号/制表符、BOM、CRLF），断网也能导入 */
function parseCSV(text){
  const s = String(text || '').replace(/^\ufeff/, '');
  if(!s.trim()) return [];
  const nl = s.indexOf('\n');
  const first = nl < 0 ? s : s.slice(0, nl);
  const delim = first.indexOf('\t') >= 0 && first.indexOf(',') < 0 ? '\t' : ',';
  const rows = []; let row = [], cell = '', q = false;
  for(let i = 0; i < s.length; i++){
    const ch = s[i];
    if(q){
      if(ch === '"'){ if(s[i+1] === '"'){ cell += '"'; i++; } else q = false; }
      else cell += ch;
    } else if(ch === '"') q = true;
    else if(ch === delim){ row.push(cell); cell = ''; }
    else if(ch === '\n'){ row.push(cell); rows.push(row); row = []; cell = ''; }
    else if(ch !== '\r') cell += ch;
  }
  if(cell !== '' || row.length){ row.push(cell); rows.push(row); }
  if(rows.length < 2) return [];
  const head = rows.shift().map(h => String(h).trim());
  return rows.filter(r => r.some(v => String(v).trim() !== '')).map(r => {
    const o = {}; head.forEach((h, i) => { if(h) o[h] = r[i] === undefined ? '' : r[i]; });
    return o;
  });
}
function doExcelImport(page){
  importTarget = page;
  const f = document.getElementById('fileInput');
  if(!f) return;

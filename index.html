<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>亚马逊运营工作台</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#f1efe9; --card:#ffffff; --line:#e8e5db; --txt:#333d35; --sub:#8a9188;
  --acc:#2e7d5b; --acc-deep:#256a4c; --acc-bg:#e4f0e8;
  --ok:#2e7d5b; --ok-bg:#e4f0e8;
  --warn:#b7791f; --warn-bg:#faf1df;
  --err:#c05648; --err-bg:#fbeae7;
  --info:#4a7dab; --info-bg:#e8f1f8;
  --panel:#f7f6f1; --panel-line:#eeede5; --th-bg:#faf9f4; --td-line:#f2f1ea; --hover:#eef2e9;
  --pill:#f4f2ec; --tag-gray:#eceae1; --img-bg:#edefe6; --chip-bg:#f1efe7; --zero:#c9cec2; --dash:#f0eee6;
  --side1:#fbfaf6; --side2:#f4f4ec; --side3:#e9efe2; --nav-txt:#6f7a6e; --nav-grp:#a9b0a2;
  --scroll:#d8d5c9; --toast:#37413a; --row-del:#b9bfb1; --empty:#a3a899;
  --acc-soft:rgba(46,125,91,.08); --acc-ring:rgba(46,125,91,.13); --acc-glow:rgba(46,125,91,.3);
  --acc-txt:#ffffff; --overlay:rgba(45,55,45,.45);
  --radius:14px; --shadow:0 1px 2px rgba(85,85,60,.05),0 4px 16px rgba(85,85,60,.07);
}
/* ===== 主题：莫兰迪 · 灰绿 ===== */
[data-theme="sage"]{
  --bg:#ebece6; --card:#f8f9f5; --line:#dcded4; --txt:#3b4038; --sub:#8b9088;
  --acc:#7f927c; --acc-deep:#6d806a; --acc-bg:#e7ece2;
  --ok:#7f927c; --ok-bg:#e7ece2; --warn:#a8845c; --warn-bg:#f3ecdf;
  --err:#a97e78; --err-bg:#f2e6e4; --info:#8497a6; --info-bg:#e9edf0;
  --panel:#f1f2ec; --panel-line:#e3e5dc; --th-bg:#f4f5ef; --td-line:#e8eae1; --hover:#e9ece2;
  --pill:#e8eae2; --tag-gray:#e2e4db; --img-bg:#e4e6dc; --chip-bg:#eff0e9; --zero:#c2c6ba; --dash:#e9eae1;
  --side1:#f9f9f5; --side2:#f0f2ea; --side3:#e3e8de; --nav-txt:#6f776d; --nav-grp:#a5ab9f;
  --scroll:#d4d7cb; --toast:#4a4f47; --row-del:#b7bcb0; --empty:#9aa092;
  --acc-soft:rgba(127,146,124,.10); --acc-ring:rgba(127,146,124,.16); --acc-glow:rgba(127,146,124,.32);
  --acc-txt:#ffffff;
  --overlay:rgba(60,64,56,.45);
  --shadow:0 1px 2px rgba(90,95,80,.06),0 4px 16px rgba(90,95,80,.09);
}
/* ===== 主题：莫兰迪 · 雾霾蓝 ===== */
[data-theme="mist"]{
  --bg:#e8ebef; --card:#f7f9fb; --line:#dbe0e7; --txt:#333a42; --sub:#828b95;
  --acc:#7b8fa5; --acc-deep:#697d92; --acc-bg:#e5ecf2;
  --ok:#7b8fa5; --ok-bg:#e5ecf2; --warn:#a58a5e; --warn-bg:#f2ecdf;
  --err:#a97e78; --err-bg:#f2e6e4; --info:#7b8fa5; --info-bg:#e5ecf2;
  --panel:#eef1f5; --panel-line:#e0e5eb; --th-bg:#f2f4f8; --td-line:#e6eaf0; --hover:#e8edf3;
  --pill:#e6eaf0; --tag-gray:#e0e4ea; --img-bg:#e2e7ed; --chip-bg:#edf0f4; --zero:#bec5ce; --dash:#e7eaef;
  --side1:#f8fafc; --side2:#eef2f6; --side3:#e2e9f0; --nav-txt:#6d7884; --nav-grp:#a3abb5;
  --scroll:#d3d8df; --toast:#414a54; --row-del:#b4bcc6; --empty:#969eaa;
  --acc-soft:rgba(123,143,165,.12); --acc-ring:rgba(123,143,165,.18); --acc-glow:rgba(123,143,165,.32);
  --acc-txt:#ffffff;
  --overlay:rgba(52,58,66,.45);
  --shadow:0 1px 2px rgba(70,80,95,.06),0 4px 16px rgba(70,80,95,.09);
}
/* ===== 主题：莫兰迪 · 豆沙粉 ===== */
[data-theme="rose"]{
  --bg:#efe9e8; --card:#faf7f6; --line:#e2d9d7; --txt:#413a39; --sub:#948b8a;
  --acc:#ab8585; --acc-deep:#96716f; --acc-bg:#f0e4e3;
  --ok:#96a88f; --ok-bg:#e9ece4; --warn:#ab8a62; --warn-bg:#f4ead9;
  --err:#b3706a; --err-bg:#f4e0de; --info:#8a94a8; --info-bg:#e8ecf1;
  --panel:#f4efee; --panel-line:#e7dcd9; --th-bg:#f7f2f1; --td-line:#ece2e0; --hover:#efe3e2;
  --pill:#ece4e3; --tag-gray:#e6dcd9; --img-bg:#e9e0de; --chip-bg:#f1eae9; --zero:#cfc2c0; --dash:#efe7e5;
  --side1:#fbf8f7; --side2:#f4edec; --side3:#ecdfdf; --nav-txt:#847a79; --nav-grp:#b0a5a4;
  --scroll:#dcd2d0; --toast:#504746; --row-del:#c2b6b5; --empty:#a59a99;
  --acc-soft:rgba(171,133,133,.10); --acc-ring:rgba(171,133,133,.16); --acc-glow:rgba(171,133,133,.30);
  --acc-txt:#ffffff;
  --overlay:rgba(66,58,57,.45);
  --shadow:0 1px 2px rgba(100,88,86,.06),0 4px 16px rgba(100,88,86,.09);
}
/* ===== 主题：莫兰迪 · 燕麦 ===== */
[data-theme="oat"]{
  --bg:#eee9e1; --card:#f9f6f1; --line:#e0d9cd; --txt:#403a31; --sub:#8f887b;
  --acc:#a58f6f; --acc-deep:#8f7a5c; --acc-bg:#f0e8dc;
  --ok:#8f9f7a; --ok-bg:#e9ecdf; --warn:#b38b52; --warn-bg:#f4ead8;
  --err:#ad7365; --err-bg:#f3e3de; --info:#87909e; --info-bg:#e9ebef;
  --panel:#f3eee6; --panel-line:#e6ddce; --th-bg:#f6f1e9; --td-line:#ebe4d8; --hover:#eee6da;
  --pill:#eae4d9; --tag-gray:#e5ddd0; --img-bg:#e6dfd2; --chip-bg:#f0eae1; --zero:#cbc2b3; --dash:#ede5d9;
  --side1:#fbf9f4; --side2:#f4efe5; --side3:#eae0cf; --nav-txt:#82796a; --nav-grp:#aca494;
  --scroll:#dbd3c5; --toast:#4d463b; --row-del:#bcb3a3; --empty:#a29a8c;
  --acc-soft:rgba(165,143,111,.10); --acc-ring:rgba(165,143,111,.16); --acc-glow:rgba(165,143,111,.32);
  --acc-txt:#ffffff;
  --overlay:rgba(64,58,49,.45);
  --shadow:0 1px 2px rgba(95,88,73,.06),0 4px 16px rgba(95,88,73,.09);
}
/* ===== 主题：静谧夜（深色） ===== */
[data-theme="night"]{
  --bg:#1c211e; --card:#242a26; --line:#333a34; --txt:#e3e8e3; --sub:#96a097;
  --acc:#7fae94; --acc-deep:#6d9c82; --acc-bg:#2b3a31;
  --ok:#7fae94; --ok-bg:#2b3a31; --warn:#d0a866; --warn-bg:#3a3323;
  --err:#d98a7e; --err-bg:#3d2b28; --info:#89a7c4; --info-bg:#26323c;
  --panel:#2b312c; --panel-line:#39413a; --th-bg:#272d29; --td-line:#313833; --hover:#2f362f;
  --pill:#2a302b; --tag-gray:#39413a; --img-bg:#333a34; --chip-bg:#2b312c; --zero:#4a524b; --dash:#313833;
  --side1:#202622; --side2:#1e241f; --side3:#1a201b; --nav-txt:#a8b3a9; --nav-grp:#6f7a70;
  --scroll:#3d453f; --toast:#4f6d5d; --row-del:#5c665e; --empty:#7d877e;
  --acc-soft:rgba(127,174,148,.16); --acc-ring:rgba(127,174,148,.22); --acc-glow:rgba(127,174,148,.35);
  --acc-txt:#17211b;
  --overlay:rgba(0,0,0,.62);
  --shadow:0 1px 2px rgba(0,0,0,.25),0 6px 18px rgba(0,0,0,.3);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"PingFang SC","Microsoft YaHei",-apple-system,sans-serif;background:var(--bg);color:var(--txt);font-size:14px}
button{font-family:inherit;cursor:pointer;border:none;border-radius:9px;font-size:13px;white-space:nowrap}
input,select,textarea{font-family:inherit;font-size:13px;color:var(--txt);border:1px solid var(--line);border-radius:9px;padding:7px 10px;background:var(--card);outline:none;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-ring)}
label{font-size:12px;color:var(--sub);display:block;margin-bottom:5px}
.nav::-webkit-scrollbar,.content::-webkit-scrollbar,.modal-body::-webkit-scrollbar{width:8px}
.nav::-webkit-scrollbar-thumb,.content::-webkit-scrollbar-thumb,.modal-body::-webkit-scrollbar-thumb{background:var(--scroll);border-radius:99px}

/* ===== 布局 ===== */
.app{display:flex;height:100vh;overflow:hidden}
@supports (height:100dvh){.app{height:100dvh}} /* 安卓/HarmonyOS 浏览器地址栏动态视口，防底部被裁 */
.sidebar{width:232px;background:linear-gradient(180deg,var(--side1) 0%,var(--side2) 55%,var(--side3) 100%);border-right:1px solid var(--line);display:flex;flex-direction:column;flex-shrink:0;transition:width .2s}
.sidebar.collapsed{width:64px}
.sidebar.collapsed .nav-txt,.sidebar.collapsed .brand-txt,.sidebar.collapsed .collapse-label,.sidebar.collapsed .nav-grp,.sidebar.collapsed .sf-txt{display:none}
.brand{display:flex;align-items:center;gap:11px;padding:20px 16px 14px}
.brand-icon{width:38px;height:38px;border-radius:12px;background:var(--acc);color:var(--acc-txt);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;flex-shrink:0;box-shadow:0 4px 10px var(--acc-glow)}
.brand-txt b{display:block;font-size:14.5px;letter-spacing:.3px}
.brand-txt span{display:block;font-size:11px;color:var(--sub);margin-top:2px}
.nav{flex:1;overflow-y:auto;padding:2px 12px 10px}
.nav-grp{font-size:11px;color:var(--nav-grp);padding:16px 6px 6px;letter-spacing:1px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;color:var(--nav-txt);cursor:pointer;margin-bottom:2px;transition:all .15s;white-space:nowrap;font-size:13.5px}
.nav-item:hover{background:var(--acc-soft);color:var(--txt)}
.nav-item.active{background:var(--acc);color:var(--acc-txt);font-weight:600;box-shadow:0 4px 12px var(--acc-glow)}
.nav-item .nav-ico{width:20px;display:flex;justify-content:center;flex-shrink:0}
.nav-item .nav-ico svg{width:17px;height:17px}
.side-foot{display:flex;align-items:center;gap:9px;padding:14px 18px;border-top:1px solid var(--line)}
/* 侧栏快捷区（仅手机端显示：主题切换 / 提醒入口） */
.sb-quick{display:none}
.sbq-btn{position:relative;width:46px;min-height:46px;display:flex;align-items:center;justify-content:center;background:none;color:var(--nav-txt);border-radius:11px;cursor:pointer;border:none;padding:0}
.sbq-btn svg{width:20px;height:20px}
.sbq-btn:active{background:var(--acc-soft)}
.side-foot .sf-ico{width:26px;height:26px;border-radius:8px;background:var(--acc-bg);color:var(--acc);display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.side-foot .sf-txt b{display:block;font-size:12.5px}
.side-foot .sf-txt span{display:block;font-size:11px;color:var(--sub);margin-top:1px}
.collapse-btn{margin:0 14px 14px;padding:8px;border-radius:8px;background:transparent;color:var(--sub);font-size:12px}
.collapse-btn:hover{color:var(--acc);background:var(--acc-soft)}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{height:60px;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:20px;padding:0 24px;flex-shrink:0}
.crumb{color:var(--sub);font-size:13px;white-space:nowrap}
.crumb b{color:var(--txt);font-weight:600}
.top-right{margin-left:auto;display:flex;align-items:center;gap:12px}
.top-ico{background:none;color:var(--sub);position:relative;padding:7px;border-radius:9px;display:flex}
.top-ico svg{width:18px;height:18px}
.top-ico:hover{background:var(--pill);color:var(--txt)}
.bell-dot{position:absolute;top:5px;right:5px;width:8px;height:8px;background:var(--err);border-radius:50%;border:2px solid var(--card)}
.avatar{display:flex;align-items:center;gap:9px}
.avatar-circle{width:36px;height:36px;border-radius:50%;background:var(--acc);color:var(--acc-txt);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600}
.avatar-meta b{display:block;font-size:13px}
.avatar-meta span{font-size:11px;color:var(--sub)}
.content{flex:1;overflow-y:auto;padding:26px 30px}
.page-head{margin-bottom:20px}
.page-head h1{font-size:24px;font-weight:700;letter-spacing:.3px}
.page-head p{color:var(--sub);font-size:13px;margin-top:5px}

/* ===== 通用组件 ===== */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:18px}
.card-head{padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.card-head h2{font-size:15px;font-weight:600;display:flex;align-items:center;gap:9px}
.h2-ico{display:inline-flex;color:var(--acc)}
.h2-ico svg{width:16px;height:16px}
.count-badge{background:var(--acc);color:var(--acc-txt);font-size:11px;border-radius:999px;padding:1px 9px;min-width:20px;text-align:center;font-weight:500}
.count-badge.zero{background:var(--zero)}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.head-left{display:flex;align-items:center;gap:14px;flex-wrap:wrap;min-width:0}
.head-left .search-wrap{flex:0 1 330px;min-width:220px}
.color-cell.clickable{cursor:pointer}
.color-cell.clickable:hover .thumb{outline:2px solid var(--acc);outline-offset:1px}
.det-img{width:100%;max-width:280px;height:200px;border-radius:12px;background-size:cover;background-position:center;background-color:var(--img-bg);margin:0 auto 4px}
.det-img.noimg{display:flex;align-items:center;justify-content:center;color:var(--empty);font-size:13px}
.det-grid{display:grid;grid-template-columns:70px 1fr;gap:9px 14px;font-size:13.5px;margin-top:12px}
.det-grid .k{color:var(--sub)}
.det-grid .v{font-weight:500}
.search-wrap{display:flex;gap:8px;align-items:center;flex:1;min-width:260px;max-width:430px}
.search-wrap input{min-width:0;border-radius:999px;padding:8px 15px;background:var(--panel);border-color:transparent}
.search-wrap input:focus{background:var(--card);border-color:var(--acc)}
.btn{background:var(--acc);color:var(--acc-txt);padding:8px 14px;font-weight:500}
.btn:hover{background:var(--acc-deep)}
.btn.ghost{background:var(--card);color:var(--txt);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--acc);color:var(--acc);background:var(--acc-bg)}
.btn.danger{background:var(--err)}
.btn.warn{background:var(--warn)}
.btn.sm{padding:4px 10px;font-size:12px;border-radius:7px}
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:12px;color:var(--sub);font-weight:600;text-align:left;padding:11px 16px;background:var(--th-bg);border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:12px 16px;border-bottom:1px solid var(--td-line);vertical-align:middle}
.tbl tbody tr:hover{background:var(--hover)}
.tbl tbody tr:last-child td{border-bottom:none}
.thumb{width:44px;height:44px;border-radius:10px;background-size:cover;background-position:center;background-color:var(--img-bg);flex-shrink:0}
.thumb-empty{display:flex;align-items:center;justify-content:center;color:var(--empty);font-size:11px;background:var(--img-bg)}
.tag{display:inline-flex;align-items:center;font-size:11px;border-radius:999px;padding:3px 10px;white-space:nowrap;font-weight:500}
.tag.ok{background:var(--ok-bg);color:var(--ok)}
.tag.warn{background:var(--warn-bg);color:var(--warn)}
.tag.err{background:var(--err-bg);color:var(--err)}
.tag.info{background:var(--info-bg);color:var(--info)}
.tag.gray{background:var(--tag-gray);color:var(--sub)}
.empty{padding:36px;text-align:center;color:var(--empty)}
.link-btn{color:var(--acc);background:none;padding:2px 4px;font-size:13px}
.link-btn:hover{text-decoration:underline}
.mini-btn{background:var(--card);border:1px solid var(--line);color:var(--sub);padding:2px 7px;font-size:12px;border-radius:7px}
.mini-btn:hover{color:var(--acc);border-color:var(--acc)}
.chip{display:inline-flex;align-items:center;gap:4px;background:#f1efe7;border-radius:999px;padding:2px 9px;font-size:12px;margin:2px 3px 2px 0;color:var(--sub);background:var(--chip-bg)}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.err{background:var(--err-bg);color:var(--err)}
.color-cells{display:flex;gap:6px;flex-wrap:wrap}
.color-cell{text-align:center}
.color-cell .thumb{width:36px;height:36px}
.color-cell span{display:block;font-size:10px;color:var(--sub);margin-top:2px}

/* 统计卡片 */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;margin-bottom:18px}
.stat-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;display:flex;align-items:center;gap:14px}
.stat-ico{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.stat-ico svg{width:20px;height:20px}
.s-green{background:var(--acc-bg);color:var(--acc)}
.s-blue{background:var(--info-bg);color:var(--info)}
.s-orange{background:var(--warn-bg);color:var(--warn)}
.s-red{background:var(--err-bg);color:var(--err)}
.stat-label{font-size:12px;color:var(--sub)}
.stat-num{font-size:22px;font-weight:700;margin-top:3px}
.stat-num span{font-size:12px;color:var(--sub);font-weight:400;margin-left:6px}
.stat-card.clickable{cursor:pointer;transition:transform .15s,box-shadow .15s}
.stat-card.clickable:hover{transform:translateY(-2px);box-shadow:var(--shadow),0 6px 16px rgba(0,0,0,.10)}
.stat-card.clickable:active{transform:translateY(0)}

/* 表格表头点击排序 */
.tbl thead th.sortable{cursor:pointer;user-select:none}
.tbl thead th.sortable:hover{color:var(--acc)}
.sort-ar{color:var(--acc);font-size:10px;margin-left:2px}
.tbl thead th[draggable="true"]{cursor:grab}
.tbl thead th.drop-before{box-shadow:inset 3px 0 0 var(--acc)}
.tbl thead th.drop-after{box-shadow:inset -3px 0 0 var(--acc)}

/* 提醒卡片拖拽手柄 */
.drag-handle{cursor:grab;color:var(--sub);font-size:15px;line-height:1;padding:5px 4px;border-radius:6px;user-select:none;touch-action:none;flex:0 0 auto}
.drag-handle:hover{color:var(--acc);background:var(--hover)}
.drag-handle:active{cursor:grabbing}

/* 提醒中心 */
.remind-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px}
.remind-item{display:flex;align-items:flex-start;gap:10px;padding:11px 14px;border-radius:12px;background:var(--panel);margin-bottom:8px}
.remind-item:hover{background:var(--hover)}
.remind-item .r-txt{flex:1;min-width:0}
.remind-item .r-title{font-weight:500;margin-bottom:2px}
.remind-item .r-sub{color:var(--sub);font-size:12px}

/* 提醒卡片展开/折叠 */
.rem-body{padding:14px 16px}
.rem-body.hidden{padding:10px 16px}
.rem-body.hidden .empty{padding:8px}
.head-acts{display:flex;align-items:center;gap:8px}
.rem-toggle{min-width:76px;justify-content:center}
.rem-toggle:hover{border-color:var(--acc)}

/* Excel 导入结果回传 */
.imp-sum{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.imp-sum .tag{font-size:12.5px;padding:5px 13px}
.imp-wrap{max-height:320px;overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.imp-tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.imp-tbl th{position:sticky;top:0;background:var(--th-bg);color:var(--sub);font-weight:600;padding:7px 10px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--line)}
.imp-tbl td{padding:7px 10px;border-bottom:1px solid var(--td-line);color:var(--txt);word-break:break-all;white-space:normal}
.imp-tbl tr:last-child td{border-bottom:none}

/* 模态框 */
.overlay{position:fixed;inset:0;background:var(--overlay);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal{background:var(--card);border-radius:16px;width:640px;max-width:96vw;max-height:88vh;display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(0,0,0,.2)}
.modal.wide{width:860px}

.modal-head h3{font-size:15px;font-weight:600}
.modal-close{background:none;font-size:20px;color:var(--sub);line-height:1;padding:2px 6px}

.modal-body{padding:18px 20px;overflow-y:auto}
.modal-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.form-grid .full{grid-column:1/-1}

/* 主题选择面板 */
.theme-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.theme-card{border:2px solid var(--line);border-radius:14px;padding:9px;cursor:pointer;background:var(--card);transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease}
.theme-card:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--acc)}
.theme-card.active{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-ring)}
.theme-prev{position:relative;height:86px;border-radius:9px;overflow:hidden;display:flex}
.tp-side{width:26%;display:flex;flex-direction:column;align-items:center;padding-top:9px;gap:5px}
.tp-brand{width:18px;height:18px;border-radius:6px}
.tp-dot{width:14px;height:6px;border-radius:99px;opacity:.85}
.tp-main{flex:1;padding:9px 9px}
.tp-bar{height:16px;border-radius:6px;display:flex;align-items:center;gap:4px;padding:0 6px}
.tp-bar span{width:16px;height:5px;border-radius:99px;display:block}
.tp-pills{display:flex;gap:5px;margin-top:8px}
.tp-pills span{width:22px;height:10px;border-radius:99px;display:block}
.tp-check{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;background:var(--acc);color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.theme-meta{padding:9px 4px 2px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}

.theme-desc{display:block;width:100%;font-size:12px;color:var(--sub);margin-top:2px}
.pe-sec{margin-bottom:18px}

.pe-row{display:grid;grid-template-columns:44px 1fr 1.8fr 1.8fr 34px;gap:8px;margin-bottom:8px;align-items:center}
.pe-row.adj{grid-template-columns:150px 1fr 34px}
.row-del{background:none;color:var(--row-del);font-size:16px;padding:4px}
.row-del:hover{color:var(--err)}
.term-list .term{display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:8px;margin-bottom:4px;background:var(--panel)}
.term .t-txt{flex:1;font-size:12.5px}
.term-add{display:flex;gap:6px;margin-top:6px}
.act-mini{background:var(--panel);border:1px solid var(--panel-line);border-radius:10px;padding:6px 9px;margin-bottom:6px;font-size:12px}
.act-mini .am-meta{color:var(--sub);font-size:11px;margin-top:3px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}

/* Toast */
#toastRoot{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:var(--toast);color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.25);animation:fadein .2s}
.toast.ok{background:var(--acc)}
.toast.err{background:var(--err)}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
/* ===== 响应式布局（电脑 / 手机双状态） ===== */
html,body{overflow-x:hidden;-webkit-text-size-adjust:100%}
img{max-width:100%}
.hamburger{display:none;background:none;color:var(--txt);padding:7px;border-radius:9px;flex-shrink:0}

.hamburger:active{background:var(--pill)}
.drawer-backdrop{display:none}
/* 触屏设备：所有按钮保证清晰点击区域（≥44px），输入16px防iOS缩放 */
@media (hover:none) and (pointer:coarse){
  button,.nav-item{touch-action:manipulation}
  .btn,.link-btn,.row-del,.modal-close,.top-ico,.hamburger{min-height:44px;min-width:44px;display:inline-flex;align-items:center;justify-content:center}
  .mini-btn{min-height:38px;min-width:38px;display:inline-flex;align-items:center;justify-content:center}

  input,select,textarea{font-size:16px}
}
/* 手机布局状态（≤900px）：单列 + 汉堡菜单 */
@media (max-width:900px){

  .topbar{display:none !important}

  .sidebar{position:static;width:62px;transform:none;box-shadow:none;border-right:1px solid var(--line)}
  .sidebar.open{transform:none}
  /* 品牌区让出状态栏/挖孔摄像头区域 */
  .brand{justify-content:center;padding:calc(14px + env(safe-area-inset-top, 0px)) 8px 10px}

  .sb-quick{display:flex;flex-direction:column;align-items:center;gap:6px;margin:auto 0 4px;padding:8px 8px 2px;border-top:1px solid var(--line)}
  .sbq-btn{width:46px;min-height:46px}
  .sbq-btn .bell-dot{top:8px;right:8px}
  .side-foot{justify-content:center;padding:10px 0;border-top:none}
  .drawer-backdrop{display:none !important}
  /* 内容区单列：顶部让出状态栏/挖孔区，底部让出手势条 */
  .content{padding:calc(14px + env(safe-area-inset-top, 0px)) 12px calc(24px + env(safe-area-inset-bottom, 0px))}

  .card-head{flex-direction:column;align-items:stretch;gap:10px;padding:14px}
  .head-left{width:100%}

  .toolbar{width:100%}
  .toolbar .btn{flex:1 1 auto;justify-content:center}
  /* 表格 → 卡片式行（正文无横向滚动） */

  table.tbl{display:block}
  table.tbl thead{display:none}
  table.tbl tbody{display:block}
  table.tbl tr{display:block;border:1px solid var(--line);border-radius:12px;margin-bottom:12px;padding:4px 0;background:var(--card);box-shadow:0 1px 6px rgba(85,85,60,.06)}
  table.tbl tbody tr:hover{background:var(--card)}
  table.tbl td{display:flex;flex-wrap:wrap;align-items:flex-start;gap:8px 10px;border-bottom:1px dashed var(--dash);padding:9px 13px;white-space:normal;word-break:break-word}
  table.tbl td:last-of-type{border-bottom:none}
  table.tbl td::before{content:attr(data-label);flex:0 0 5.5em;color:var(--sub);font-size:12px;font-weight:600;line-height:1.9}
  table.tbl td[colspan]{display:block;border-bottom:none;padding:20px 14px;text-align:center}
  table.tbl td[colspan]::before{content:''}
  table.tbl td .act-mini{flex:1 1 100%}
  /* 模态框 → 底部弹层（让出底部手势区） */
  .overlay{padding:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom, 0px));align-items:flex-end;z-index:150}
  .modal,.modal.wide,.modal.xl{width:100%;max-width:100%;max-height:calc(100% - 12px);border-radius:18px 18px 12px 12px}
  .modal-foot{padding-bottom:calc(14px + env(safe-area-inset-bottom, 0px))}
  .modal-body{padding:14px}
  .form-grid{grid-template-columns:1fr}
  /* 产品编辑器颜色行 / 样鞋记录行纵向堆叠 */
  .pe-row{grid-template-columns:44px 1fr 34px;grid-template-areas:"t n d" "t i i" "f f f"}
  .pe-row>.thumb{grid-area:t}
  .pe-row .pe-cn{grid-area:n}
  .pe-row .pe-ci{grid-area:i}
  .pe-row .pe-cf{grid-area:f}
  .pe-row .row-del{grid-area:d}
  .pe-row.adj{display:flex;flex-direction:column;align-items:stretch;gap:6px}
  .pe-row.adj .row-del{align-self:flex-end}
  .desc-list td,.desc-list th{white-space:normal;word-break:break-word}
  .empty{padding:18px}
  #toastRoot{bottom:calc(18px + env(safe-area-inset-bottom,0px))}
}
@media (max-width:420px){
  .brand-txt b{font-size:13px}
  .page-head h1{font-size:18px}
}

<script>
/* ================= 工具函数 ================= */
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = p => p + '_' + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3);
const iso = d => { const x = new Date(d); return x.getFullYear() + '-' + String(x.getMonth()+1).padStart(2,'0') + '-' + String(x.getDate()).padStart(2,'0'); };
const today = () => iso(new Date());
const usToday = () => new Intl.DateTimeFormat('en-CA', { timeZone:'America/Los_Angeles', year:'numeric', month:'2-digit', day:'2-digit' }).format(new Date()); // 促销活动时间以美国太平洋时间为准
const nowDT = () => { const d = new Date(); return iso(d) + 'T' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0'); };
const fmtDT = s => String(s || '').replace('T', ' ');
const dayDiff = (a, b) => Math.round((new Date(a) - new Date(b)) / 86400000);
const num = v => { const n = parseFloat(v); return isNaN(n) ? 0 : n; };
function toast(msg, type){ const t = document.createElement('div'); t.className = 'toast ' + (type || ''); t.textContent = msg; document.getElementById('toastRoot').appendChild(t); setTimeout(() => t.remove(), 2600); }
const jsq = s => String(s == null ? '' : s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'&quot;'); // onclick 内联参数安全转义
function copyText(btn){
  const txt = btn.dataset.t || '';
  const done = () => toast('已复制到剪贴板', 'ok');
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done).catch(() => fallbackCopy(txt, done));
  } else fallbackCopy(txt, done);
}
function fallbackCopy(txt, done){
  const ta = document.createElement('textarea');
  ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); done(); }catch(e){ toast('复制失败，请手动复制', 'err'); }
  ta.remove();
}
function weekKey(d){ const date = new Date(d); const day = (date.getDay()+6)%7; const th = new Date(date); th.setDate(date.getDate()-day+3); const y = th.getFullYear(); const w = Math.ceil(((th - new Date(y,0,1))/86400000 + 1) / 7); return y + '-W' + w; }
function weekRange(d){ const date = new Date(d); const day = (date.getDay()+6)%7; const ws = new Date(date); ws.setDate(date.getDate()-day); const we = new Date(ws); we.setDate(ws.getDate()+6); return [iso(ws), iso(we)]; }
/* 周日 ~ 周六 的送达时段工具（预计送达时段以周日至下周六为一时段） */
function sunWeek(d){ const date = new Date(d); const day = date.getDay(); const ws = new Date(date); ws.setDate(date.getDate()-day); const we = new Date(ws); we.setDate(ws.getDate()+6); return [iso(ws), iso(we)]; }
function nextSunWeek(){ const t = new Date(); const day = t.getDay(); const off = day === 0 ? 7 : 7 - day; const ws = new Date(t); ws.setDate(t.getDate()+off); const we = new Date(ws); we.setDate(ws.getDate()+6); return [iso(ws), iso(we)]; }
function winFmt(s){
  const f = (str, full) => { if(!str) return ''; const d = new Date(str); if(isNaN(d)) return str;
    const md = (d.getMonth()+1) + '月' + d.getDate() + '日'; return full ? d.getFullYear() + '年' + md : md; };
  if(s.winStart && s.winEnd) return f(s.winStart, false) + ' - ' + f(s.winEnd, true);
  return f(s.winStart || s.winEnd, true);
}
function matchQ(q, ...fields){ if(!q) return true; const qq = q.trim().toLowerCase(); return fields.some(f => String(f || '').toLowerCase().includes(qq)); }

function hashPwd(pw, salt){ // 盐化迭代散列（本地工具级防护，非加密强度）
  const s = salt + '::' + pw;
  let h1 = 0x811c9dc5, h2 = 0x9e3779b9;
  for(let r = 0; r < 96; r++){
    for(let i = 0; i < s.length; i++){
      h1 = (h1 ^ s.charCodeAt(i)) >>> 0; h1 = (h1 * 16777619) >>> 0;
      h2 = (h2 + h1 + r + i) >>> 0; h2 = (h2 ^ (h2 << 13)) >>> 0; h2 = (h2 ^ (h2 >>> 7)) >>> 0;
    }
  }
  return h1.toString(36) + '-' + h2.toString(36) + '-' + s.length.toString(36);
}

/* 表格增强：应用用户自定义列顺序 + 注入 data-label（手机端卡片字段名）+ 挂载点击排序与列拖拽 */
function enhanceTables(){
  document.querySelectorAll('table.tbl').forEach(tb => {
    if(tb.closest && tb.closest('.overlay, #modalRoot')) return; // 弹窗内明细表不参与
    const ths = [...tb.querySelectorAll('thead th')];
    if(!ths.length) return;
    const orig = ths.map(th => th.textContent.trim()); // 本次渲染的默认列顺序（冻结为基准）
    let labels = orig;
    const order = S.cols[S.page];
    if(order && order.length){
      // 应用用户拖拽的列顺序；新增列自动追加到末尾，已删除列自动忽略
      labels = order.filter(l => orig.includes(l)).concat(orig.filter(l => !order.includes(l)));
      const map = labels.map(l => orig.indexOf(l));
      const headRow = tb.querySelector('thead tr');
      const hc = [...headRow.children];
      map.forEach(oi => headRow.appendChild(hc[oi])); // 按新顺序重排表头
      tb.querySelectorAll('tbody tr').forEach(tr => {
        if(tr.children.length !== orig.length) return; // 汇总/空行跳过
        const cs = [...tr.children];
        map.forEach(oi => tr.appendChild(cs[oi])); // 单元格同步重排
      });
    }
    tb.querySelectorAll('thead th').forEach((th, ci) => {
      th.dataset.lbl = labels[ci];
      if(labels[ci] === '操作'){ th.removeAttribute('draggable'); th.onclick = null; return; } // 操作列固定不参与
      th.classList.add('sortable');
      th.title = '点击：按该字段排序（升 → 降 → 取消）；拖动：调整该列前后位置';
      th.setAttribute('draggable', 'true');
      th.onclick = () => { if(colJustDropped){ colJustDropped = false; return; } sortTableClick(S.page, ci); };
      th.ondragstart = e => colDragStart(e, labels[ci]);
      th.ondragover = e => colDragOver(e, th);
      th.ondragleave = () => { th.classList.remove('drop-before', 'drop-after'); };
      th.ondrop = e => colDrop(e, th);
    });
    tb.querySelectorAll('tbody tr').forEach(tr => {
      if(tr.children.length !== labels.length) return;
      [...tr.children].forEach((td, i) => { if(td.tagName === 'TD' && labels[i]) td.dataset.label = labels[i]; });
    });
    const st = S.sort[S.page];
    if(st && ths[st.col] && labels[st.col] !== '操作'){ markSortTh(tb, st); applyTableSort(tb, st.col, st.dir); }
  });

/* ===== 列拖拽（所有业务模块通用）===== */
let dragColFrom = null, colJustDropped = false;
function colDragStart(e, lbl){
  dragColFrom = lbl;
  e.dataTransfer.effectAllowed = 'move';
  try{ e.dataTransfer.setData('text/plain', lbl); }catch(err){}
}
function colDragOver(e, th){
  if(!dragColFrom || !th || th.dataset.lbl === '操作' || th.dataset.lbl === dragColFrom) return;
  e.preventDefault(); e.dataTransfer.dropEffect = 'move';
  const r = th.getBoundingClientRect();
  th.classList.toggle('drop-before', (e.clientX - r.left) <= r.width / 2);
  th.classList.toggle('drop-after', (e.clientX - r.left) > r.width / 2);
}
function colDrop(e, th){
  e.preventDefault();
  th.classList.remove('drop-before', 'drop-after');
  const from = dragColFrom; dragColFrom = null;
  if(!from || !th || th.dataset.lbl === from || th.dataset.lbl === '操作') return;
  const tb = th.closest('table');
  const labels = [...tb.querySelectorAll('thead th')].map(t => t.dataset.lbl);
  const r = th.getBoundingClientRect();
  const after = (e.clientX - r.left) > r.width / 2; // 落点在目标列左半：插到其前；右半：插到其后
  const next = colReorder(labels, from, th.dataset.lbl, after);
  if(!next) return;
  S.cols[S.page] = next;
  delete S.sort[S.page]; saveSort(); // 列序变化后旧排序索引失效，清除
  saveCols();
  colJustDropped = true; // 防止部分浏览器拖放后再触发一次点击排序
  setTimeout(() => { colJustDropped = false; }, 300);
  render();
}
function colReorder(labels, from, to, after){
  if(from === to) return null;
  const arr = labels.slice();
  const fi = arr.indexOf(from);
  if(fi < 0) return null; // 源不存在（列已删除），不处理
  arr.splice(fi, 1);
  const ti = arr.indexOf(to);
  if(ti < 0) return null;
  arr.splice(after ? ti + 1 : ti, 0, from);
  return arr;
}
/* 排序三态切换：升 → 降 → 取消（取消后恢复模块默认排序） */
function sortTableClick(key, ci){
  const st = S.sort[key];
  if(st && st.col === ci){
    if(st.dir === 1) S.sort[key] = { col: ci, dir: -1 };
    else { delete S.sort[key]; saveSort(); render(); return; }
  } else S.sort[key] = { col: ci, dir: 1 };
  saveSort(); render();
}
function markSortTh(tb, st){
  [...tb.querySelectorAll('thead th')].forEach((th, i) => {
    th.innerHTML = th.dataset.lbl + (i === st.col ? `<span class="sort-ar">${st.dir === 1 ? '↑' : '↓'}</span>` : '');
  });
}
/* 基于单元格文本的数值感知排序，空值恒排最后 */
function applyTableSort(tb, col, dir){
  const ths = tb.querySelectorAll('thead th').length;
  const tbody = tb.querySelector('tbody'); if(!tbody) return;
  const rows = [...tbody.children].filter(tr => tr.tagName === 'TR' && tr.children.length === ths);
  if(rows.length < 2) return;
  const coll = new Intl.Collator('zh', { numeric: true, sensitivity: 'base' });
  const val = tr => (tr.children[col] || {}).textContent ? tr.children[col].textContent.trim() : '';
  rows.sort((a, b) => {
    const va = val(a), vb = val(b);
    if(!va && !vb) return 0;
    if(!va) return 1; if(!vb) return -1;
    return dir * coll.compare(va, vb);
  }).forEach(r => tbody.appendChild(r));
}

const DONE_KEYS = [['mainImage','产品主图'],['ap','产品A+'],['video','产品视频'],['influencer','网红视频'],['review','直评'],['vine','VINE']];
const FLASH_TYPES = ['秒杀','Z划算']; // 开始前2天提醒的活动类型
function promoPhase(p){
  const t = usToday(); // 促销活动时间以美国时间（太平洋时区）为准
  const flash = FLASH_TYPES.includes(p.type);
  if(!p.start || !p.end) return null;
  if(t > p.end) return !flash && dayDiff(t, p.end) <= 1 ? { tag:'err', label:'已结束', remind:true } : null;
  if(t >= p.start){
    if(!flash && dayDiff(p.end, t) <= 2) return { tag:'warn', label:'即将结束', remind:true };
    return { tag:'info', label:'进行中', remind:false };
  }
  if(flash){
    const dd = dayDiff(p.start, t);
    if(dd <= 2) return { tag:'warn', label: dd === 0 ? '今日开始' : '即将开始', remind:true };
  }
  return { tag:'gray', label:'未开始', remind:false };
}
function calcReminders(){
  const t = today();
  const r = { promo:[], incomplete:[], creatorShops:{}, arrive:[], overdue:[], winNext:[], factory:[], sampling:[] };
  DB.promotions.forEach(p => {
    const ph = promoPhase(p);
    if(ph && ph.remind) r.promo.push({ p, ph });
  });
  DB.products.forEach(p => {
    const miss = DONE_KEYS.filter(([k]) => !p.done[k]).map(([,n]) => n);
    if(miss.length) r.incomplete.push({ p, miss });
  });
  const [ws, we] = weekRange(new Date()); const wk = weekKey(new Date());
  DB.creators.forEach(c => {
    if(c.weeksDone && c.weeksDone[wk]) return;
    if(c.start && c.end && c.start <= we && c.end >= ws){
      const key = c.shop || '未填店铺';
      (r.creatorShops[key] = r.creatorShops[key] || []).push(c); // 以店铺为维度汇总
    }
  });
  DB.shipments.forEach(s => {
    if(s.delivered || !s.arrive) return;
    const dd = dayDiff(s.arrive, t);
    if(dd >= 0 && dd <= 3) r.arrive.push({ s, label: dd === 0 ? '今日到港' : dd + '天后到港', cls:'warn' });
    else if(s.arrive < t) r.overdue.push(s); // 到港未送达，独立提醒
  });
  /* 送达时段在下周且未填写送达日期 → 每日提醒（时段以周日至下周六为一周）；
     「标记本周完成」后当周不再提醒（winDone 按周记录，跨周未填写会重新提醒） */
  const [nws, nwe] = nextSunWeek();
  const wkNow = weekKey(new Date());
  DB.shipments.forEach(s => {
    if(s.delivered || !s.winStart) return;
    if(s.winDone && s.winDone[wkNow]) return; // 本周已标记完成，不再提醒
    if(s.winStart >= nws && s.winStart <= nwe) r.winNext.push({ s, winLabel: winFmt(s) });
  });
  DB.factoryOrders.forEach(o => { if(!o.shippedAt) r.factory.push(o); });
  /* 新开发样鞋：未填写完成时间 → 每日提醒，按开发时间正序 */
  r.sampling = DB.sampling.filter(s => !s.doneAt)
    .sort((a, b) => (a.createdAt||'').localeCompare(b.createdAt||''));
  return r;
}

    if(cardEl) e.dataTransfer.setDragImage(cardEl, 20, 20); // 拖动整卡影像
  }catch(err){}
}
function remDragOver(e){
  if(!dragRemFrom) return;
  e.preventDefault(); e.dataTransfer.dropEffect = 'move';
}
function remDrop(e){
  e.preventDefault();
  const from = dragRemFrom; dragRemFrom = null;
  const cardEl = e.target.closest('.rem-card');
  if(!from || !cardEl || cardEl.dataset.remkey === from) return;
  const cur = [...document.querySelectorAll('.rem-card')].map(el => el.dataset.remkey);
  const r = cardEl.getBoundingClientRect();
  const after = (e.clientY - r.top) > r.height / 2; // 上半：插其前；下半：插其后
  S.remOrder = remReorder(cur, from, cardEl.dataset.remkey, after);
  saveRemOrder(); render();
}
function remReorder(keys, from, to, after){
  if(from === to) return keys;
  const arr = keys.slice();
  const fi = arr.indexOf(from);
  if(fi < 0) return keys; // 源不存在，兜底不处理
  arr.splice(fi, 1);
  const ti = arr.indexOf(to);
  if(ti < 0) return arr;
  arr.splice(after ? ti + 1 : ti, 0, from);
  return arr;
}

  const v = el.value.trim(); if(!v) return;

  if(j < 0 || j >= r[key].length) return;
  [r[key][i], r[key][j]] = [r[key][j], r[key][i]];
  saveDB(); render();
}

function shipStatus(s){
  const t = today();
  if(s.delivered) return '<span class="tag ok">已送达</span>';
  if(s.arrive){
    const dd = dayDiff(s.arrive, t);
    if(s.arrive < t) return `<span class="tag err">超${dd}天未送达</span>`;
    if(dd <= 3) return `<span class="tag warn">${dd === 0 ? '今日到港' : dd + '天后到港'}</span>`;
  }
  return '<span class="tag info">运输中</span>';
}

/* ================= Excel 导入 / 模板 ================= */
const TPL = {
  inventory: ['货号','颜色','父ASIN','店铺','FBA库存总数','FBA在售','在途库存','时间'],
  shipments: ['店铺','创建时间','货号','父ASIN','FBA货件名','FBA货件ID','FBA仓','货代方式','离港时间','到港时间','预计送达时段开始','预计送达时段结束','送达时间'],
  skus: ['店铺','父ASIN','子ASIN','MSKU','颜色','产品图片','FBA库存数量','货号','产品类型']
};
function pick(row, names){
  for(const n of names){ if(row[n] !== undefined && row[n] !== null && String(row[n]).trim() !== '') return String(row[n]).trim(); }
  return '';
}
function downloadTpl(page){
  const csv = '\ufeff' + TPL[page].join(',') + '\r\n';
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type:'text/csv' }));
  a.download = page + '_导入模板.csv'; a.click();
  toast('模板已下载（CSV格式，Excel可直接编辑）', 'ok');
}
let importTarget = null;
let lastImportResult = null;
function doExcelImport(page){
  importTarget = page;
  const f = document.getElementById('fileInput');
  f.value = ''; f.click();
}
document.getElementById('fileInput').addEventListener('change', function(){
  const file = this.files[0]; if(!file || !importTarget) return;
  if(typeof XLSX === 'undefined'){ toast('Excel解析组件未加载（需联网加载），请使用CSV格式导入', 'err'); return; }
  const fr = new FileReader();
  fr.onload = e => {
    try{
      const wb = XLSX.read(new Uint8Array(e.target.result), { type:'array' });
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval:'' });
      const res = handleImport(importTarget, rows);
      saveDB(); render();
      showImportResult(importTarget, res);
    }catch(err){ toast('导入失败：' + err.message, 'err'); }
  };
  fr.readAsArrayBuffer(file);
});
function handleImport(page, rows){
  const items = [];
  let added = 0, updated = 0, skipped = 0, failed = 0;
  const push = (rw, status, note) => {
    const base = page === 'inventory'
      ? { 货号: pick(rw,['货号']), 颜色: pick(rw,['颜色']), 店铺: pick(rw,['店铺']) }
      : page === 'shipments'
      ? { 'FBA货件ID': pick(rw,['FBA货件ID','货件ID']), 'FBA仓': pick(rw,['FBA仓','仓库']), 'FBA货件名': pick(rw,['FBA货件名','货件名']), 货号: pick(rw,['货号']), 店铺: pick(rw,['店铺']) }
      : { '子ASIN': pick(rw,['子ASIN']), MSKU: pick(rw,['MSKU']), 货号: pick(rw,['货号']), 店铺: pick(rw,['店铺']) };
    items.push(Object.assign(base, { 状态: status, 说明: note }));
    if(status === '失败') failed++;
  };
  if(page === 'inventory'){
    rows.forEach(rw => {
      const sku = pick(rw, ['货号']); const color = pick(rw, ['颜色']);
      if(!sku || !color){ push(rw, '失败', !sku && !color ? '缺少货号与颜色' : (!sku ? '缺少货号' : '缺少颜色')); return; }
      const data = {
        sku, color, parent: pick(rw,['父ASIN','父体']), shop: pick(rw,['店铺']),
        fbaTotal: num(pick(rw,['FBA库存总数','FBA总数','实时FBA库存总数'])),
        fbaSellable: num(pick(rw,['FBA在售','在售库存'])),
        transit: num(pick(rw,['在途库存','在途'])),
        updatedAt: pick(rw,['时间','数据时间','更新时间']) || today()
      };
      const ex = DB.inventory.find(x => x.sku === sku && x.color === color);
      if(ex){
        if(data.updatedAt >= (ex.updatedAt || '')){ Object.assign(ex, data); updated++; push(rw, '成功', '按最新时间覆盖更新'); }
        else { skipped++; push(rw, '跳过', '数据时间早于现有记录，未覆盖'); }
      } else { DB.inventory.unshift(Object.assign(newRecord(), data, { id: uid('iv') })); added++; push(rw, '成功', '新增库存记录'); }
    });
  } else if(page === 'shipments'){
    /* 严格规则：FBA货件ID 与 FBA仓 必须同时匹配同一条已有记录方可导入成功 */
    rows.forEach(rw => {
      const sid = pick(rw, ['FBA货件ID','货件ID']); const wh = pick(rw, ['FBA仓','仓库']);
      if(!sid || !wh){ push(rw, '失败', !sid && !wh ? '缺少FBA货件ID与FBA仓' : (!sid ? '缺少FBA货件ID' : '缺少FBA仓')); return; }
      const ex = DB.shipments.find(x => x.shipmentId === sid && x.warehouse === wh);
      if(!ex){ push(rw, '失败', '未找到FBA货件ID与FBA仓同时匹配的记录'); return; }
      Object.assign(ex, {
        shop: pick(rw,['店铺']) || ex.shop,
        createdAt: (pick(rw,['创建时间']).replace(' ','T') || ex.createdAt),
        sku: pick(rw,['货号']) || ex.sku, parent: pick(rw,['父ASIN']) || ex.parent,
        name: pick(rw,['FBA货件名','货件名']) || ex.name,
        method: pick(rw,['货代方式','物流方式']) || ex.method,
        depart: pick(rw,['离港时间','离港']).slice(0,10) || ex.depart,
        arrive: pick(rw,['到港时间','到港']).slice(0,10) || ex.arrive,
        winStart: pick(rw,['预计送达时段开始','送达时段开始','时段开始']).slice(0,10) || ex.winStart,
        winEnd: pick(rw,['预计送达时段结束','送达时段结束','时段结束']).slice(0,10) || ex.winEnd,
        delivered: pick(rw,['送达时间','送达']).slice(0,10)
      });
      updated++; push(rw, '成功', 'FBA货件ID与FBA仓同时匹配，已覆盖更新');
    });
  } else if(page === 'skus'){
    /* 严格规则：子ASIN 与 MSKU 必须同时匹配同一条已有记录方可导入成功 */
    rows.forEach(rw => {
      const ca = pick(rw, ['子ASIN']); const msku = pick(rw, ['MSKU']);
      if(!ca || !msku){ push(rw, '失败', !ca && !msku ? '缺少子ASIN与MSKU' : (!ca ? '缺少子ASIN' : '缺少MSKU')); return; }
      const ex = DB.skus.find(x => x.childAsin === ca && x.msku === msku);
      if(!ex){ push(rw, '失败', '未找到子ASIN与MSKU同时匹配的记录'); return; }
      Object.assign(ex, {
        shop: pick(rw,['店铺']) || ex.shop, parent: pick(rw,['父ASIN','父体']) || ex.parent,
        color: pick(rw,['颜色']), img: pick(rw,['产品图片','图片']),
        fbaQty: num(pick(rw,['FBA库存数量','FBA库存'])),
        sku: pick(rw,['货号']) || ex.sku, type: pick(rw,['产品类型']) || ex.type
      });
      updated++; push(rw, '成功', '子ASIN与MSKU同时匹配，已覆盖更新');
    });
  }
  return { added, updated, skipped, failed, items };
}
/* 导入结果回传弹窗：失败行标红，可下载结果表格 */
function showImportResult(page, res){
  lastImportResult = { page, res };
  const cols = res.items.length ? Object.keys(res.items[0]) : [];
  const rowsHtml = res.items.map(it => {
    const cls = it['状态'] === '失败' ? 'imp-fail' : (it['状态'] === '跳过' ? 'imp-skip' : '');
    return `<tr class="${cls}">${cols.map(c => `<td>${esc(String(it[c] === undefined ? '' : it[c]))}</td>`).join('')}</tr>`;
  }).join('') || `<tr><td colspan="${cols.length || 1}"><div class="empty">未解析到数据行</div></td></tr>`;
  const root = document.getElementById('modalRoot');
  root.innerHTML = `
  <div class="overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal xl">
      <div class="modal-head"><h3>导入结果回传 · ${{inventory:'产品库存', shipments:'FBA货件', skus:'具体产品情况'}[page] || ''}</h3>
        <button class="modal-close" onclick="closeModal()">✕</button></div>
      <div class="modal-body">
        <div class="imp-sum">
          <span class="tag ok">成功 ${res.added + res.updated} 条${res.added ? '（新增' + res.added + ' / 更新' + res.updated + '）' : ''}</span>
          ${res.failed ? `<span class="tag err">失败 ${res.failed} 条</span>` : ''}
          ${res.skipped ? `<span class="tag gray">跳过 ${res.skipped} 条</span>` : ''}
          <span class="tag gray">合计 ${res.items.length} 条</span>
        </div>
        <div class="imp-wrap">
          <table class="imp-tbl">
            <thead><tr>${cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr></thead>
            <tbody>${rowsHtml}</tbody>
          </table>
        </div>
        ${res.failed ? '<p class="imp-note"><b>红底行</b>为导入失败记录：' + (page === 'skus' ? '子ASIN与MSKU需同时匹配已有数据方可导入成功，请核对后修正再导入。' : page === 'shipments' ? 'FBA货件ID与FBA仓需同时匹配已有数据方可导入成功，请核对后修正再导入。' : '请核对唯一标识字段后重试。') + '</p>' : '<p class="imp-note">全部导入成功 🎉</p>'}
      </div>
      <div class="modal-foot">
        <button class="btn ghost" onclick="closeModal()">关闭</button>
        <button class="btn" onclick="downloadImportResult()">⬇ 下载结果表格</button>
      </div>
    </div></div>`;
}
/* 下载导入结果表格（.xls 格式，Excel/WPS 可直接打开，失败行保留红色标记） */
function downloadImportResult(){
  if(!lastImportResult){ toast('暂无导入结果', 'err'); return; }
  const { page, res } = lastImportResult;
  const cols = res.items.length ? Object.keys(res.items[0]) : [];
  const escCell = v => esc(String(v === undefined ? '' : v));
  const html = '\ufeff<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel"><head><meta charset="utf-8"><style>td,th{border:1px solid #ccc;padding:4px 8px;font-size:12px}</style></head><body>'
    + '<table><thead><tr>' + cols.map(c => `<th>${escCell(c)}</th>`).join('') + '</tr></thead><tbody>'
    + res.items.map(it => {
        const fail = it['状态'] === '失败';
        return `<tr${fail ? ' style="background:#fde7e4;color:#c05648;font-weight:600"' : ''}>` + cols.map(c => `<td>${escCell(it[c])}</td>`).join('') + '</tr>';
      }).join('')
    + '</tbody></table></body></html>';
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([html], { type:'application/vnd.ms-excel' }));
  const d = new Date(); const p2 = n => String(n).padStart(2, '0');
  a.download = `导入结果_${page}_${d.getFullYear()}${p2(d.getMonth()+1)}${p2(d.getDate())}_${p2(d.getHours())}${p2(d.getMinutes())}.xls`;
  a.click();
  toast(res.failed ? '结果表格已下载（失败行标红）' : '结果表格已下载', 'ok');
}

/* ================= 用户登录 ================= */
let loginMode = 'login'; // login | register
function showLogin(){
  const hasUser = Object.keys(getUsers()).length > 0;
  loginMode = hasUser ? 'login' : 'register';
  document.getElementById('loginRoot').hidden = false;
  drawLogin();
}
function drawLogin(){
  const hasUser = Object.keys(getUsers()).length > 0;
  if(!hasUser) loginMode = 'register';
  const reg = loginMode === 'register';
  const root = document.getElementById('loginRoot');
  root.innerHTML = `
  <div class="login-card">
    <div class="login-brand">
      <div class="brand-icon">A</div>
      <h1>亚马逊运营工作台</h1>
      <p>全链路数据一站管理 · 各账号数据独立互不共享</p>
    </div>
    <div class="login-tabs">
      <button type="button" class="ltab ${!reg ? 'on' : ''}" onclick="setLoginMode('login')">账号登录</button>
      <button type="button" class="ltab ${reg ? 'on' : ''}" onclick="setLoginMode('register')">注册新用户</button>
    </div>
    <form onsubmit="loginSubmit(event)">
      <div class="login-field"><label>用户名</label><input id="lgUser" autocomplete="username" maxlength="20" placeholder="请输入用户名"></div>
      <div class="login-field"><label>密码</label><input id="lgPass" type="password" autocomplete="current-password" maxlength="32" placeholder="请输入密码"></div>
      ${reg ? `<div class="login-field"><label>确认密码</label><input id="lgPass2" type="password" maxlength="32" placeholder="请再次输入密码"></div>` : ''}
      <div class="login-err" id="lgErr"></div>
      <button class="btn login-btn" type="submit">${reg ? '注册并进入' : '登 录'}</button>
    </form>
    <p class="login-tip">${reg && !hasUser ? '首位注册用户将自动继承当前已有数据；' : ''}注册后拥有独立数据空间，不同账号之间数据不共享</p>
  </div>`;
  setTimeout(() => { const el = document.getElementById('lgUser'); if(el && el.focus) el.focus(); }, 60);
}
function setLoginMode(m){ loginMode = m; drawLogin(); }
function lgErr(msg){ const el = document.getElementById('lgErr'); if(el) el.textContent = msg || ''; }
function loginSubmit(ev){
  if(ev && ev.preventDefault) ev.preventDefault();
  const name = (document.getElementById('lgUser').value || '').trim();
  const pw = document.getElementById('lgPass').value || '';
  lgErr('');
  if(!name){ lgErr('请输入用户名'); return; }
  if(/\s/.test(name)){ lgErr('用户名不能包含空格'); return; }
  if(!pw){ lgErr('请输入密码'); return; }
  if(loginMode === 'register'){
    if(pw.length < 4){ lgErr('密码至少 4 位'); return; }
    const pw2 = document.getElementById('lgPass2').value || '';
    if(pw !== pw2){ lgErr('两次输入的密码不一致'); return; }
    const users = getUsers();
    if(users[name]){ lgErr('该用户名已被注册，请更换或改为登录'); return; }
    const salt = uid('s');
    users[name] = { salt, hash: hashPwd(pw, salt), createdAt: nowDT() };
    saveUsers(users);
    migrateLegacyData(name); // 首位注册用户继承旧版数据
    enterUser(name, { silent: true });
    const h = location.hash.slice(1);
    if(NAV.some(n => n.key === h)) S.page = h;
    render();
    toast('注册成功，欢迎 ' + name, 'ok');
  } else {
    const u = getUsers()[name];
    if(!u || hashPwd(pw, u.salt) !== u.hash){ lgErr('用户名或密码错误'); return; }
    enterUser(name);
  }
}
function enterUser(name, opts){
  opts = opts || {};
  S.user = name;
  try { localStorage.setItem(SESSION_KEY, name); } catch(e){}
  loadUserSettings();
  loadDB();
  const th = localStorage.getItem(ukey('theme'));
  document.documentElement.setAttribute('data-theme', th || 'forest');
  document.getElementById('loginRoot').hidden = true;
  updateAvatar();
  if(!opts.silent){
    S.page = 'home';
    const h = location.hash.slice(1);
    if(NAV.some(n => n.key === h)) S.page = h;
    render();
    toast('欢迎回来，' + name, 'ok');
  }
}
function updateAvatar(){
  const c = document.getElementById('avatarCircle');
  const n = document.getElementById('avatarName');
  const r = document.getElementById('avatarRole');
  if(c) c.textContent = (S.user || '访').slice(0, 1);
  if(n) n.textContent = S.user || '未登录';
  if(r) r.textContent = S.user ? '已登录 · 独立数据空间' : '亚马逊运营';
}
function logout(){
  if(!confirm('确定退出当前账号？\n数据已自动保存，下次登录可继续使用。')) return;
  try { localStorage.removeItem(SESSION_KEY); } catch(e){}
  S.user = null; DB = null; S.page = 'home'; S.q = {}; S.remCol = {}; S.sort = {}; S.cols = {}; S.remOrder = null;
  try { document.getElementById('modalRoot').innerHTML = ''; } catch(e){}
  closeDrawer();
  showLogin();
}

/* ================= 启动 ================= */
(function boot(){
  const sess = localStorage.getItem(SESSION_KEY);
  if(sess && getUsers()[sess]) enterUser(sess, { silent: true });
  else { showLogin(); return; }
  const _h = location.hash.slice(1);
  if(NAV.some(n => n.key === _h)) S.page = _h;
  render();
})();
window.addEventListener('hashchange', () => { if(!S.user) return; const h = location.hash.slice(1); if(NAV.some(n => n.key === h) && h !== S.page){ S.page = h; closeDrawer(); render(); } });
window.addEventListener('resize', () => { if(window.innerWidth > 900) closeDrawer(); });
</script>

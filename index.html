/* 表格增强：应用用户自定义列顺序 + 注入 data-label（手机端卡片字段名）+ 挂载点击排序与列拖拽 */
function enhanceTables(){
  const mobile = isMobileLayout();
  document.querySelectorAll('table.tbl').forEach(tb => {
    if(tb.closest && tb.closest('.overlay, #modalRoot')) return; // 弹窗内明细表不参与
    const headRow = tb.querySelector('thead tr');
    if(!headRow) return;
    const ths = [...headRow.children].filter(x => x.tagName === 'TH');
    if(!ths.length) return;
    // 原始列名单独记录：排序箭头写在 innerHTML 里，不能反过来污染列标签
    ths.forEach(th => { if(!th.dataset.origLbl) th.dataset.origLbl = th.textContent.trim(); });
    const orig = ths.map(th => th.dataset.origLbl); // 本次渲染的默认列顺序（冻结为基准）
    let labels = orig;
    const order = S.cols[S.page];
    if(order && order.length){
      // 应用用户拖拽的列顺序；新增列自动追加到末尾，已删除列自动忽略
      labels = order.filter(l => orig.includes(l)).concat(orig.filter(l => !order.includes(l)));
      const map = labels.map(l => orig.indexOf(l));
      const hc = [...headRow.children];
      map.forEach(oi => headRow.appendChild(hc[oi])); // 按新顺序重排表头
      const tbody0 = tb.querySelector('tbody');
      if(tbody0){
        for(let i = 0; i < tbody0.rows.length; i++){
          const tr = tbody0.rows[i];
          if(tr.cells.length !== orig.length) continue; // 汇总/空行跳过
          const cs = [...tr.cells];
          map.forEach(oi => tr.appendChild(cs[oi])); // 单元格同步重排
        }
      }
    }
    const thNow = [...headRow.children].filter(x => x.tagName === 'TH');
    thNow.forEach((th, ci) => {
      th.dataset.lbl = labels[ci];
      if(labels[ci] === '操作'){ th.removeAttribute('draggable'); th.onclick = null; return; } // 操作列固定不参与
      th.classList.add('sortable');
      th.title = '点击：按该字段排序（升 → 降 → 取消）；拖动：调整该列前后位置';
      th.setAttribute('draggable', 'true');
      th.onclick = () => { if(colJustDropped){ colJustDropped = false; return; } sortTableClick(S.page, ci); };
      th.ondragstart = e => colDragStart(e, labels[ci]);
      th.ondragover = e => colDragOver(e, th);
      th.ondragleave = () => { th.classList.remove('drop-before', 'drop-after'); };
      th.ondrop = e => colDrop(e, th);
    });
    // 移动端卡片布局才需要字段名标签；桌面端跳过，可省去整表数万次属性写入
    const tbody = tb.querySelector('tbody');
    if(tbody && mobile){
      // 长文本 / 复合内容字段在双列卡片里占满整行，短字段两两并排（仅影响排版，不涉及数据）
      const LONG_COL = /备注|要求|内容|说明|颜色|关键词|搜索词|完成状态|规格|面料|标题|文案|链接|操作|记录|时段|地址|描述|调整|活动|计划|明细|图片组/;
      // 各模块的业务主键作为卡片标题，比机械地用"第一列"更直观
      const TITLE_COL = { products:'货号', promotions:'父ASIN', sampling:'货号', ads:'父ASIN', creators:'父ASIN',
        inventory:'父ASIN', shipments:'FBA货件ID', factory:'货号', skus:'父ASIN', trash:'数据摘要' };
      let titleIdx = labels.indexOf(TITLE_COL[S.page]);
      if(titleIdx < 0) titleIdx = 0;
      for(let i = 0; i < tbody.rows.length; i++){
        const tr = tbody.rows[i];
        if(tr.cells.length !== labels.length) continue;
        for(let c = 0; c < tr.cells.length; c++){
          const td = tr.cells[c];
          if(td.tagName !== 'TD' || !labels[c]) continue;
          td.dataset.label = labels[c];
          if(c === titleIdx){ td.classList.add('m-card-title'); continue; }
          const raw = td.textContent.trim();
          const hasControl = td.querySelector('input,button,textarea,select,.term-list,.color-cells,.act-mini,.thumb,.tag,.chip,.btn,.link-btn,.mini-btn');
          // 纯空值字段保持半列，两两并排，避免为「—」单独占一整行
          if(!hasControl && (raw === '' || raw === '—' || raw === '-' || raw === '未设置' || raw === '暂无数据')) continue;
          const complex = td.querySelector('.color-cells,.term-list,.act-mini,.chip,.tag,.link-btn,.mini-btn,.btn,.grp-in,.sku-node-in');
          if(LONG_COL.test(labels[c]) || raw.length > 22 || complex) td.classList.add('m-wide');
          // 只有真正的「操作」列才做按钮两列排布；含日期输入/词条列表的复合列一律保持原结构
          if(labels[c] === '操作') td.classList.add('m-ops');
        }
      }
    }
    const st = S.sort[S.page];
    if(st && thNow[st.col] && labels[st.col] !== '操作'){ markSortTh(tb, st); applyTableSort(tb, st.col, st.dir); }
  });
}
/* ===== 列拖拽（所有业务模块通用）===== */
let dragColFrom = null, colJustDropped = false;
function colDragStart(e, lbl){
  dragColFrom = lbl;
  e.dataTransfer.effectAllowed = 'move';
  try{ e.dataTransfer.setData('text/plain', lbl); }catch(err){}
}
function colDragOver(e, th){
  if(!dragColFrom || !th || th.dataset.lbl === '操作' || th.dataset.lbl === dragColFrom) return;
  e.preventDefault(); e.dataTransfer.dropEffect = 'move';
  const r = th.getBoundingClientRect();
  th.classList.toggle('drop-before', (e.clientX - r.left) <= r.width / 2);
  th.classList.toggle('drop-after', (e.clientX - r.left) > r.width / 2);
}
function colDrop(e, th){
  e.preventDefault();
  th.classList.remove('drop-before', 'drop-after');
  const from = dragColFrom; dragColFrom = null;
  if(!from || !th || th.dataset.lbl === from || th.dataset.lbl === '操作') return;
  const tb = th.closest('table');
  const labels = [...tb.querySelectorAll('thead th')].map(t => t.dataset.lbl);
  const r = th.getBoundingClientRect();
  const after = (e.clientX - r.left) > r.width / 2; // 落点在目标列左半：插到其前；右半：插到其后
  const next = colReorder(labels, from, th.dataset.lbl, after);
  if(!next) return;
  S.cols[S.page] = next;
  delete S.sort[S.page]; saveSort(); // 列序变化后旧排序索引失效，清除
  saveCols();
  colJustDropped = true; // 防止部分浏览器拖放后再触发一次点击排序
  setTimeout(() => { colJustDropped = false; }, 300);
  render();
}
function colReorder(labels, from, to, after){
  if(from === to) return null;
  const arr = labels.slice();
  const fi = arr.indexOf(from);
  if(fi < 0) return null; // 源不存在（列已删除），不处理
  arr.splice(fi, 1);
  const ti = arr.indexOf(to);
  if(ti < 0) return null;
  arr.splice(after ? ti + 1 : ti, 0, from);
  return arr;
}
/* 排序三态切换：升 → 降 → 取消（取消后恢复模块默认排序） */
function sortTableClick(key, ci){
  const st = S.sort[key];
  if(st && st.col === ci){
    if(st.dir === 1) S.sort[key] = { col: ci, dir: -1 };
    else { delete S.sort[key]; saveSort(); render(); return; }
  } else S.sort[key] = { col: ci, dir: 1 };
  saveSort(); render();
}
function markSortTh(tb, st){
  [...tb.querySelectorAll('thead th')].forEach((th, i) => {
    th.innerHTML = th.dataset.lbl + (i === st.col ? `<span class="sort-ar">${st.dir === 1 ? '↑' : '↓'}</span>` : '');
  });
}
/* 基于单元格文本的数值感知排序，空值恒排最后 */
function applyTableSort(tb, col, dir){
  const tbody = tb.querySelector('tbody'); if(!tbody) return;
  const ths = tb.querySelectorAll('thead th').length;
  // 分组标题行（父ASIN 分组）是排序边界：组内排序，绝不打散分组
  const blocks = []; let cur = null;
  for(let i = 0; i < tbody.rows.length; i++){
    const tr = tbody.rows[i];
    const band = tr.classList && tr.classList.contains('grp-row');
    if(band || tr.cells.length !== ths){ cur = null; blocks.push({ keep: tr, rows: [] }); continue; }
    if(!cur){ cur = { keep: null, rows: [] }; blocks.push(cur); }
    cur.rows.push(tr);
  }
  const coll = new Intl.Collator('zh', { numeric: true, sensitivity: 'base' });
  const val = tr => { const c = tr.cells[col]; return c ? (c.textContent || '').trim() : ''; };
  blocks.forEach(b => {
    if(b.rows.length < 2) return;
    b.rows.sort((a, c) => {
      const va = val(a), vb = val(c);
      if(!va && !vb) return 0;
      if(!va) return 1; if(!vb) return -1;
      return dir * coll.compare(va, vb);
    });
  });
  blocks.forEach(b => {
    if(b.keep) tbody.appendChild(b.keep);
    b.rows.forEach(r => tbody.appendChild(r));
  });
}
function keepFocus(){
  const i = document.getElementById('searchBox');

/* 搜索防抖：中文输入法组词中不重绘，且渲染时保留原输入框节点，避免 IME 组合被打断导致闪烁 */
let searchTimer = null;

/* 中文输入法保护：Chromium/WebKit 不支持 oncompositionstart 内联属性，

/* ================= 图片字段：链接 / 本地文件上传 ================= */
const IMG_STATE = {}; // key -> { mode:'url'|'local', url, data, name, ids }
const isDataImg = v => /^data:image\//i.test(String(v || ''));
function imgReg(key, val, ids){
  IMG_STATE[key] = {
    mode: isDataImg(val) ? 'local' : 'url',
    url: isDataImg(val) ? '' : (val || ''),
    data: isDataImg(val) ? val : '',
    name: isDataImg(val) ? '已上传本地图片' : '',
    ids: ids || {}
  };
  return IMG_STATE[key];
}
function imgVal(key){
  const st = IMG_STATE[key];
  if(!st) return '';
  return st.mode === 'local' ? (st.data || '') : (st.url || '');
}
function syncImg(key){
  const st = IMG_STATE[key]; if(!st) return;
  const v = imgVal(key);
  const $ = id => id ? document.getElementById(id) : null;
  const hid = $(st.ids.val); if(hid) hid.value = v;
  const pv = $(st.ids.prev);
  if(pv){
    if(v){ pv.style.backgroundImage = "url('" + v + "')"; if(pv.classList) pv.classList.remove('empty'); pv.textContent = ''; }
    else { pv.style.backgroundImage = ''; if(pv.classList) pv.classList.add('empty'); pv.textContent = '🖼'; }
  }
  const ui = $(st.ids.url); if(ui) ui.hidden = st.mode !== 'url';
  const lc = $(st.ids.local); if(lc) lc.hidden = st.mode !== 'local';
  const tb = $(st.ids.tabUrl), tl = $(st.ids.tabLocal);
  if(tb && tb.classList) tb.classList.toggle('on', st.mode === 'url');
  if(tl && tl.classList) tl.classList.toggle('on', st.mode === 'local');
  const tg = $(st.ids.tag); if(tg) tg.textContent = st.mode === 'local' ? '本地图片' : (st.url ? '链接图片' : '未设置');
  const fn = $(st.ids.file); if(fn) fn.textContent = st.name || '支持 JPG / PNG / WebP，自动压缩';
  const pk = $(st.ids.pick); if(pk) pk.textContent = st.name ? '重新选择' : '选择本地图片';
}
/* 通用图片字段：图片链接输入 + 本地上传，隐藏域承载最终值 */
function imgf(key, label, val, opts){

        <button type="button" class="itab ${st.mode === 'local' ? 'on' : ''}" id="imgfTabL_${key}" onclick="imgfMode('${key}','local')">本地图片</button>

function imgfMode(key, mode){
  const st = IMG_STATE[key]; if(!st) return;

function imgfUrlInput(key, el){

/* 产品编辑器颜色行的紧凑图片组 */
function peImgUrl(i, el){

function peImgMode(i){

/* 文件选择与压缩 */
let imgPickKey = null;
function pickImage(key){
  imgPickKey = key;

  if(!inp) return;
  try { inp.value = ''; } catch(e){}

function onImgFilePicked(input){
  const f = input.files && input.files[0];
  const key = imgPickKey;
  if(!f || !key) return;
  if(!/^image\//.test(f.type || '')){ toast('请选择图片文件（JPG / PNG / WebP）', 'err'); return; }
  if(f.size > 15 * 1024 * 1024){ toast('图片超过 15MB，请先压缩后再上传', 'err'); return; }
  const fr = new FileReader();
  fr.onload = () => {

      if(str.length > 500 * 1024){ toast('图片压缩后仍约 ' + kb + 'KB，超过 500KB 上限，请改用图片链接', 'err'); return; }
      // 图片总量预算：本地存储上限约 5M，图片应留出足够空间给业务数据
      if(imgUsageChars() + str.length > 1250000){ toast('本地图片总量已接近上限（约 1200K），请改用图片链接，或在账户设置里归档清理历史数据', 'err'); return; }
      if(usageChars() + str.length > LS_LIMIT * 0.9){ toast('本地存储空间不足，无法保存该图片，请改用图片链接', 'err'); return; }
      st.mode = 'local'; st.data = str; st.name = f.name + '（约 ' + kb + 'KB）';
      syncImg(key);
      toast('图片已上传（约 ' + kb + 'KB），保存后生效', 'ok');
      if(kb > 350) toast('图片偏大，建议改用图片链接以节省本地存储', 'err');
    });
  };
  fr.onerror = () => toast('图片读取失败，请重试', 'err');
  fr.readAsDataURL(f);
}
function compressImage(src, maxSide, quality, cb){
  try {
    const im = new Image();
    im.onload = () => {
      try {
        let w = im.width, h = im.height;
        const sc = Math.min(1, maxSide / Math.max(w, h));
        w = Math.max(1, Math.round(w * sc)); h = Math.max(1, Math.round(h * sc));
        const cv = document.createElement('canvas');
        cv.width = w; cv.height = h;
        cv.getContext('2d').drawImage(im, 0, 0, w, h);
        cb(cv.toDataURL('image/jpeg', quality));
      } catch(e){ cb(src); }
    };
    im.onerror = () => cb(src);
    im.src = src;
  } catch(e){ cb(src); }
}

/* 完成状态项：颜色级（每个颜色独立）+ 父ASIN级（同父体所有货号共享） */
const DONE_COLOR = [['mainImage','产品主图'],['modelImage','产品模特图']];
const DONE_PARENT = [['video','产品视频'],['influencer','网红视频'],['review','直评'],['vine','VINE']];
/* 同一父ASIN下的货号同步父体级完成状态 */
function syncParentDone(parent){
  const ps = (DB.products || []).filter(p => p.parent === parent);
  if(!ps.length) return;
  const merged = {};
  DONE_PARENT.forEach(([k]) => merged[k] = ps.some(p => p.done && p.done[k]));
  ps.forEach(p => { p.done = Object.assign({}, p.done, merged); });
}
const FLASH_TYPES = ['秒杀','Z划算']; // 开始前2天提醒的活动类型
function promoPhase(p){
  const t = usToday(); // 促销活动时间以美国时间（太平洋时区）为准
  const flash = FLASH_TYPES.includes(p.type);
  if(!p.start || !p.end) return null;
  if(t > p.end) return !flash && dayDiff(t, p.end) <= 1 ? { tag:'err', label:'已结束', remind:true } : null;
  if(t >= p.start){
    if(!flash && dayDiff(p.end, t) <= 2) return { tag:'warn', label:'即将结束', remind:true };
    return { tag:'info', label:'进行中', remind:false };
  }
  if(flash){
    const dd = dayDiff(p.start, t);
    if(dd <= 2) return { tag:'warn', label: dd === 0 ? '今日开始' : '即将开始', remind:true };
  }
  return { tag:'gray', label:'未开始', remind:false };
}
function calcReminders(){
  const t = today();
  const r = { promo:[], incomplete:[], creatorShops:{}, arrive:[], overdue:[], winNext:[], factory:[], sampling:[] };
  (DB.promotions || []).forEach(p => {
    const ph = promoPhase(p);
    if(ph && ph.remind) r.promo.push({ p, ph });
  });
  // 产品未完善：按父ASIN汇总（父体级四项），颜色级主图/模特图逐颜色列出
  const incSeen = new Set();
  (DB.products || []).forEach(p => {
    const parentKey = p.parent || '未填父ASIN';
    if(incSeen.has(parentKey)) return; // 同父体只提醒一次
    const d = p.done || {};
    const miss = [];
    DONE_PARENT.forEach(([k, n]) => { if(!d[k]) miss.push(n); });
    (p.colors || []).forEach((c, i) => {
      const cd = c.done || {};
      const cn = c.name || ('颜色' + (i + 1));
      DONE_COLOR.forEach(([k, n]) => { if(!cd[k]) miss.push(cn + n); });
    });
    if(miss.length){ incSeen.add(parentKey); r.incomplete.push({ p, miss }); }
  });
  const [ws, we] = weekRange(new Date()); const wk = weekKey(new Date());
  (DB.creators || []).forEach(c => {
    if(c.weeksDone && c.weeksDone[wk]) return;
    if(c.start && c.end && c.start <= we && c.end >= ws){
      const key = c.shop || '未填店铺';
      (r.creatorShops[key] = r.creatorShops[key] || []).push(c); // 以店铺为维度汇总
    }
  });
  (DB.shipments || []).forEach(s => {
    if(s.delivered || !s.arrive) return;
    const dd = dayDiff(s.arrive, t);
    if(dd >= 0 && dd <= 3) r.arrive.push({ s, label: dd === 0 ? '今日到港' : dd + '天后到港', cls:'warn' });
    else if(s.arrive < t) r.overdue.push(s); // 到港未送达，独立提醒
  });
  /* 送达时段在下周且未填写送达日期 → 每日提醒（时段以周日至下周六为一周）；
     「标记本周完成」后当周不再提醒（winDone 按周记录，跨周未填写会重新提醒） */
  const [nws, nwe] = nextSunWeek();
  const wkNow = weekKey(new Date());
  DB.shipments = DB.shipments || [];
  DB.shipments.forEach(s => {
    if(s.delivered || !s.winStart) return;
    if(s.winDone && s.winDone[wkNow]) return; // 本周已标记完成，不再提醒
    if(s.winStart >= nws && s.winStart <= nwe) r.winNext.push({ s, winLabel: winFmt(s) });
  });
  (DB.factoryOrders || []).forEach(o => { if(!o.shippedAt) r.factory.push(o); });
  /* 新开发样鞋：未填写完成时间 → 每日提醒，按开发时间正序 */
  r.sampling = (DB.sampling || []).filter(s => !s.doneAt)
    .sort((a, b) => String(a.createdAt || '').localeCompare(String(b.createdAt || '')));
  return r;
}

/* ===== 首页提醒卡片拖拽换序 ===== */
let dragRemFrom = null;
function remDragStart(e, key){
  dragRemFrom = key;
  e.dataTransfer.effectAllowed = 'move';
  try{
    e.dataTransfer.setData('text/plain', key);
    const cardEl = e.target.closest('.rem-card');
    if(cardEl) e.dataTransfer.setDragImage(cardEl, 20, 20); // 拖动整卡影像
  }catch(err){}
}
function remDragOver(e){
  if(!dragRemFrom) return;
  e.preventDefault(); e.dataTransfer.dropEffect = 'move';
}
function remDrop(e){
  e.preventDefault();
  const from = dragRemFrom; dragRemFrom = null;
  const cardEl = e.target.closest('.rem-card');
  if(!from || !cardEl || cardEl.dataset.remkey === from) return;
  const cur = [...document.querySelectorAll('.rem-card')].map(el => el.dataset.remkey);
  const r = cardEl.getBoundingClientRect();
  const after = (e.clientY - r.top) > r.height / 2; // 上半：插其前；下半：插其后
  S.remOrder = remReorder(cur, from, cardEl.dataset.remkey, after);
  saveRemOrder(); render();
}
function remReorder(keys, from, to, after){
  if(from === to) return keys;
  const arr = keys.slice();
  const fi = arr.indexOf(from);
  if(fi < 0) return keys; // 源不存在，兜底不处理
  arr.splice(fi, 1);
  const ti = arr.indexOf(to);
  if(ti < 0) return arr;

/* 删除整个父ASIN汇总：产品 + 促销/广告/创作者/库存 一并移除（均进入回收站，可逐条恢复） */
function delParent(parent){
  if(!parent){ toast('该分组未填写父ASIN，请先编辑产品补充父ASIN', 'err'); return; }
  const prods = DB.products.filter(p => p.parent === parent);
  if(!prods.length) return;
  const cnt = k => (DB[k] || []).filter(r => r.parent === parent).length;
  const n = { promotions: cnt('promotions'), ads: cnt('ads'), creators: cnt('creators'), skus: cnt('skus') };
  const total = prods.length + n.promotions + n.ads + n.creators + n.skus;
  confirmModal(`确定删除父ASIN「${parent}」的汇总数据吗？\n将同时删除：产品 ${prods.length} 个货号、促销活动 ${n.promotions} 条、广告数据 ${n.ads} 条、创作者计划 ${n.creators} 条、具体产品/库存记录 ${n.skus} 条，共 ${total} 条。\n删除后可在「回收站」保留 ${TRASH_DAYS} 天，期间可逐条恢复。`, () => {
    let moved = 0;
    prods.forEach(p => { if(moveToTrash('products', p.id)) moved++; });
    ['promotions','ads','creators','skus'].forEach(k => {
      (DB[k] || []).filter(r => r.parent === parent).forEach(r => { if(moveToTrash(k, r.id)) moved++; });
    });
    saveDB();
    toast('已删除父ASIN「' + parent + '」共 ' + moved + ' 条数据，可在回收站恢复', 'ok');
    render();
  }, '删除整个父ASIN');
}

/* 产品唯一性校验（货号⟷产品类型 1:1、父ASIN⟷店铺 1:1、父ASIN下货号唯一），返回错误文案或空串 */
function validateProduct(p, excludeId){
  if(!p.sku) return '请填写货号';
  if(!p.parent) return '请填写父ASIN';
  if(!p.type) return '请填写产品类型';
  if(!p.shop) return '请填写店铺';
  const confType = DB.products.find(x => x.id !== excludeId && x.sku === p.sku && x.type && x.type !== p.type);
  if(confType) return '货号「' + p.sku + '」已对应产品类型「' + confType.type + '」，同一货号的产品类型须保持一致';
  const pShop = shopOfParent(p.parent);
  if(pShop && p.shop && pShop !== p.shop){
    const others = DB.products.filter(x => x.id !== excludeId && x.parent === p.parent && x.shop === pShop).length;
    if(others > 0) return '父ASIN「' + p.parent + '」已属于店铺「' + pShop + '」，父ASIN与店铺必须一一对应';
  }
  if(DB.products.some(x => x.id !== excludeId && x.sku === p.sku && x.parent === p.parent))
    return '父ASIN「' + p.parent + '」下已存在货号「' + p.sku + '」';
  return '';
}
/* 整体复制执行体（copyProduct 弹窗与自动化测试共用） */
function doCopyProduct(src, opt){
  opt = opt || {};
  const np = String(opt.parent || '').trim();
  if(!np) return { ok:false, err:'请填写新父ASIN' };
  if(np === src.parent) return { ok:false, err:'新父ASIN不能与原父ASIN相同' };
  const nsku = String(opt.sku || '').trim() || src.sku;
  const existShop = shopOfParent(np);
  const shop = existShop || String(opt.shop || '').trim();
  if(!shop) return { ok:false, err:'该父ASIN暂无店铺信息，请填写店铺' };
  if(existShop && String(opt.shop || '').trim() && existShop !== String(opt.shop).trim())
    return { ok:false, err:'父ASIN「' + np + '」已属于店铺「' + existShop + '」' };
  const cand = { sku:nsku, parent:np, type:src.type, shop, id:null };
  const vErr = validateProduct(cand, null);
  if(vErr) return { ok:false, err:vErr };
  const copy = JSON.parse(JSON.stringify(src));
  copy.id = uid('p'); copy.createdAt = nowDT();
  copy.parent = np; copy.sku = nsku; copy.shop = shop;
  copy.colors = (src.colors || []).map(cl => Object.assign({}, cl));
  copy.adjustments = (src.adjustments || []).map(a => Object.assign({}, a));
  DB.products.unshift(copy);
  invalidateIdx();
  return { ok:true, copy };
}
/* 批量创建促销活动执行体（pbSave 弹窗与自动化测试共用），返回创建条数 */
function promoBatchCreate(type, parents, content, start, end){

      id: uid('pr'), type, parent, sku: '',

}

function peSyncDom(){
  const root = document.getElementById('modalRoot');
  const g = n => { const el = root.querySelector(`[name="${n}"]`); return el ? el.value.trim() : ''; };
  PE.p.sku = g('sku'); PE.p.type = g('type'); PE.p.shop = g('shop'); PE.p.parent = g('parent');
  PE.p.spec = { craft:g('craft'), box:g('box'), weight:g('weight'), carton:g('carton') };
  root.querySelectorAll('.pe-cn').forEach(el => PE.p.colors[+el.dataset.i].name = el.value.trim());
  root.querySelectorAll('.pe-ci').forEach(el => PE.p.colors[+el.dataset.i].img = el.value.trim());
  root.querySelectorAll('.pe-cf').forEach(el => PE.p.colors[+el.dataset.i].fabric = el.value.trim());
  PE.p.colors.forEach((c, i) => { c.done = c.done || {}; DONE_COLOR.forEach(([k]) => c.done[k] = false); });
  root.querySelectorAll('.pe-cdone').forEach(el => { PE.p.colors[+el.dataset.i].done[el.dataset.k] = el.value === '是'; });
  const adRows = [...root.querySelectorAll('.pe-ad')];
  adRows.forEach((el, idx) => { const i = +el.dataset.i; PE.p.adjustments[i].date = el.value; PE.p.adjustments[i].content = root.querySelector(`.pe-ac[data-i="${i}"]`).value.trim(); });
  DONE_PARENT.forEach(([k]) => PE.p.done[k] = g('done_' + k) === '是');
}
function peAddColor(){ peSyncDom(); PE.p.colors.push({ name:'', img:'', fabric:'', done:{ mainImage:false, modelImage:false } }); drawProductEditor(); }
function peDelColor(i){ peSyncDom(); PE.p.colors.splice(i, 1); drawProductEditor(); }
function peAddAdj(){ peSyncDom(); PE.p.adjustments.push({ date: today(), content:'' }); drawProductEditor(); }
function peDelAdj(date, i){ peSyncDom(); PE.p.adjustments.splice(i, 1); drawProductEditor(); }
function peSave(){
  peSyncDom();
  const p = PE.p;
  const old = DB.products.find(x => x.id === p.id) || null;
  const oldParent = old ? (old.parent || '') : '';
  const oldSku = old ? (old.sku || '') : '';
  const renaming = !!(oldParent && oldParent !== p.parent);
  const vErr = validateProduct(p, p.id);
  if(vErr){ toast(vErr, 'err'); return false; }
  p.adjustments = p.adjustments.filter(a => a.date || a.content)
    .sort((a,b) => (b.date||'').localeCompare(a.date||'')); // 日期倒序
  // 父ASIN 变更：整个父体（产品 + 各模块关联数据）一起迁移
  if(renaming) renameParentEverywhere(oldParent, p.parent, p.shop);
  // 货号变更：只同步本父体下的关联记录
  if(old && oldSku && oldSku !== p.sku) propagateSkuRename(oldSku, p.sku, p.parent);
  const exist = DB.products.findIndex(x => x.id === p.id);
  if(exist >= 0) DB.products[exist] = p; else DB.products.unshift(p);
  // 同一父体的店铺保持一致（父ASIN + 店铺 唯一）
  if(!renaming && old && old.shop !== p.shop) DB.products.forEach(x => { if(x.parent === p.parent) x.shop = p.shop; });
  invalidateIdx();
  propagateProductMeta(p);
  syncShopByParent();
  syncParentDone(p.parent); // 父ASIN级完成状态同步整个父体
  saveDB(); toast('已保存，父ASIN相关数据已同步', 'ok'); render(); closeModal();
}

function shipStatus(s){
  const t = today();
  if(s.delivered) return '<span class="tag ok">已送达</span>';
  if(s.arrive){
    const dd = dayDiff(s.arrive, t);
    if(s.arrive < t) return `<span class="tag err">超${Math.abs(dd)}天未送达</span>`;
    if(dd <= 3) return `<span class="tag warn">${dd === 0 ? '今日到港' : dd + '天后到港'}</span>`;
  }
  return '<span class="tag info">运输中</span>';
}
function renderShipments(c){

  const list = listCap(DB.shipments.filter(r => matchQ(q, r.parent, r.sku, r.shop, r.shipmentId, r.name, r.warehouse, r.method, r.note, r.winStart, r.winEnd, winFmt(r)))
    .sort((a,b) => { // 创建时间倒序；同一天创建且货件名相同的相邻展示
      const da = String(a.createdAt||'').slice(0,10), db = String(b.createdAt||'').slice(0,10);
      if(da !== db) return db.localeCompare(da);
      const na = a.name || '', nb = b.name || '';

function fillWin(mode){
  const root = document.getElementById('modalBody');
  const set = (n, v) => { const el = root.querySelector(`[name="${n}"]`); if(el) el.value = v; };
  if(mode === 'clear'){ set('winStart',''); set('winEnd',''); toast('已清空送达时段'); return; }
  const [a, b] = mode === 'this' ? sunWeek(new Date()) : nextSunWeek();
  set('winStart', a); set('winEnd', b);
  toast(`已填充${mode === 'this' ? '本周' : '下周'}时段：${a} ~ ${b}`, 'ok');
}

/* 内置 .xlsx 解析（ZIP stored / deflate + 简单 sheet XML），离线兜底 */
async function parseXLSXBuiltin(buf){

    const nlen = dv.getUint16(p + 28, true), elen = dv.getUint16(p + 30, true), clen = dv.getUint16(p + 32, true);

      data = new Uint8Array(await new Response(new Blob([data]).stream().pipeThrough(ds)).arrayBuffer());
    } else if(method !== 0) throw new Error('不支持的 xlsx 压缩格式');
    entries[name] = dec.decode(data);

  const shared = [];
  if(entries['xl/sharedStrings.xml']){
    const sd = new DOMParser().parseFromString(entries['xl/sharedStrings.xml'], 'application/xml');
    [...sd.getElementsByTagName('si')].forEach(si => shared.push([...si.getElementsByTagName('t')].map(t => t.textContent).join('')));
  }
  const colIdx = ref => { let n = 0; for(const ch of String(ref || '').replace(/[^A-Z]/g,'')) n = n * 26 + (ch.charCodeAt(0) - 64); return n - 1; };

    const o = {}; head.forEach((h, i) => { if(h) o[h] = r[i] === undefined ? '' : r[i]; });
    return o;
  }).filter(r => Object.values(r).some(v => String(v).trim() !== ''));
}
function pick(row, names){
  for(const n of names){
    if(!row || row[n] === undefined || row[n] === null) continue;
    const raw = row[n];
    if(typeof raw === 'string' && raw.trim() === '') continue;
    if(raw instanceof Date){
      const d = raw, pad = x => String(x).padStart(2, '0');
      if(isNaN(d.getTime())) continue;
      const day = d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
      return (d.getHours() || d.getMinutes()) ? day + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes()) : day;

      const d = new Date(Math.round((Number(raw) - 25569) * 86400000));
      const pad = x => String(x).padStart(2, '0');
      return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate());
    }
    if(/时间|日期|时段|送达|离港|到港/.test(names.join(''))) return String(raw).trim().replace('T', ' ').slice(0, 10);

      snapshot('before-import', true); // 导入前留一份可恢复快照
      const res = handleImport(target, rows);
      saveDB(); render();
      showImportResult(target, res);
    }catch(err){ console.error('[import]', err); toast('导入失败：' + (err && err.message ? err.message : '未知错误'), 'err'); }
  };
  fr.onerror = () => toast('文件读取失败，请重试', 'err');

function hasCell(rw, names){ return names.some(n => rw[n] !== undefined && rw[n] !== null && String(rw[n]).trim() !== ''); }
function handleImport(page, rows){
  const items = [];
  let added = 0, updated = 0, skipped = 0, failed = 0;
  const isSkuPage = page === 'inventory' || page === 'skus';
  const push = (rw, status, note) => {
    const base = isSkuPage
      ? { '子ASIN': pick(rw,['子ASIN']), MSKU: pick(rw,['MSKU']), 父ASIN: pick(rw,['父ASIN','父体']), 店铺: pick(rw,['店铺']), 颜色: pick(rw,['颜色']) }
      : { 'FBA货件ID': pick(rw,['FBA货件ID','货件ID']), 'FBA仓': pick(rw,['FBA仓','仓库']), 'FBA货件名': pick(rw,['FBA货件名','货件名']), 店铺: pick(rw,['店铺']) };
    items.push(Object.assign(base, { 状态: status, 说明: note }));
    if(status === '失败') failed++;
  };
  if(isSkuPage){
    /* 具体产品情况 / 产品库存情况 共用规则：
       子ASIN + MSKU 同时匹配 → 覆盖已填字段；两者同时不存在 → 新增；
       任一已存在但错配（如子ASIN一致而MSKU不一致 / MSKU不存在）→ 异常失败，不覆盖。
       模板所有字段都不必填，只上传已填写字段；空单元格不覆盖原值。 */
    rows.forEach(rw => {
      try{
        const ca = pick(rw, ['子ASIN']); const msku = pick(rw, ['MSKU']);
        if(!ca || !msku){ push(rw, '失败', !ca && !msku ? '缺少子ASIN与MSKU（规则判断必需）' : (!ca ? '缺少子ASIN（规则判断必需）' : '缺少MSKU（规则判断必需）')); return; }
        const sameCa = (DB.skus || []).filter(x => x.childAsin === ca);
        const sameMsku = (DB.skus || []).filter(x => x.msku === msku);
        const ex = (DB.skus || []).find(x => x.childAsin === ca && x.msku === msku);
        const filled = {
          shop: pick(rw,['店铺']) || undefined,
          parent: pick(rw,['父ASIN','父体']) || undefined,
          color: pick(rw,['颜色']) || undefined,
          img: pick(rw,['产品图片','图片']) || undefined,
          fbaSellable: hasCell(rw,['FBA在售','在售库存']) ? num(pick(rw,['FBA在售','在售库存'])) : undefined,
          transit: hasCell(rw,['在途库存','在途']) ? num(pick(rw,['在途库存','在途'])) : undefined,
          factoryUnshipped: hasCell(rw,['工厂未出货']) ? num(pick(rw,['工厂未出货'])) : undefined
        };
        Object.keys(filled).forEach(k => { if(filled[k] === undefined) delete filled[k]; });
        if(!ex){
          if(sameCa.length || sameMsku.length){
            push(rw, '失败', sameCa.length
              ? '子ASIN已存在但MSKU不一致或不存在，匹配错误，未覆盖数据'
              : 'MSKU已存在但子ASIN不一致或不存在，匹配错误，未覆盖数据');
            return;
          }
          DB.skus.unshift(Object.assign(newRecord(), {
            id: uid('sk'), childAsin: ca, msku,
            shop:'', parent:'', color:'', img:'', fbaSellable:0, transit:0, factoryUnshipped:0, sku:'', type:''
          }, filled));
          added++; push(rw, '成功', '子ASIN与MSKU均不存在，已按表格内容新增');
          return;
        }
        Object.assign(ex, filled); // 只覆盖已填字段
        updated++; push(rw, '成功', '子ASIN与MSKU同时匹配，已覆盖已填字段');
      }catch(e){ push(rw, '失败', '解析异常：' + e.message); }
    });
  } else if(page === 'shipments'){
    /* 规则：FBA货件ID不存在 → 新增；已存在 → 必须「FBA货件ID + FBA仓」同时匹配才覆盖；错配报失败。
       模板所有字段都不必填，只上传已填写字段；空单元格不覆盖原值。 */
    rows.forEach(rw => {
      try{
        const sid = pick(rw, ['FBA货件ID','货件ID']); const wh = pick(rw, ['FBA仓','仓库']);
        if(!sid || !wh){ push(rw, '失败', !sid && !wh ? '缺少FBA货件ID与FBA仓' : (!sid ? '缺少FBA货件ID' : '缺少FBA仓')); return; }
        const sameId = (DB.shipments || []).filter(x => x.shipmentId === sid);
        const ex = sameId.find(x => x.warehouse === wh);
        const g = (names, cur) => pick(rw, names) || cur || '';
        const dateVal = names => (pick(rw, names) || '').slice(0, 10); // 只精确到年月日
        const filled = {
          shop: pick(rw,['店铺']) || undefined,
          createdAt: pick(rw,['创建时间']) ? pick(rw,['创建时间']).replace(' ', 'T').slice(0,10) : undefined,
          parent: pick(rw,['父ASIN','父体']) || undefined,
          name: pick(rw,['FBA货件名','货件名']) || undefined,
          method: pick(rw,['货代方式','物流方式']) || undefined,
          depart: dateVal(['离港时间','离港']) || undefined,
          arrive: dateVal(['到港时间','到港']) || undefined,
          winStart: dateVal(['预计送达时段开始','送达时段开始','时段开始']) || undefined,
          winEnd: dateVal(['预计送达时段结束','送达时段结束','时段结束']) || undefined,
          delivered: dateVal(['送达时间','送达']) || undefined,
          note: pick(rw,['备注']) || undefined
        };
        Object.keys(filled).forEach(k => { if(filled[k] === undefined) delete filled[k]; });
        if(!ex){
          if(sameId.length){ push(rw, '失败', 'FBA货件ID已存在但FBA仓不一致，需ID与FBA仓同时匹配才能覆盖'); return; }
          DB.shipments.unshift(Object.assign(newRecord(), {
            id: uid('sh'), shipmentId: sid, warehouse: wh,
            shop:'', parent:'', name:'', method:'', depart:'', arrive:'',
            winStart:'', winEnd:'', delivered:'', note:'', createdAt: today()
          }, filled));
          added++; push(rw, '成功', 'FBA货件ID不存在，已新增该货件');
          return;
        }
        Object.assign(ex, filled); // 空单元格保留原值
        updated++; push(rw, '成功', 'FBA货件ID与FBA仓同时匹配，已覆盖已填字段');
      }catch(e){ push(rw, '失败', '解析异常：' + e.message); }
    });
  }
  return { added, updated, skipped, failed, items };
}
/* 导入结果回传弹窗：失败行标红，可下载结果表格 */

        <p class="imp-note">表格所有字段都不必全部填写：只上传已填写字段，空单元格不覆盖原有数据。导入模板与结果表格均为 .xlsx 格式。</p>

}
/* 下载导入结果表格：标准 .xlsx 格式，失败行整行标红 */
function downloadImportResult(){
  if(!lastImportResult){ toast('暂无导入结果', 'err'); return; }
  const { page, res } = lastImportResult;

function validEmail(e){ return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(String(e || '').trim()); }
function findUserByEmail(email){
  const em = String(email || '').trim().toLowerCase();
  if(!em) return null;
  const users = getUsers();
  return Object.keys(users).find(n => String(users[n].email || '').toLowerCase() === em) || null;
}
function setPassword(name, pw){
  const users = getUsers(), u = users[name];
  if(!u) return false;

function setLoginMode(m){ loginMode = m; if(m !== 'reset') resetUser = null; drawLogin(); }
function lgErr(msg){ const el = document.getElementById('lgErr'); if(el) el.textContent = msg || ''; }
function loginSubmit(ev){
  if(ev && ev.preventDefault) ev.preventDefault();
  const name = (document.getElementById('lgUser').value || '').trim();
  const pw = document.getElementById('lgPass').value || '';
  lgErr('');
  if(!name){ lgErr('请输入用户名'); return; }
  if(/\s/.test(name)){ lgErr('用户名不能包含空格'); return; }
  if(!pw){ lgErr('请输入密码'); return; }
  if(loginMode === 'register'){
    if(pw.length < 4){ lgErr('密码至少 4 位'); return; }
    const pw2 = document.getElementById('lgPass2').value || '';
    if(pw !== pw2){ lgErr('两次输入的密码不一致'); return; }
    const email = (document.getElementById('lgEmail').value || '').trim().toLowerCase();
    if(!email){ lgErr('请填写绑定邮箱（用于忘记密码时重置）'); return; }
    if(!validEmail(email)){ lgErr('邮箱格式不正确，请检查'); return; }
    const users = getUsers();
    if(users[name]){ lgErr('该用户名已被注册，请更换或改为登录'); return; }
    const owner = findUserByEmail(email);
    if(owner){ lgErr('该邮箱已被账号「' + owner + '」绑定，请更换'); return; }
    const salt = uid('s');
    users[name] = { salt, hash: hashPwd(pw, salt), email, createdAt: nowDT() };
    saveUsers(users);
    prefillUser = '';
    migrateLegacyData(name); // 首位注册用户继承旧版数据
    enterUser(name, { silent: true });
    const h = location.hash.slice(1);
    if(NAV.some(n => n.key === h)) S.page = h;
    render();
    toast('注册成功，欢迎 ' + name, 'ok');
  } else {
    const u = getUsers()[name];
    if(!u || hashPwd(pw, u.salt) !== u.hash){ lgErr('用户名或密码错误，忘记密码可用绑定邮箱重置'); return; }
    prefillUser = '';
    enterUser(name);
  }
}
/* 忘记密码：邮箱验证 → 设置新密码（无需原密码） */
function resetSubmit(ev){
  if(ev && ev.preventDefault) ev.preventDefault();
  lgErr('');
  if(!resetUser){
    const em = (document.getElementById('lgEmail').value || '').trim();
    if(!em){ lgErr('请输入绑定邮箱'); return; }
    if(!validEmail(em)){ lgErr('邮箱格式不正确，请检查'); return; }
    const owner = findUserByEmail(em);
    if(!owner){ lgErr('该邮箱未绑定任何账号，请检查邮箱或登录后在「账户设置」中绑定'); return; }
    resetUser = owner;
    drawLogin();
    toast('邮箱验证通过', 'ok');
    return;
  }
  const pw = document.getElementById('lgPass').value || '';
  const pw2 = document.getElementById('lgPass2').value || '';
  if(!pw){ lgErr('请输入新密码'); return; }
  if(pw.length < 4){ lgErr('密码至少 4 位'); return; }
  if(pw !== pw2){ lgErr('两次输入的密码不一致'); return; }
  const who = resetUser;
  setPassword(who, pw);
  resetUser = null; loginMode = 'login'; prefillUser = who;
  drawLogin();
  toast('密码已重置，请用新密码登录', 'ok');
}

        <div class="login-field"><label>当前密码</label><input id="accOld" type="password" maxlength="32" placeholder="请输入当前密码"></div>
        <div class="login-field"><label>新密码</label><input id="accNew" type="password" maxlength="32" placeholder="至少 4 位"></div>
        <div class="login-field"><label>确认新密码</label><input id="accNew2" type="password" maxlength="32" placeholder="请再次输入新密码"></div>
        <div class="acc-err" id="accPwErr"></div>
        <div class="acc-acts">
          <button class="btn" onclick="savePassword()">保存新密码</button>
          <button class="btn ghost" onclick="closeModal();logout()">退出登录</button>
        </div>
        <div class="acc-sec">数据备份与恢复<span class="acc-hint">建议每周导出一次，换电脑或清理浏览器后可完整还原</span></div>
        <div class="acc-bar ${pct >= 90 ? 'danger' : pct >= 70 ? 'warn' : ''}"><span style="width:${pct}%"></span></div>
        <div class="acc-sub">本地存储占用约 ${pct}%（${usedK}K / 上限约 4500K 字符，含本浏览器全部账号）<br>最近快照：${esc(bakTxt)}</div>
        <div class="acc-sub">回收站：${(DB.trash || []).length} 条记录（删除后保留 ${TRASH_DAYS} 天，期间可恢复，到期自动彻底删除）</div>
        <div class="acc-acts">
          <button class="btn ghost sm" onclick="exportBackup()">⬇ 导出全部数据</button>
          <button class="btn ghost sm" onclick="importBackupPick()">⬆ 导入备份</button>
          <button class="btn ghost sm" onclick="restoreSnapshot()">↺ 恢复自动快照</button>
          <button class="btn ghost sm" onclick="closeModal();go('trash')">🗑 打开回收站</button>
        </div>
        <div class="acc-err" id="accDataMsg"></div>
        <div class="acc-sub" style="margin-top:10px">数据版本 v${DB_VERSION} · 单文件离线运行，数据保存在本机浏览器</div>
        <div class="acc-sec">长期使用维护<span class="acc-hint">数据积累较多时，归档已完成的历史记录可释放本地空间</span></div>
        <div class="acc-sub">记录数：产品 ${st.products} · 货件 ${st.shipments} · 库存 ${st.inventory} · 促销 ${st.promotions} · 工厂单 ${st.factoryOrders} · 打样 ${st.sampling} · SKU ${st.skus}<br>本地图片占用约 ${st.imgKB}K（建议单账号控制在 1200K 以内，超出请改用图片链接）</div>
        <div class="acc-acts">
          <button class="btn ghost sm" onclick="archiveOldData(180)">归档 180 天前已完成记录</button>
          <button class="btn ghost sm" onclick="selfCheck()">运行稳定性自检</button>
        </div>
        <div class="acc-err" id="selfCheckMsg"></div>
      </div>
    </div>
  </div>`;
}
/* ================= 长期维护：容量统计 / 归档清理 / 自检 ================= */
function imgUsageChars(){
  let n = 0;
  const add = v => { if(typeof v === 'string' && v.slice(0, 11) === 'data:image/') n += v.length; };
  (DB.products || []).forEach(p => (p.colors || []).forEach(c => add(c.img)));
  (DB.skus || []).forEach(s => add(s.img));
  return n;
}
function dataStats(){
  const c = k => (DB[k] || []).length;
  return { products:c('products'), promotions:c('promotions'), shipments:c('shipments'), inventory:c('skus'),
    factoryOrders:c('factoryOrders'), sampling:c('sampling'), skus:c('skus'), creators:c('creators'), ads:c('ads'),
    imgKB: Math.round(imgUsageChars() / 1024) };
}
function archiveCutoff(days){ const d = new Date(); d.setDate(d.getDate() - days); return iso(d); }
function archiveCount(days){
  const cut = archiveCutoff(days || 180);
  return {
    shipments: (DB.shipments || []).filter(s => s.delivered && String(s.delivered).slice(0,10) < cut).length,
    promotions: (DB.promotions || []).filter(p => p.end && String(p.end).slice(0,10) < cut).length,
    factoryOrders: (DB.factoryOrders || []).filter(o => o.shippedAt && String(o.shippedAt).slice(0,10) < cut).length,
    sampling: (DB.sampling || []).filter(s => s.doneAt && String(s.doneAt).slice(0,10) < cut).length
  };
}
function archiveOldData(days){
  days = days || 180;
  const c = archiveCount(days);
  const total = c.shipments + c.promotions + c.factoryOrders + c.sampling;
  if(!total){ toast('没有超过 ' + days + ' 天且已完成的历史记录，暂不需要清理', 'ok'); return; }
  confirmModal('将清理 ' + days + ' 天前已完成的记录：已送达货件 ' + c.shipments + ' 票、已结束促销 ' + c.promotions +
    ' 条、已出货工厂单 ' + c.factoryOrders + ' 条、已完成打样 ' + c.sampling + ' 条，共 ' + total +
    ' 条。创作者计划（含已完成历史）不会被自动清理，永久保留。清理前会自动导出完整备份文件，可随时从该文件恢复。确定继续吗？', () => {
    try{
      exportBackup(); // 先留一份完整备份
      const cut = archiveCutoff(days);
      DB.shipments = DB.shipments.filter(s => !(s.delivered && String(s.delivered).slice(0,10) < cut));
      DB.promotions = DB.promotions.filter(p => !(p.end && String(p.end).slice(0,10) < cut));
      DB.factoryOrders = DB.factoryOrders.filter(o => !(o.shippedAt && String(o.shippedAt).slice(0,10) < cut));
      DB.sampling = DB.sampling.filter(s => !(s.doneAt && String(s.doneAt).slice(0,10) < cut));
      // 注意：DB.creators 不参与任何自动清理（已完成历史永久保留，仅用户手动删除才移除）
      saveDB(true); render(); openAccountPanel();
      toast('已归档清理 ' + total + ' 条历史记录，备份文件已下载', 'ok');
    }catch(e){ console.error(e); toast('清理失败：' + e.message, 'err'); }
  }, '确认清理');
}
/* 一键自检：把最容易出问题的几项做成可读结论，便于定期确认数据健康度 */
function selfCheck(){
  const issues = [], notes = [];
  const pct = storagePct();
  notes.push('存储占用 ' + pct + '%（' + Math.round(usageChars()/1024) + 'K / 约 4500K）');
  if(pct >= 90) issues.push('存储空间即将耗尽：请导出备份并归档旧数据，或把本地图片改为链接');
  else if(pct >= 70) notes.push('存储偏满，建议归档 180 天前的历史记录');

  const imgK = Math.round(imgUsageChars()/1024);
  notes.push('本地图片占用 ' + imgK + 'K');
  if(imgK > 1200) issues.push('本地图片超过 1200K：本地存储约 5M 上限，图片过多会挤压业务数据空间');

  const st = dataStats();
  notes.push('记录数：产品 ' + st.products + ' · 货件 ' + st.shipments + ' · 库存 ' + st.inventory + ' · 促销 ' + st.promotions +
    ' · 工厂单 ' + st.factoryOrders + ' · 打样 ' + st.sampling + ' · SKU ' + st.skus);

  // 结构完整性
  const bad = COLLS.filter(k => !Array.isArray(DB[k]));
  if(bad.length) issues.push('数据结构异常：' + bad.join('、') + ' 不是数组');
  // 重复 id（同一集合内重复会导致编辑删错行）
  let dup = 0;
  COLLS.forEach(k => {
    const seen = new Set();
    (DB[k] || []).forEach(r => { if(!r || !r.id) return; if(seen.has(r.id)) dup++; else seen.add(r.id); });
  });
  if(dup) issues.push('发现 ' + dup + ' 个重复 id 的记录（建议导出备份后检查）');
  // 关键字段缺失
  const noSku = (DB.products || []).filter(p => !p.sku).length;
  if(noSku) issues.push(noSku + ' 个产品缺少货号');
  const noShipId = (DB.shipments || []).filter(s => !s.shipmentId).length;
  if(noShipId) notes.push(noShipId + ' 票货件未填 FBA 货件ID（不影响提醒，仅导入匹配需要）');

  const bak = readSnapshot();
  notes.push(bak ? '最近快照：' + new Date(bak.at).toLocaleString('zh-CN', { hour12: false }) : '暂无自动快照（数据变动后会自动生成）');

  const msg = (issues.length ? '⚠ 发现 ' + issues.length + ' 项需要处理：\n· ' + issues.join('\n· ') + '\n\n' : '✅ 自检通过，未发现影响稳定运行的问题。\n\n') + notes.join('\n');
  const el = document.getElementById('selfCheckMsg');
  if(el){
    el.style.whiteSpace = 'pre-wrap';
    el.style.color = issues.length ? '' : 'var(--acc)'; // 通过用主题色，问题用告警色
    el.textContent = msg;
  }
  toast(issues.length ? '自检发现 ' + issues.length + ' 项待处理问题' : '自检通过：数据状态正常', issues.length ? 'err' : 'ok');
  return { issues, notes, pct, imgK };
}

/* ================= 数据备份 / 恢复 ================= */
function exportBackup(){
  try{
    if(!DB){ toast('尚未登录', 'err'); return; }
    snapshot('export', true);
    const payload = {
      app: 'amz-workbench', ver: DB_VERSION, user: S.user, exportedAt: nowDT(),
      db: DB,
      settings: {
        remCol: S.remCol, sort: S.sort, cols: S.cols, remOrder: S.remOrder,
        theme: document.documentElement.getAttribute('data-theme') || 'forest'
      },
      account: { name: S.user, email: (getUsers()[S.user] || {}).email || '' }
    };
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(payload)], { type: 'application/json' }));
    const d = new Date(), p2 = n => String(n).padStart(2, '0');
    a.download = `亚马逊工作台备份_${S.user}_${d.getFullYear()}${p2(d.getMonth()+1)}${p2(d.getDate())}_${p2(d.getHours())}${p2(d.getMinutes())}.json`;
    a.click();
    setTimeout(() => { try { URL.revokeObjectURL(a.href); } catch(e){} }, 5000);
    toast('备份已导出（含全部业务数据与个人设置）', 'ok');
  }catch(e){ console.error(e); toast('导出失败：' + e.message, 'err'); }
}
function importBackupPick(){
  const inp = document.getElementById('bakFileInput');
  if(!inp) return;
  inp.value = ''; inp.click();
}
function onBackupFile(input){
  const f = input.files && input.files[0]; if(!f) return;
  const fr = new FileReader();
  fr.onload = () => {
    let obj = null;
    try { obj = JSON.parse(String(fr.result || '')); } catch(e){ toast('文件不是有效的 JSON 备份', 'err'); return; }
    if(!obj || !obj.db || !Array.isArray(obj.db.products)){ toast('备份文件格式不正确（缺少业务数据）', 'err'); return; }
    confirmModal('导入将覆盖当前账号的全部业务数据（当前数据会先自动存一份快照）。确定继续吗？', () => {
      try{
        snapshot('before-import', true);
        DB = normalizeDB(obj.db);
        saveDB();
        if(obj.settings){
          S.remCol = obj.settings.remCol || {}; S.sort = obj.settings.sort || {};
          S.cols = obj.settings.cols || {}; S.remOrder = obj.settings.remOrder || null;
          saveRemCol(); saveSort(); saveCols(); saveRemOrder();
          if(obj.settings.theme) applyThemeQuiet(obj.settings.theme);
        }
        render();
        toast('备份已导入：' + DB.products.length + ' 个产品 / ' + (DB.shipments || []).length + ' 票货件', 'ok');
      }catch(e){ console.error(e); toast('导入失败：' + e.message, 'err'); }
    });
  };
  fr.onerror = () => toast('文件读取失败，请重试', 'err');
  fr.readAsText(f);
}
function restoreSnapshot(){
  const bak = readSnapshot();
  if(!bak){ toast('暂无可用自动快照（数据变动后会自动生成）', 'err'); return; }
  const t = new Date(bak.at || 0), p2 = n => String(n).padStart(2, '0');
  const when = t.getFullYear() + '-' + p2(t.getMonth()+1) + '-' + p2(t.getDate()) + ' ' + p2(t.getHours()) + ':' + p2(t.getMinutes());
  confirmModal('将恢复到 ' + when + ' 的自动快照，当前数据会被覆盖（覆盖前会再存一份快照）。确定继续吗？', () => {
    try{
      const parsed = JSON.parse(bak.json);
      snapshot('before-restore', true);
      DB = normalizeDB(parsed);
      saveDB(); render();
      toast('已恢复到 ' + when + ' 的数据', 'ok');
    }catch(e){ console.error(e); toast('快照恢复失败：' + e.message, 'err'); }
  });
}
function accErr(id, msg){ const el = document.getElementById(id); if(el) el.textContent = msg || ''; }
function saveEmail(){
  accErr('accErr', '');
  const em = (document.getElementById('accEmail').value || '').trim().toLowerCase();
  if(!em){ accErr('accErr', '请输入邮箱地址'); return; }
  if(!validEmail(em)){ accErr('accErr', '邮箱格式不正确，请检查'); return; }
  const owner = findUserByEmail(em);
  if(owner && owner !== S.user){ accErr('accErr', '该邮箱已被账号「' + owner + '」绑定，请更换'); return; }
  const users = getUsers();
  if(!users[S.user]) return;
  users[S.user].email = em; saveUsers(users);
  toast('邮箱已绑定：' + em, 'ok');
  openAccountPanel();
}
function savePassword(){
  accErr('accPwErr', '');
  const oldPw = document.getElementById('accOld').value || '';
  const nw = document.getElementById('accNew').value || '';
  const nw2 = document.getElementById('accNew2').value || '';
  const u = getUsers()[S.user];
  if(!u){ toast('账号状态异常，请重新登录', 'err'); return; }
  if(!oldPw){ accErr('accPwErr', '请输入当前密码'); return; }
  if(hashPwd(oldPw, u.salt) !== u.hash){ accErr('accPwErr', '当前密码不正确'); return; }
  if(!nw){ accErr('accPwErr', '请输入新密码'); return; }
  if(nw.length < 4){ accErr('accPwErr', '密码至少 4 位'); return; }
  if(nw !== nw2){ accErr('accPwErr', '两次输入的新密码不一致'); return; }
  if(nw === oldPw){ accErr('accPwErr', '新密码不能与当前密码相同'); return; }
  setPassword(S.user, nw);
  toast('密码已修改，下次登录请使用新密码', 'ok');
  openAccountPanel();
}

/* ================= 启动 ================= */
(function boot(){
  try{
    const sess = safeGet(SESSION_KEY);
    if(sess && getUsers()[sess]) enterUser(sess, { silent: true });
    else { showLogin(); return; }
    const _h = location.hash.slice(1);
    if(NAV.some(n => n.key === _h)) S.page = _h;
    render();
  }catch(e){
    console.error('[boot]', e);
    try { showLogin(); } catch(_){}
    setTimeout(() => { try { toast('初始化异常：' + e.message + '，请导出备份后反馈', 'err'); } catch(_){} }, 300);
  }
})();
window.addEventListener('hashchange', () => { if(!S.user) return; const h = location.hash.slice(1); if(NAV.some(n => n.key === h) && h !== S.page){ S.page = h; closeDrawer(); render(); } });
/* 回收站到期巡检：应用长时间开着也能按期彻底删除（每 30 分钟一次） */
setInterval(() => {
  if(!DB) return;
  try {
    if(purgeTrash(true)){ saveDB(); if(S.page === 'trash') render(); }
  } catch(e){ console.error('[trash]', e); }
}, 30 * 60 * 1000);
/* Esc 关闭弹窗（桌面端习惯操作） */
document.addEventListener('keydown', e => {
  if(e.key === 'Escape'){
    const root = document.getElementById('modalRoot');
    if(root && root.innerHTML) closeModal();
  }
});
/* 跨天自动刷新提醒：网页长期挂着也能看到当天提醒，不打断正在填写的内容 */
let lastDaySeen = today();
setInterval(() => {
  try{
    if(!S.user || !DB) return;
    const d = today();
    if(d === lastDaySeen) return;
    lastDaySeen = d;
    const ae = document.activeElement;
    const typing = ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName || '');
    if(document.querySelector('#modalRoot .overlay') || typing) return; // 正在编辑时不打断
    render();
    toast('已跨天，提醒已按 ' + d + ' 重新计算', 'ok');
  }catch(e){ console.error('[dayRollover]', e); }
}, 60000);
/* 多标签页同步：其他标签页保存后自动同步，避免互相覆盖 */
window.addEventListener('storage', ev => {
  try{
    if(!S.user || !ev.key) return;
    if(ev.key !== ukey('workbench')) return;
    if(document.querySelector('#modalRoot .overlay')){
      toast('其他标签页已更新数据，请先关闭弹窗并刷新本页，避免覆盖', 'err');
      return;
    }
    loadDB({ persist: false }); // 只读同步，不回写，避免两个标签页互相触发写入
    render();
    toast('已同步其他标签页的数据更新', 'ok');
  }catch(e){ console.error('[storage]', e); }
});
/* 保存失败时离开页面给出提示，避免静默丢数据 */
window.addEventListener('beforeunload', e => {
  if(!saveFailed) return;
  e.preventDefault();
  e.returnValue = '数据尚未成功保存到本地，确定离开吗？';
  return e.returnValue;
});
/* 未捕获异常集中记录，便于排查；不打断用户操作 */
let _errShownAt = 0;
window.addEventListener('error', ev => {
  console.error('[global]', ev.error || ev.message);
  const now = Date.now();
  if(now - _errShownAt < 5000) return;
  _errShownAt = now;
  try { toast('操作出现异常，已记录。若界面异常请导出备份后刷新', 'err'); } catch(e){}
});
window.addEventListener('unhandledrejection', ev => { console.error('[promise]', ev.reason); });
/* 跨断点（桌面 ↔ 手机）时重绘一次：手机卡片布局的字段标签只在窄屏注入 */
let _wasMobile = isMobileLayout();
window.addEventListener('resize', () => {
  if(!isMobileLayout()) closeDrawer();
  const m = isMobileLayout();
  if(m !== _wasMobile){ _wasMobile = m; try { if(S.user && DB) render(); } catch(e){ console.error('[resize]', e); } }
});
</script>
